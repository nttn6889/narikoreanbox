<style>
:root{--p:#53468F;--y:#D4A843;--bg:#f6f4fb;--card:#fff;--tx:#222;--mu:#666;--ln:#e3dff0}

<script>
var D=[{"g": "Trang cá nhân \"Tiếng Hàn Ngân Nguyễn\" — bộ 1", "t": "0. Sửa trang (cô tự làm trên điện thoại)", "i": ["ca-nhan/bia.png", "ca-nhan/ghim-1.png", "../quang-cao/topik2-len-3-4/7-ve-co.png", "../quang-cao/topik2-len-3-4/4-app.png", "../quang-cao/topik2-len-3-4/5-danh-gia.png"], "c": "- Ảnh bìa: bia.png. Trên điện thoại ảnh đại diện che phần giữa phía dưới, nên chữ đã để phía trên và hai bên.\n- Tiểu sử (101 ký tự):\n  Giáo viên tiếng Hàn · Luyện thi TOPIK II · Cử nhân ĐH Daegu · Trực tiếp Quỳnh Lưu & online · Zalo 0399 214 554\n- Thông tin cá nhân:\n  - Học vấn: thêm \"Đại học Daegu (대구대학교) – Quản trị kinh doanh\".\n  - Công việc: \"Giáo viên tiếng Hàn – Nari TOPIK\".\n  - Sống tại: đổi thành Quỳnh Lưu. Daegu để ở mục \"Từng sống tại\".\n- Liên kết: https://hoc.naritopik.com/ve-co/\n- Đáng chú ý: ghim-1.png, quang-cao/topik2-len-3-4/7-ve-co.png, 4-app.png, 5-danh-gia.png", "m": ""}, {"g": "Trang cá nhân \"Tiếng Hàn Ngân Nguyễn\" — bộ 1", "t": "1. Bài ghim", "i": ["ca-nhan/ghim-1.png", "../quang-cao/topik2-len-3-4/7-ve-co.png", "../quang-cao/topik2-len-3-4/4-app.png", "../quang-cao/topik2-len-3-4/5-danh-gia.png", "../quang-cao/topik2-len-3-4/3-lo-trinh.png"], "c": "Năm 2005 cô sang Hàn với vốn tiếng Hàn gần như bằng 0. Một năm học tiếng ở Viện tiếng Hàn của Đại học Daegu, rồi bốn năm học Quản trị kinh doanh bằng tiếng Hàn, ngồi cùng giảng đường với sinh viên Hàn Quốc.\n\nSau đó là gần mười năm làm phiên dịch, trưởng phòng, giám đốc chi nhánh cho các công ty Hàn. Từ năm 2020 cô về Quỳnh Lưu đứng lớp.\n\nĐi một vòng như vậy, cô hiểu một điều: học tiếng Hàn để thi không cần học tất cả, mà cần học đúng phần đề hay ra.\n\nVì thế lớp TOPIK của cô học theo đề thật:\n📊 Cô thống kê 20 đề đọc TOPIK II. Từ nào, dạng câu nào hay ra thì học trước.\n📱 Mỗi ngày có bài trên app: từ vựng, nghe, đề thật. Em nộp là cô chấm.\n✍️ Bài viết câu 51–54 được chữa từng câu, so với bài mẫu.\n📈 Định kỳ có bảng đánh giá: em biết mình yếu ở dạng câu nào để sửa đúng chỗ.\n\n📍 Học trực tiếp tại Quỳnh Lưu · 💻 Online toàn quốc\nEm muốn học thử, cứ inbox cô hoặc nhắn Zalo 0399 214 554 nhé. 💙\n\n#NariTOPIK #TOPIK2 #LuyenthiTOPIK #TiengHan", "m": ""}, {"g": "Trang cá nhân \"Tiếng Hàn Ngân Nguyễn\" — bộ 1", "t": "2. Một từ, một câu chuyện #1 — 위하다", "i": ["ca-nhan/tu-01-wihada.png"], "c": "Hồi mới sang Hàn, câu cô nghe nhiều nhất từ bố mẹ ở nhà là: \"Cố lên, vì tương lai của con.\"\nTiếng Hàn nói câu đó bằng một từ rất quen: 위하다.\n\n너의 미래를 위해 – vì tương lai của con.\n\n[Cô kể thêm 1–2 câu: ngày đó cô học vì ai, vì điều gì]\n\nCó một điều cô thống kê được: 위하다 có mặt ở cả 20/20 đề đọc TOPIK II cô đã phân tích. Nắm 3 mẫu này là đọc đâu cũng hiểu:\n• N을/를 위해(서) – vì N\n• V-기 위해(서) – để làm V\n• N을/를 위한 N – N dành cho N\n\n💡 Mẹo câu 3–4: đề hay hỏi -고자 = -기 위해. Gặp -고자 là nghĩ ngay \"để\".\n\nCòn em, em học tiếng Hàn 위해서 điều gì? Comment cho cô biết nhé 👇\n\n#MotTuMotCauChuyen #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Trang cá nhân \"Tiếng Hàn Ngân Nguyễn\" — bộ 1", "t": "3. Một từ, một câu chuyện #2 — 통하다", "i": ["ca-nhan/tu-02-tonghada.png"], "c": "Cô vẫn nhớ cảm giác lần đầu nói chuyện với người Hàn mà không phải nghĩ trong đầu trước. [Kể ngắn: lúc nào, với ai]\n\nNgười Hàn gọi khoảnh khắc đó là 말이 통하다 – lời nói \"thông\" được với nhau.\nLâu hơn nữa thì thành 마음이 통하다 – hiểu lòng nhau.\n\nTrong đề thi, 통하다 xuất hiện ở 20/20 đề đọc, nhưng gần như luôn ở dạng N을/를 통해(서) – \"thông qua\".\n대량 생산과 대량 소비를 통해… – Thông qua sản xuất và tiêu dùng hàng loạt…\n\nGặp 을 통해 là biết ngay: phía trước là cách thức, phía sau là kết quả.\n\nChúc các em sớm có ngày 말이 통하는 날 với tiếng Hàn 💙\n\n#MotTuMotCauChuyen #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Trang cá nhân \"Tiếng Hàn Ngân Nguyễn\" — bộ 1", "t": "4. Một từ, một câu chuyện #3 — 자신", "i": ["ca-nhan/tu-03-jasin.png"], "c": "Có em học sinh nói với cô: \"Cô ơi, em không có 자신 làm đề TOPIK II.\"\n\nMột chữ 자신, hai nghĩa:\n• 자신 (自身 – tự thân): bản thân\n• 자신 (自信 – tự tin): sự tự tin, 자신(이) 있다 = tự tin làm được\n\nCô bảo em: muốn có 자신 (tự tin), em phải tin vào 자신 (bản thân) trước đã. 😊\n\nTừ này có mặt ở 20/20 đề đọc TOPIK II. Đề thường dùng nghĩa \"bản thân\": 자신이 직접 만들고 즐길 때… – khi chính mình tự tay làm và tận hưởng…\n\nHọc từ qua chữ Hán Việt giúp người Việt nhớ nhanh gấp đôi. Đây là lợi thế của mình đó các em.\n\n#MotTuMotCauChuyen #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt \"Đọc tiêu đề báo · Câu 25–27\"", "t": "5. Đọc tiêu đề báo #1 — Tăng – giảm", "i": ["ca-nhan/td-01-tang-giam.png", "ca-nhan/td-01b-thu.png", "ca-nhan/td-01c-dap-an.png"], "c": "Câu 25–27 TOPIK II là dạng nhiều em \"sợ\" nhất phần đầu đề đọc. Từ nào cũng biết mà ghép lại vẫn không hiểu tiêu đề nói gì.\n\nLý do là báo Hàn rất ít khi viết 올랐다 hay 떨어졌다. Họ viết 껑충, 고공행진, 하늘 높은 줄 모르는…, đọc theo nghĩa đen thì chẳng thấy chữ \"tăng\" nào cả.\n\nCô xem lại 63 tiêu đề câu 25–27 trong 21 đề đọc: 23 tiêu đề là chuyện giá cả, tăng – giảm. Cứ 3 câu thì có hơn 1 câu rơi vào nhóm này.\n\nẢnh 1 là 14 cách nói tăng – giảm hay gặp nhất. Ảnh 2 là câu 27 trong đề thật TOPIK kỳ 91. Em thử đọc rồi comment số đáp án nhé. Cô hỏi thêm một chữ: 기지개 nghĩa là gì? 😉\n\nTối nay cô đăng đáp án và cách tách tiêu đề ở comment.\n\n#DocTieuDeBao #TOPIK2 #TuVungTOPIK #NariTOPIK", "m": "Đáp án ① 대출 금리가 떨어지면서 부동산 시장이 살아나기 시작했다.\n기지개 là cái vươn vai sau khi ngủ dậy. Trên báo, 기지개(를 켜다) nghĩa là thị trường bắt đầu \"tỉnh dậy\", khởi sắc trở lại.\nBạn nào chọn ③ là bị bẫy chiều ngược: 거래가 줄어들다 (giao dịch giảm) thì trái nghĩa với 기지개.\nMẹo: dấu phẩy giữa hai nửa tiêu đề thường là nguyên nhân → kết quả.\nBài sau cô viết tiếp về nhóm \"được yêu thích, đông người\" (열풍, 구름 관중, 북새통…) nhé. 💙"}, {"g": "⏸ ĐỂ DÀNH — Loạt \"Danh sách ôn TOPIK\" (bí quyết riêng của cô)", "t": "6. Danh sách #1 — 20 từ có mặt ở 20/20 đề đọc", "i": ["ca-nhan/ds-01-20-tu.png"], "c": "Học TOPIK II, nhiều em mua sổ ghi 3.000–4.000 từ rồi… bỏ dở ở trang 30. 😅\n\nCô làm ngược lại: cô tách từng chữ của 20 đề đọc TOPIK II, bỏ từ sơ cấp, rồi đếm xem từ nào đề nào cũng có.\nKết quả: đúng 20 từ không vắng mặt ở đề nào. Riêng 위하다 gặp 396 lần.\n\nHai điều cô rút ra:\n• 5 từ trong đó thật ra là cụm ngữ pháp: 을 위해, 에 대해, 에 따라, 을 통해, 로 인해. Học cả cụm thì đọc câu nhanh hơn hẳn.\n• 16/20 từ là từ Hán: 사회 – xã hội, 영향 – ảnh hưởng, 상황 – tình huống… Người Việt mình có lợi thế lớn ở đây.\n\nEm lưu ảnh lại, mỗi ngày đọc 5 từ. Em thấy từ nào em vẫn hay quên? Comment cho cô nhé 👇\n\n#DanhSachOnTOPIK #TuVungTOPIK #TOPIK2 #NariTOPIK", "m": ""}, {"g": "⏸ ĐỂ DÀNH — Loạt \"Danh sách ôn TOPIK\" (bí quyết riêng của cô)", "t": "7. Danh sách #2 — Chữ tín hiệu trong 4 lựa chọn", "i": ["ca-nhan/ds-02-chu-tin-hieu.png"], "c": "Câu “chọn nội dung đúng với bài” (câu 9–12, 20, 22, 24, 32–34, 43, 47, 50) chiếm gần 1/3 đề đọc. Đọc không kịp bài thì làm sao?\n\nCô soát lại 241 câu dạng này trong 22 đề đọc, đếm từng lựa chọn có chữ “nói tuyệt đối”:\n❌ 전혀 / 절대 xuất hiện 7 lần — chưa lần nào là đáp án.\n❌ 항상 / 늘 / 매일: 1/11. 관계없다 / 필요 없다: 2/19.\n✅ Ngược lại, lựa chọn nói mềm (-기도 하다, -ㄹ 수도 있다, 경우에 따라): 11/12 lần là đáp án đúng.\n\nLý do: bài văn TOPIK hiếm khi nói chắc 100%. Lựa chọn sai thường giữ chữ của bài rồi “nói quá lên”.\n\nNhưng cẩn thận: 모두, 만, 반드시, 가장 thì không phải tín hiệu (≈ 1/4, như đoán bừa). Mẹo này chỉ để loại nhanh khi phân vân, vẫn phải dò lại bài nhé.\n\nEm đã từng bị bẫy “nói quá” bao giờ chưa? 😄\n\n#DanhSachOnTOPIK #DocTOPIK #TOPIK2 #NariTOPIK", "m": ""}, {"g": "Loạt \"Ôn TOPIK cùng cô Ngân\" — đăng ngay bây giờ", "t": "8. Cấu trúc đề TOPIK II", "i": ["ca-nhan/kt-01a-cau-truc-de.png", "ca-nhan/kt-01b-50-cau-doc.png"], "c": "Nhiều em ôn TOPIK II mấy tháng mà vẫn chưa nắm rõ đề có những phần nào, câu nào hỏi gì. Cô tổng hợp lại trong 2 ảnh:\n\n📌 Ảnh 1: 3 phần thi, thời gian, điểm từng câu viết, điểm đạt từng cấp.\n📌 Ảnh 2: 50 câu đọc, câu nào hỏi gì.\n\nBa điều nhiều bạn chưa biết:\n1️⃣ Câu sai không bị trừ điểm → đừng bỏ trống câu nào.\n2️⃣ Không có điểm liệt từng phần: cấp tính theo tổng 300 điểm. Nghe yếu vẫn bù bằng đọc và viết được.\n3️⃣ Câu 54 chiếm 50/100 điểm viết. Bỏ câu 54 là gần như mất luôn cấp 4.\n\nEm lưu lại để ôn nhé. Em đang nhắm cấp mấy? Comment cho cô biết, cô gợi ý nên ưu tiên phần nào 👇\n\n#TOPIK2 #CauTrucDeTOPIK #LuyenthiTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt \"Ôn TOPIK cùng cô Ngân\" — đăng ngay bây giờ", "t": "9. Bộ sưu tập 96 quán ngữ theo bộ phận cơ thể", "i": ["ca-nhan/qn-01-bia.png", "ca-nhan/qn-02-nuan-1.png", "ca-nhan/qn-03-nuan-2.png", "ca-nhan/qn-04-gwi.png", "ca-nhan/qn-05-ip-1.png", "ca-nhan/qn-06-ip-2.png", "ca-nhan/qn-07-son-1.png", "ca-nhan/qn-08-son-2.png", "ca-nhan/qn-09-bal.png", "ca-nhan/qn-10-dau-mat.png", "ca-nhan/qn-11-long.png", "ca-nhan/qn-12-ruot.png", "ca-nhan/qn-13-vai.png", "ca-nhan/qn-14-on-tap.png"], "c": "📚 TỔNG HỢP 96 QUÁN NGỮ TIẾNG HÀN THEO BỘ PHẬN CƠ THỂ (관용 표현)\n\n귀가 얇다 không phải “tai mỏng” mà là cả tin. 손이 크다 không phải “tay to” mà là rộng rãi, hào phóng. 😄\nQuán ngữ là phần dịch từng chữ là sai ngay. Đề đọc TOPIK II có hẳn câu 21 hỏi quán ngữ, còn bài nghe và bài đọc khác cũng dùng rất nhiều.\n\nCô tổng hợp 96 quán ngữ thông dụng, chia theo bộ phận cơ thể cho dễ nhớ:\n👀 눈 (mắt) · 👂 귀 (tai) · 👄 입 (miệng) · ✋ 손 (tay) · 🦶 발 (chân) · 🙂 머리 · 얼굴 · 코 · 💗 가슴 · 마음 · 😣 속 · 애 · 간 · 💪 어깨 · 허리 · 목\nMỗi quán ngữ có nghĩa, câu ví dụ và bản dịch. Ảnh cuối là bài ôn tập 8 câu.\n\n📌 Cách học: mỗi ngày 1 ảnh · che cột nghĩa, nhìn quán ngữ đoán nghĩa · tự đặt 1 câu về em.\n\n👉 Em lưu bài lại để ôn dần, làm bài ôn tập ở ảnh cuối rồi comment đáp án (dạng 1A, 2B…), cô chữa cho nhé!\n\n#QuanNguTiengHan #관용표현 #TuVungTOPIK #TOPIK2 #NariTOPIK", "m": "1C · 2G · 3E · 4A · 5H · 6D · 7B · 8F\n1 발등에 불이 떨어지다 · 2 입이 무겁다 · 3 귀가 얇다 · 4 손이 크다 · 5 눈코 뜰 사이도 없다 · 6 머리를 맞대다 · 7 애를 먹다 · 8 어깨가 무겁다"}, {"g": "Đề viết TOPIK II kỳ 108 (18.10.2026) — bài đăng Facebook", "t": "Đề viết TOPIK II kỳ 108 (18.10.2026) · Lời đăng", "i": ["de-viet-108/de-1.png", "de-viet-108/de-2.png"], "c": "📝 ĐỀ VIẾT TOPIK II KỲ 108 (18/10/2026)\n\nCác em vừa thi xong hôm nay vất vả rồi! Cô gửi lại đề viết câu 51–54 kỳ 108 để các em lưu lại, tự làm lại một lần nữa nhé.\n\n✍️ Câu 51 – Email hỏi đặt phòng khách sạn cho thú cưng\n✍️ Câu 52 – Cách xử lý thuốc cũ\n📊 Câu 53 – Tình hình mua mỹ phẩm của khách du lịch nước ngoài\n📚 Câu 54 – Tầm quan trọng của cạnh tranh lành mạnh ở học sinh\n\n👇 Đáp án gợi ý câu 51–52 (kèm vài cách viết khác vẫn được điểm) và bài mẫu câu 53–54 cô để ở comment.\n\n⚠️ Đề do thí sinh nhớ lại nên có thể khác đề gốc một chút.\n\nEm nào muốn cô chữa bài viết của mình theo từng câu, so với bài mẫu thì nhắn Zalo cô 0399 214 554 nhé 💜\n🌐 naritopik.com\n\n#TOPIK #TOPIK108 #쓰기 #NariTOPIK #TiengHan", "m": ""}, {"g": "Đề viết TOPIK II kỳ 108 (18.10.2026) — bài đăng Facebook", "t": "Đề viết TOPIK II kỳ 108 (18.10.2026) · Comment đáp án", "i": ["de-viet-108/2-cau-51.png", "de-viet-108/3-cau-52.png", "de-viet-108/4-cau-53-de.png", "de-viet-108/5-cau-53-mau.png", "de-viet-108/6-cau-54-de.png", "de-viet-108/7-cau-54-mau.png", "de-viet-108/1-bia.png"], "c": "1. (ảnh 2-cau-51) Câu 51: ㉠ 예약하기 전에 · ㉡ 내야 합니까 — kèm các cách viết khác vẫn được điểm.\n2. (ảnh 3-cau-52) Câu 52: ㉠ 버리는 것이 · ㉡ 약이 있다면.\n3. (ảnh 4-cau-53-de + 5-cau-53-mau) Câu 53: bài mẫu 285 chữ, tô sẵn các mẫu câu nên học.\n4. (ảnh 6-cau-54-de + 7-cau-54-mau) Câu 54: dàn ý 3 đoạn + bài mẫu ~660 chữ, tô sẵn từ nối.\n\n(ảnh 1-bia: dùng làm ảnh đầu khi muốn đăng gộp đề + đáp án trong một bài.)", "m": ""}];
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function toast(t){var e=document.getElementById('toast');e.textContent=t;e.classList.add('on');setTimeout(function(){e.classList.remove('on')},1800)}
function copy(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){toast('Đã chép ✓')},function(){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Đã chép ✓')}catch(e){toast('Chưa chép được, cô bôi đen rồi chép tay')}a.remove()})}
function nm(u){return u.split('/').pop()}
function saveAll(i){var p=D[i];toast('Đang tải '+p.i.length+' ảnh…');
 Promise.all(p.i.map(function(u){return fetch(u).then(function(r){return r.blob()}).then(function(b){return new File([b],nm(u),{type:'image/png'})})})).then(function(fs){
  if(navigator.canShare&&navigator.canShare({files:fs})){navigator.share({files:fs}).catch(function(){})}
  else{fs.forEach(function(f,k){setTimeout(function(){var a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=String(k+1).padStart(2,'0')+'-'+f.name;document.body.appendChild(a);a.click();a.remove()},k*350)})}
 },function(){toast('Không tải được ảnh')})}
function big(i,k){var p=D[i],u=p.i[k],e=document.createElement('div');e.className='big';
 e.innerHTML='<img src="'+esc(u)+'"><div>'+(k>0?'<button data-m=-1>‹ Trước</button>':'')+'<a href="'+esc(u)+'" download="'+esc(nm(u))+'">Tải ảnh</a><button data-x>Đóng</button>'+(k<p.i.length-1?'<button data-m=1>Sau ›</button>':'')+'</div><small style="color:#ccc;margin-top:6px">Ảnh '+(k+1)+'/'+p.i.length+' · Điện thoại: nhấn giữ ảnh → Lưu ảnh</small>';
 e.onclick=function(ev){var t=ev.target;if(t.dataset.m){e.remove();big(i,k+ +t.dataset.m)}else if(t.hasAttribute('data-x')||t===e)e.remove()};document.body.appendChild(e)}
var groups=[];D.forEach(function(p){if(groups.indexOf(p.g)<0)groups.push(p.g)});
var cur=-1;try{cur=+(localStorage.getItem('nari-fb-g')||-1)}catch(e){}
function render(){
 document.getElementById('nav').innerHTML='<button data-g=-1 class="'+(cur<0?'on':'')+'">Tất cả</button>'+groups.map(function(g,k){return '<button data-g='+k+' class="'+(cur===k?'on':'')+'">'+esc(g.replace(/^Loạt\s*/,'').replace(/"/g,''))+'</button>'}).join('');
 var h='',lastG=null;D.forEach(function(p,i){var gk=groups.indexOf(p.g);if(cur>=0&&gk!==cur)return;
  if(p.g!==lastG){h+='<div class=g>'+esc(p.g)+'</div>';lastG=p.g}
  h+='<div class=post id=p'+i+'><h2>'+esc(p.t)+' <small>· '+p.i.length+' ảnh</small></h2><div class=imgs>'+p.i.map(function(u,k){return '<a href="'+esc(u)+'" data-i='+i+' data-k='+k+'><img loading=lazy src="'+esc(u)+'" alt="'+esc(nm(u))+'"><span>'+(k+1)+'</span></a>'}).join('')+'</div>'
  +'<div class=bar><button data-all='+i+'>⬇ Lưu cả '+p.i.length+' ảnh</button>'+(p.c?'<button class=y data-c='+i+'>📋 Chép lời đăng</button>':'')+(p.m?'<button class=y data-cm='+i+'>📋 Chép bình luận đáp án</button>':'')+'</div>'
  +(p.c?'<div class=lb>Lời đăng</div><pre>'+esc(p.c)+'</pre>':'')+(p.m?'<div class=lb>Bình luận đáp án</div><pre>'+esc(p.m)+'</pre>':'')+'</div>'});
 document.getElementById('list').innerHTML=h}
document.addEventListener('click',function(ev){var t=ev.target.closest('[data-g],[data-all],[data-c],[data-cm],a[data-i]');if(!t)return;
 if(t.dataset.g!=null){cur=+t.dataset.g;try{localStorage.setItem('nari-fb-g',cur)}catch(e){}render()}
 else if(t.dataset.all!=null)saveAll(+t.dataset.all);
 else if(t.dataset.c!=null)copy(D[+t.dataset.c].c);
 else if(t.dataset.cm!=null)copy(D[+t.dataset.cm].m);
 else if(t.dataset.i!=null){ev.preventDefault();big(+t.dataset.i,+t.dataset.k)}});
render();
</script></body></html>
