var D=[{"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 0 — Bài mở loạt", "i": ["90-ngay/ngay-00.png"], "c": "Rất nhiều em nhắn cô: “Em có 30 / 60 / 90 ngày trước kỳ thi TOPIK II thì học gì trước?”\n\nCâu trả lời của cô: học đúng phần đề hay ra, theo đúng dạng câu. Có những từ đề đọc nào cũng gặp, có những nhóm ngữ pháp năm nào cũng ra ở câu 1–4 — học trước những phần đó là lời nhất.\n\nTừ ngày mai cô đăng loạt 90 ngày TOPIK II, mỗi ngày một bài, chia sẻ miễn phí:\n🔹 Ngày 1–30: từ cốt lõi Tầng 1 + ngữ pháp câu 1–4 — đủ nền để đọc nửa đầu đề.\n🔹 Ngày 31–60: từ cốt lõi Tầng 2 + từ theo từng dạng câu đọc (quảng cáo, thông báo, biểu đồ, tiêu đề báo, tiểu thuyết…).\n🔹 Ngày 61–90: từ cốt lõi Tầng 3 + từ nghe và viết 51–54.\n🔹 Cứ 10 ngày có 1 ngày ôn, đáp án ở comment.\n\nEm còn 30 ngày thì theo chặng 1, còn 60 ngày theo chặng 1–2, còn 90 ngày thì đi hết. Theo dõi trang và lưu bài lại để không lỡ ngày nào nhé 💜\n\nComment “90” nếu em học cùng cô từ ngày 1!\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 1 — Từ cốt lõi Tầng 1 · Phần 1", "i": ["90-ngay/ngay-01.png"], "c": "📅 90 ngày TOPIK II · Ngày 1/90\n\nHôm nay là 7 từ cốt lõi Tầng 1 — từ đề đọc nào cũng có. Gặp lại trong đề là đọc được ngay.\n\n• 위하다 – vì, để (위해)\n• 대하다 – về, đối với (에 대해)\n• 사회 – xã hội\n• 문제 – vấn đề\n• 따르다 – theo, tuân theo (에 따라)\n• 자신 – bản thân\n• 통하다 – thông qua (을 통해)\n\nCâu trong đề: 성공적인 직업 생활을 위해서는 그 직업을 수행하는 데 필요한 다양한 역량을 갖추어야 한다.\n\n👉 Em chọn 1 từ, đặt 1 câu ở comment, cô sửa cho nhé.\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 2 — Ngữ pháp câu 1–4 · Thời gian – trình tự", "i": ["90-ngay/ngay-02.png"], "c": "📅 90 ngày TOPIK II · Ngày 2/90\n\nNgữ pháp câu 1–4: nhóm Thời gian – trình tự. Câu 1–2 điền ngữ pháp, câu 3–4 chọn mẫu cùng nghĩa — học theo nhóm là gặp mẫu nào cũng nhận ra.\n\n• -다가 – đang... thì (bị ngắt quãng)\n• -았/었다가 – làm xong... rồi (chuyển sang việc ngược lại)\n• -고 나서 – làm xong... rồi mới...\n• -자마자 – vừa... là... ngay\n\n💡 Chỗ hay nhầm:\n• -다가: đang làm A thì chuyển sang / bị ngắt bởi B, cùng chủ ngữ (보다가 역을 지나쳤다). -았/었다가: làm xong A rồi làm việc ngược lại (갔다가 왔다).\n• -고 나서 = -(으)ㄴ 다음에: A xong hẳn rồi mới B. -자마자 = -는 대로 = -기가 무섭게: vừa A là B ngay; -는 대로 hay đi với lời hứa ở tương lai (도착하는 대로 연락드리겠습니다).\n• -(으)ㄴ 지 + thời gian + 되다/지나다: từ khi… đã được. -는 길에: trên đường đi/về (chỉ với 가다, 오다, 나가다…). -(으)ㄴ 채(로): giữ nguyên trạng thái.\n• -는데: nêu bối cảnh, hai vế được khác chủ ngữ (축구를 하는데 선생님이 부르셨다). -(으)면서 thì phải cùng chủ ngữ.\n\n👉 Em thử đặt 1 câu với mẫu em hay nhầm nhất, comment để cô xem.\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 3 — Từ cốt lõi Tầng 1 · Phần 2", "i": ["90-ngay/ngay-03.png"], "c": "📅 90 ngày TOPIK II · Ngày 3/90\n\nHôm nay là 7 từ cốt lõi Tầng 1 — từ đề đọc nào cũng có. Gặp lại trong đề là đọc được ngay.\n\n• 필요하다 – cần thiết\n• 인하다 – do, bởi (로 인해)\n• 방법 – phương pháp, cách\n• 경우 – trường hợp\n• 다양하다 – đa dạng\n• 느끼다 – cảm thấy\n• 들다 – vào; tốn (tiền, thời gian); cầm; chứa (들어 있다)\n\nCâu trong đề: 디지털 쿼터족은 한꺼번에 두세 가지 일을 처리할 줄 알고 즉석에서 필요한 정보를 찾아낸다.\n\n👉 Em chọn 1 từ, đặt 1 câu ở comment, cô sửa cho nhé.\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 4 — Ngữ pháp câu 1–4 · Lý do – nguyên nhân", "i": ["90-ngay/ngay-04.png"], "c": "📅 90 ngày TOPIK II · Ngày 4/90\n\nNgữ pháp câu 1–4: nhóm Lý do – nguyên nhân. Câu 1–2 điền ngữ pháp, câu 3–4 chọn mẫu cùng nghĩa — học theo nhóm là gặp mẫu nào cũng nhận ra.\n\n• -(으)니까 – vì...; làm... thì phát hiện ra...\n• -느라고 – vì mải làm... nên (kết quả xấu)\n• -는 바람에 – vì (sự cố bất ngờ) nên...\n• -길래 – vì thấy... nên (tôi) đã...\n\n💡 Chỗ hay nhầm:\n• -는 바람에 = -는 통에 = -(으)ㄴ 탓에: nguyên nhân gây kết quả xấu / ngoài ý muốn. Vế sau ở quá khứ, không dùng mệnh lệnh, rủ rê.\n• -느라고: vì mải / bận làm A (hành động có chủ ý, cùng chủ ngữ) nên kết quả không tốt. Không đi với tính từ.\n• -기 때문에, -기에, -길래: vì. -길래 = thấy / nghe thông tin rồi “tôi” mới làm (배가 고프길래 라면을 끓여 먹었다). -다고 해서: vì (ai đó) nói là…\n• -(으)니까: vì (vế sau dùng được mệnh lệnh); còn nghĩa “làm A thì phát hiện B” (집에 도착하니까 비가 내리기 시작했다). -(으)ㄹ 텐데: chắc là… nên… (đoán trước).\n\n👉 Em thử đặt 1 câu với mẫu em hay nhầm nhất, comment để cô xem.\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 5 — Từ cốt lõi Tầng 1 · Phần 3", "i": ["90-ngay/ngay-05.png"], "c": "📅 90 ngày TOPIK II · Ngày 5/90\n\nHôm nay là 7 từ cốt lõi Tầng 1 — từ đề đọc nào cũng có. Gặp lại trong đề là đọc được ngay.\n\n• 최근 – gần đây\n• 새롭다 – mới mẻ\n• 영향 – ảnh hưởng\n• 상황 – tình huống\n• 이유 – lý do\n• 자연 – tự nhiên, thiên nhiên\n• 사용하다 – sử dụng\n\nCâu trong đề: 최근에는 일할 때보다 실업 후에 더 많은 실업급여를 불법으로 받은 사람들이 대거 적발되었다.\n\n👉 Em chọn 1 từ, đặt 1 câu ở comment, cô sửa cho nhé.\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 6 — Ngữ pháp câu 1–4 · Mục đích", "i": ["90-ngay/ngay-06.png"], "c": "📅 90 ngày TOPIK II · Ngày 6/90\n\nNgữ pháp câu 1–4: nhóm Mục đích. Câu 1–2 điền ngữ pháp, câu 3–4 chọn mẫu cùng nghĩa — học theo nhóm là gặp mẫu nào cũng nhận ra.\n\n• -(으)려고 – để (ý định)\n• -기 위해(서) – để (mục đích)\n• -고자 – để (văn viết)\n• -(으)려면 – muốn... thì (phải)...\n\n💡 Chỗ hay nhầm:\n• -(으)려고 = -기 위해(서) = -고자 (văn viết): để. -(으)려고 không đi với mệnh lệnh / rủ rê, -기 위해서 thì được.\n• -(으)려면 = -기 위해서는: nếu muốn… thì; vế sau là việc phải làm (-아야 하다, -(으)세요).\n• -게 = -도록: để cho (hay đi với phủ định: 깨지 않게 = 깨지 않도록).\n• -(으)ㄹ 겸: vừa để… vừa để (một việc nhiều mục đích). -는 김에: nhân tiện đang làm A thì làm luôn B.\n\n👉 Em thử đặt 1 câu với mẫu em hay nhầm nhất, comment để cô xem.\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 7 — Từ cốt lõi Tầng 1 · Phần 4", "i": ["90-ngay/ngay-07.png"], "c": "📅 90 ngày TOPIK II · Ngày 7/90\n\nHôm nay là 7 từ cốt lõi Tầng 1 — từ đề đọc nào cũng có. Gặp lại trong đề là đọc được ngay.\n\n• 환경 – môi trường\n• 중요하다 – quan trọng\n• 생활 – sinh hoạt, đời sống\n• 보이다 – nhìn thấy\n• 이러하다 – như thế này\n• 결과 – kết quả\n• 증가하다 – gia tăng\n\nCâu trong đề: 또한 어른들은 어린이들에게 해로운 영향을 끼치는 환경적인 요소들을 없애도록 노력해야 한다.\n\n👉 Em chọn 1 từ, đặt 1 câu ở comment, cô sửa cho nhé.\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 8 — Ngữ pháp câu 1–4 · Điều kiện", "i": ["90-ngay/ngay-08.png"], "c": "📅 90 ngày TOPIK II · Ngày 8/90\n\nNgữ pháp câu 1–4: nhóm Điều kiện. Câu 1–2 điền ngữ pháp, câu 3–4 chọn mẫu cùng nghĩa — học theo nhóm là gặp mẫu nào cũng nhận ra.\n\n• -(으)면 – nếu/hễ... thì...\n• -아/어야 – phải... mới...\n• -다면 – nếu (mà)... thì...\n• -거든 – hễ/nếu... thì hãy/nhớ...\n\n💡 Chỗ hay nhầm:\n• -아/어야: phải A thì mới B (điều kiện bắt buộc). -(으)면 되다: chỉ cần… là được.\n• -다면: nếu (giả định, ít khả năng). -거든: nếu… thì; vế sau là mệnh lệnh / rủ rê / ý định.\n• -다(가) 보면: cứ làm A mãi thì sẽ B. -다 보니(까): cứ làm A rồi đã thành B. -(으)ㄹ수록: càng… càng.\n• -기만 하면 = -(으)ㄹ 때마다: hễ cứ… là. -기 나름이다 = -기에 달려 있다: tùy vào (cách làm).\n\n👉 Em thử đặt 1 câu với mẫu em hay nhầm nhất, comment để cô xem.\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 9 — Từ cốt lõi Tầng 1 · Phần 5", "i": ["90-ngay/ngay-09.png"], "c": "📅 90 ngày TOPIK II · Ngày 9/90\n\nHôm nay là 7 từ cốt lõi Tầng 1 — từ đề đọc nào cũng có. Gặp lại trong đề là đọc được ngay.\n\n• 관심 – quan tâm\n• 대부분 – phần lớn\n• 줄이다 – giảm, cắt giảm\n• 세계 – thế giới\n• 관계 – quan hệ\n• 정보 – thông tin\n• 문화 – văn hóa\n\nCâu trong đề: 특히 키 성장에 관심이 많은데 성장기에 성장 호르몬이 부족하면 키가 충분히 크지 못할 수 있다.\n\n👉 Em chọn 1 từ, đặt 1 câu ở comment, cô sửa cho nhé.\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 10 — Ngày ôn", "i": ["90-ngay/ngay-10.png"], "c": "📅 90 ngày TOPIK II · Ngày 10/90 — NGÀY ÔN\n\n9 ngày vừa rồi em có theo kịp không? Đây là 7 từ trong các bài trước. Em viết nghĩa ra giấy (hoặc comment), rồi mới xem đáp án ở comment nhé.\n\nEm đúng được mấy từ? Comment số câu đúng: 7/7 là em đang đi rất đúng nhịp đó 💪", "m": "1. 위하다 – vì, để (위해)\n2. -다가 – đang... thì (bị ngắt quãng)\n3. 필요하다 – cần thiết\n4. -(으)니까 – vì...; làm... thì phát hiện ra...\n5. 최근 – gần đây\n6. -(으)려고 – để (ý định)\n7. 환경 – môi trường\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK"}, {"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 11 — Ngữ pháp câu 1–4 · Nhượng bộ", "i": ["90-ngay/ngay-11.png"], "c": "📅 90 ngày TOPIK II · Ngày 11/90\n\nNgữ pháp câu 1–4: nhóm Nhượng bộ. Câu 1–2 điền ngữ pháp, câu 3–4 chọn mẫu cùng nghĩa — học theo nhóm là gặp mẫu nào cũng nhận ra.\n\n• -아/어도 – dù... cũng...\n• -더라도 – dù (có)... đi nữa cũng...\n• -아/어 봐야 – có... thì cũng vậy\n• -ㄴ/는다고 해도 – cho dù có... đi nữa\n\n💡 Chỗ hay nhầm:\n• -아/어도 ≈ -더라도: dù… cũng; -더라도 giả định mạnh hơn, hay đi với 아무리.\n• -아/어 봐야 = -ㄴ/는다고 해도: có làm A cũng vô ích (vế sau tiêu cực: 가 봐야 값은 비슷할 것이다).\n• -고도 = -는데도: dù đã A (sự thật) mà vẫn B. -지만, -(으)ㄴ/는데(도): nhưng, mặc dù.\n• -(으)면서(도), -고서도: biết / làm A mà vẫn B (thái độ trái ngược).\n\n👉 Em thử đặt 1 câu với mẫu em hay nhầm nhất, comment để cô xem.\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 12 — Từ cốt lõi Tầng 1 · Phần 6", "i": ["90-ngay/ngay-12.png"], "c": "📅 90 ngày TOPIK II · Ngày 12/90\n\nHôm nay là 7 từ cốt lõi Tầng 1 — từ đề đọc nào cũng có. Gặp lại trong đề là đọc được ngay.\n\n• 경제 – kinh tế\n• 또한 – ngoài ra, cũng\n• 능력 – năng lực\n• 제품 – sản phẩm\n• 도움 – giúp đỡ\n• 활동 – hoạt động\n• 마음 – tấm lòng\n\nCâu trong đề: 경제계는 미국과 일본 등 선진국 사례를 참조해 정책을 현실에 맞게 고쳐야 한다고 주장한다.\n\n👉 Em chọn 1 từ, đặt 1 câu ở comment, cô sửa cho nhé.\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 13 — Ngữ pháp câu 1–4 · Lựa chọn – bất kể – đối lập", "i": ["90-ngay/ngay-13.png"], "c": "📅 90 ngày TOPIK II · Ngày 13/90\n\nNgữ pháp câu 1–4: nhóm Lựa chọn – bất kể – đối lập. Câu 1–2 điền ngữ pháp, câu 3–4 chọn mẫu cùng nghĩa — học theo nhóm là gặp mẫu nào cũng nhận ra.\n\n• -거나 – hoặc là... hoặc là...\n• -든지 – dù... nào/gì cũng...\n• -(으)나 마나 – dù có... hay không\n• -아/어도 – dù có... cũng\n\n💡 Chỗ hay nhầm:\n• -거나: hoặc A hoặc B. -든지: dù… nào cũng (đi với 무슨, 어느, 누구, 무엇); -든지 = -더라도 ở nghĩa bất kể.\n• -(으)나 마나 = -아/어도 소용없다 = -지 않아도: có làm hay không thì kết quả cũng thế (biết trước).\n• -(으)ㄴ/는 반면에 = -는 데 반해: trái lại (hai đặc điểm đối lập). -(으)ㄴ/는가 하면: có người / lúc thế này thì cũng có… thế kia.\n\n👉 Em thử đặt 1 câu với mẫu em hay nhầm nhất, comment để cô xem.\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 14 — Từ cốt lõi Tầng 1 · Phần 7", "i": ["90-ngay/ngay-14.png"], "c": "📅 90 ngày TOPIK II · Ngày 14/90\n\nHôm nay là 7 từ cốt lõi Tầng 1 — từ đề đọc nào cũng có. Gặp lại trong đề là đọc được ngay.\n\n• 정부 – chính phủ\n• 모습 – dáng vẻ\n• 역할 – vai trò\n• 나타나다 – xuất hiện/thể hiện\n• 결국 – rốt cuộc, cuối cùng\n• 이해하다 – hiểu/thông cảm\n• 설명하다 – giải thích\n\nCâu trong đề: 통화는 정부가 발행하는 동전, 지폐 등으로 사람들이 인정하고 사용하는 종류의 돈을 말한다.\n\n👉 Em chọn 1 từ, đặt 1 câu ở comment, cô sửa cho nhé.\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 15 — Ngữ pháp câu 1–4 · Quan sát – bổ sung", "i": ["90-ngay/ngay-15.png"], "c": "📅 90 ngày TOPIK II · Ngày 15/90\n\nNgữ pháp câu 1–4: nhóm Quan sát – bổ sung. Câu 1–2 điền ngữ pháp, câu 3–4 chọn mẫu cùng nghĩa — học theo nhóm là gặp mẫu nào cũng nhận ra.\n\n• -더니 – đã thấy... (nay thì thay đổi)\n• -았/었더니 – (tôi) làm... rồi thì (phát hiện/kết quả)\n• -(으)려다가 – định... nhưng (thôi/đổi ý)\n• -(으)ㄴ/는 데다가 – đã... lại còn...\n\n💡 Chỗ hay nhầm:\n• -더니: (tôi đã thấy) trước thì A, giờ B. -았/었더니: tôi làm A thì thấy / được kết quả B.\n• -(으)려다가: định A rồi thôi / đổi ý. -아/어다가: lấy / làm A ở chỗ này rồi đem đi làm B (빌려다가 보세요). -다시피: như (ai cũng) biết.\n• -(으)ㄹ 뿐만 아니라 = -(으)ㄴ/는 데다가 = -는 것은 물론이고: không những… mà còn (hai vế cùng chiều).\n• N은/는커녕: đừng nói N, đến cái dễ hơn cũng không (vế sau phủ định: 밥은커녕 죽도 못 먹었다).\n\n👉 Em thử đặt 1 câu với mẫu em hay nhầm nhất, comment để cô xem.\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 16 — Từ cốt lõi Tầng 1 · Phần 8", "i": ["90-ngay/ngay-16.png"], "c": "📅 90 ngày TOPIK II · Ngày 16/90\n\nHôm nay là 7 từ cốt lõi Tầng 1 — từ đề đọc nào cũng có. Gặp lại trong đề là đọc được ngay.\n\n• 기업 – doanh nghiệp\n• 변화 – thay đổi\n• 교육 – giáo dục\n• 이상 – trở lên (tính cả mốc)\n• 떨어지다 – rơi xuống\n• 표현하다 – biểu hiện, diễn đạt\n• 삶 – cuộc sống\n\nCâu trong đề: 이처럼 특수어 전공자들의 몸값이 오르자 기업들은 졸업도 하지 않은 학생들을 미리 뽑고 있다.\n\n👉 Em chọn 1 từ, đặt 1 câu ở comment, cô sửa cho nhé.\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 17 — Ngữ pháp câu 1–4 · Đuôi câu: trạng thái, thay đổi, kinh nghiệm", "i": ["90-ngay/ngay-17.png"], "c": "📅 90 ngày TOPIK II · Ngày 17/90\n\nNgữ pháp câu 1–4: nhóm Đuôi câu: trạng thái, thay đổi, kinh nghiệm. Câu 1–2 điền ngữ pháp, câu 3–4 chọn mẫu cùng nghĩa — học theo nhóm là gặp mẫu nào cũng nhận ra.\n\n• -아/어 가다 – (dần dần) đang... đi\n• -게 되다 – (kết quả là) trở nên, được...\n• -아/어 놓다 – làm sẵn...\n• -아/어 있다 – đang ở trạng thái... (còn lại)\n\n💡 Chỗ hay nhầm:\n• -아/어 놓다 (두다): làm sẵn (người làm chủ động). -아/어 있다: trạng thái còn lại sau khi việc xảy ra (닫혀 있다, 돌아와 있다).\n• -게 되다: kết quả đến do hoàn cảnh (친구 덕분에 알게 되었다). -아/어 가다: đang dần… (점점 닮아 간다), -아/어 오다: từ trước tới nay.\n• -(으)ㄴ 적이 있다: đã từng. -기로 하다: quyết định / hẹn. -곤 하다: thường hay (thói quen). -(으)려던 참이다: vừa định làm thì.\n• -았/었어야 했는데 = -(으)ㄹ걸 그랬다: tiếc vì đã không làm.\n\n👉 Em thử đặt 1 câu với mẫu em hay nhầm nhất, comment để cô xem.\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 18 — Từ cốt lõi Tầng 1 · Phần 9", "i": ["90-ngay/ngay-18.png"], "c": "📅 90 ngày TOPIK II · Ngày 18/90\n\nHôm nay là 7 từ cốt lõi Tầng 1 — từ đề đọc nào cũng có. Gặp lại trong đề là đọc được ngay.\n\n• 이용하다 – sử dụng, tận dụng\n• 국가 – quốc gia\n• 가능하다 – có thể, khả thi\n• 서로 – lẫn nhau\n• 원인 – nguyên nhân\n• 현상 – hiện tượng\n• 오히려 – ngược lại, trái lại còn\n\nCâu trong đề: 거듭되는 줄서기를 피하려면 공항 철도 서울역 도심 공항 터미널을 이용하는 게 좋다.\n\n👉 Em chọn 1 từ, đặt 1 câu ở comment, cô sửa cho nhé.\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 19 — Ngữ pháp câu 1–4 · Phỏng đoán – lo lắng", "i": ["90-ngay/ngay-19.png"], "c": "📅 90 ngày TOPIK II · Ngày 19/90\n\nNgữ pháp câu 1–4: nhóm Phỏng đoán – lo lắng. Câu 1–2 điền ngữ pháp, câu 3–4 chọn mẫu cùng nghĩa — học theo nhóm là gặp mẫu nào cũng nhận ra.\n\n• -나 보다 – hình như, chắc là...\n• -(으)ㄴ/는 모양이다 – có vẻ như...\n• -(으)ㄹ 뻔하다 – suýt nữa thì...\n• -(으)ㄴ/는 셈이다 – coi như là, gần như là...\n\n💡 Chỗ hay nhầm:\n• -나 보다 = -(으)ㄴ/는 모양이다 = -는 것 같다 = -는 듯하다: hình như, đoán từ điều nhìn thấy (…걸 보니). -나 보다 không dùng cho bản thân.\n• -(으)ㄹ지도 모르다 = -(으)ㄹ 수도 있다: có thể (không chắc). -(으)ㄹ 게 뻔하다 = 틀림없다 = 분명하다: chắc chắn. -(으)ㄹ 리가 없다: không đời nào.\n• -(으)ㄹ 뻔하다: suýt nữa (việc không xảy ra). -(으)ㄹ까 봐(서) = -(으)ㄹ 것 같아서: sợ là… nên (làm trước để phòng).\n\n👉 Em thử đặt 1 câu với mẫu em hay nhầm nhất, comment để cô xem.\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 20 — Ngày ôn", "i": ["90-ngay/ngay-20.png"], "c": "📅 90 ngày TOPIK II · Ngày 20/90 — NGÀY ÔN\n\n9 ngày vừa rồi em có theo kịp không? Đây là 7 từ trong các bài trước. Em viết nghĩa ra giấy (hoặc comment), rồi mới xem đáp án ở comment nhé.\n\nEm đúng được mấy từ? Comment số câu đúng: 7/7 là em đang đi rất đúng nhịp đó 💪", "m": "1. -아/어도 – dù... cũng...\n2. 경제 – kinh tế\n3. -거나 – hoặc là... hoặc là...\n4. 정부 – chính phủ\n5. -더니 – đã thấy... (nay thì thay đổi)\n6. 기업 – doanh nghiệp\n7. -아/어 가다 – (dần dần) đang... đi\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK"}, {"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 21 — Từ cốt lõi Tầng 1 · Phần 10", "i": ["90-ngay/ngay-21.png"], "c": "📅 90 ngày TOPIK II · Ngày 21/90\n\nHôm nay là 7 từ cốt lõi Tầng 1 — từ đề đọc nào cũng có. Gặp lại trong đề là đọc được ngay.\n\n• 미치다 – gây (ảnh hưởng) (영향을 미치다)\n• 비하다 – so với (에 비해)\n• 인간 – con người\n• 건강 – sức khỏe\n• 효과 – hiệu quả\n• 피해 – thiệt hại\n• 정도 – mức độ\n\nCâu trong đề: 연구에 따르면 반려동물이 우리에게 신체적, 정신적으로 건강에 좋은 영향을 미친다고 한다.\n\n👉 Em chọn 1 từ, đặt 1 câu ở comment, cô sửa cho nhé.\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 22 — Ngữ pháp câu 1–4 · Coi như – đương nhiên – chỉ là", "i": ["90-ngay/ngay-22.png"], "c": "📅 90 ngày TOPIK II · Ngày 22/90\n\nNgữ pháp câu 1–4: nhóm Coi như – đương nhiên – chỉ là. Câu 1–2 điền ngữ pháp, câu 3–4 chọn mẫu cùng nghĩa — học theo nhóm là gặp mẫu nào cũng nhận ra.\n\n• -(으)ㄴ/는 셈이다 – coi như là\n• -는 거나 같다 – chẳng khác gì\n• -는 거나 마찬가지이다 – cũng như là\n• -는 거나 다름없다 – không khác gì\n\n💡 Chỗ hay nhầm:\n• -(으)ㄴ/는 셈이다 = -는 거나 마찬가지이다 = -는 거나 다름없다: coi như là (tính ra gần bằng). -는 편이다: thuộc dạng, khá là — không trùng nghĩa với -셈이다, nhưng có câu đề vẫn chọn làm đáp án gần nghĩa nhất (loại 3 đáp án sai hẳn).\n• -기 마련이다 = -는 법이다: lẽ thường, đương nhiên (nói chung cho mọi người).\n• -(으)ㄹ 수밖에 없다 = -아/어야만 했다: đành phải, không còn cách nào.\n• -(으)ㄹ 뿐이다 = -에 불과하다 = -(으)ㄹ 따름이다: chỉ… thôi. -(으)ㄹ 만하다: đáng để.\n\n👉 Em thử đặt 1 câu với mẫu em hay nhầm nhất, comment để cô xem.\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 23 — Từ cốt lõi Tầng 1 · Phần 11", "i": ["90-ngay/ngay-23.png"], "c": "📅 90 ngày TOPIK II · Ngày 23/90\n\nHôm nay là 7 từ cốt lõi Tầng 1 — từ đề đọc nào cũng có. Gặp lại trong đề là đọc được ngay.\n\n• 소리 – âm thanh\n• 즐기다 – tận hưởng\n• 시대 – thời đại\n• 법 – luật\n• 원하다 – mong muốn\n• 높이다 – nâng cao\n• 노력하다 – nỗ lực\n\nCâu trong đề: 판소리 공연에서는 소리도 중요하지만 추임새가 그날 공연을 좌우한다고 해도 과언이 아니다.\n\n👉 Em chọn 1 từ, đặt 1 câu ở comment, cô sửa cho nhé.\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 24 — Ngữ pháp câu 1–4 · Mức độ, so sánh + mẫu ít gặp", "i": ["90-ngay/ngay-24.png"], "c": "📅 90 ngày TOPIK II · Ngày 24/90\n\nNgữ pháp câu 1–4: nhóm Mức độ, so sánh + mẫu ít gặp. Câu 1–2 điền ngữ pháp, câu 3–4 chọn mẫu cùng nghĩa — học theo nhóm là gặp mẫu nào cũng nhận ra.\n\n• -(으)ㄹ 정도로 – đến mức mà\n• -(으)ㄹ 만큼 – đến nỗi mà\n• -게 – đến độ\n• -도록 – đến mức\n\n💡 Chỗ hay nhầm:\n• -(으)ㄹ 정도로 = -(으)ㄹ 만큼 = -게: đến mức. -도록 = -(으)ㄹ 때까지: cho đến khi.\n• -는 대로 = -는 것과 같이: đúng như. -(으)ㄴ/는 척하다 = -는 체하다: giả vờ.\n• N치고: hễ là N thì (không ngoại lệ). N치고는: so với N thì (khác thường). N(이)야말로: chính N. N(이)나마: dù chỉ là N.\n• -기 십상이다 = -기 쉽다: dễ (xảy ra điều xấu). -아/어지다, bị động -이/히/리/기-. Trích dẫn: -다고 / -(으)라고 / -냐고 / -겠다고 하다.\n\n👉 Em thử đặt 1 câu với mẫu em hay nhầm nhất, comment đ Ngày 47 — Câu 21–22 · Quán dụng ngữ — Nghĩa bóng, không dịch từng chữ", "i": ["90-ngay/ngay-47.png"], "c": "📅 90 ngày TOPIK II · Ngày 47/90\n\nCâu 21–22 · Quán dụng ngữ — nghĩa bóng, không dịch từng chữ.\n\n• 가닥을 잡다 – tìm ra hướng giải quyết\n• 실마리를 찾다/잡다 – tìm ra manh mối, đầu mối giải quyết\n• 갈피를 못 잡다 – không tìm ra hướng, rối trí\n• 가슴에 새기다 – khắc ghi trong lòng\n• 가슴을 쓸어내리다 – thở phào nhẹ nhõm\n• 가슴을 울리다 – làm xúc động\n• 가슴을 치다 – đấm ngực tiếc nuối, hối hận\n• 가슴이 뜨끔하다 – giật mình, chột dạ\n\n👉 Em đã gặp từ nào trong đề rồi? Comment cho cô biết nhé.\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 48 — Từ cốt lõi Tầng 2 · Phần 9", "i": ["90-ngay/ngay-48.png"], "c": "📅 90 ngày TOPIK II · Ngày 48/90\n\nHôm nay là 8 từ cốt lõi Tầng 2 — từ đề đọc rất hay gặp. Gặp lại trong đề là đọc được ngay.\n\n• 즉 – tức là\n• 증가 – sự gia tăng\n• 대신 – thay thế\n• 달라지다 – thay đổi, trở nên khác\n• 등장하다 – xuất hiện, ra đời\n• 여기다 – coi là, cho rằng\n• 비판하다 – phê phán\n• 정책 – chính sách\n\nCâu trong đề: 즉, 외부세계로부터 영향을 받는 수동성이 사실은 경험의 중요한 조건이 된다고 볼 수 있다.\n\n👉 Em chọn 1 từ, đặt 1 câu ở comment, cô sửa cho nhé.\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 49 — Câu 23–24 · Từ cảm xúc — Tâm trạng nhân vật trong tùy bút", "i": ["90-ngay/ngay-49.png"], "c": "📅 90 ngày TOPIK II · Ngày 49/90\n\nCâu 23–24 · Từ cảm xúc — tâm trạng nhân vật trong tùy bút.\n\n• 감격스럽다 (감동을 받다, 감동적이다) – xúc động, cảm kích\n• 걱정스럽다 – đáng lo, lo lắng\n• 겁이 나다 – sợ hãi\n• 고맙다 – biết ơn, cảm ơn\n• 고민스럽다 – băn khoăn, trăn trở\n• 고생스럽다 – vất vả, cực khổ\n• 고통스럽다 = 괴롭다 – đau khổ, khổ sở\n• 곤란하다 – khó xử, khó khăn\n\n👉 Em đã gặp từ nào trong đề rồi? Comment cho cô biết nhé.\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 50 — Ngày ng 2 · Phần 11", "i": ["90-ngay/ngay-53.png"], "c": "📅 90 ngày TOPIK II · Ngày 53/90\n\nHôm nay là 8 từ cốt lõi Tầng 2 — từ đề đọc rất hay gặp. Gặp lại trong đề là đọc được ngay.\n\n• 공간 – không gian\n• 넣다 – nhỏ vào\n• 발달 – phát triển\n• 내용 – nội dung\n• 주장하다 – chủ trương, đưa ra lập luận\n• 형태 – hình thái\n• 상대 – đối phương\n• 잘못 – sai lầm\n\nCâu trong đề: 그래서 골목길 귀퉁이의 한 뼘 공간이라도 꽃밭으로 꾸며진 걸 보면 반갑게 다시 보게 된다.\n\n👉 Em chọn 1 từ, đặt 1 câu ở comment, cô sửa cho nhé.\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 54 — Câu 25–27 · Tiêu đề báo — Kinh tế, giá cả", "i": ["90-ngay/ngay-54.png"], "c": "📅 90 ngày TOPIK II · Ngày 54/90\n\nCâu 25–27 · Tiêu đề báo — kinh tế, giá cả.\n\n• 인상 ⇔ 인하 – tăng giá ⇔ giảm giá\n• 급등 = 폭등 – tăng vọt\n• 물가 – vật giá\n• 유가 – giá dầu\n• 수요자 = 소비자 – người có nhu cầu, người tiêu dùng\n• 공급자 = 생산자 – nhà cung cấp, nhà sản xuất\n• 출하량 = 생산량 – sản lượng xuất xưởng\n• 후불제 ⇔ 선불제 – trả sau ⇔ trả trước\n\n👉 Em đã gặp từ nào trong đề rồi? Comment cho cô biết nhé.\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 55 — Từ cốt lõi Tầng 2 · Phần 12", "i": ["90-ngay/ngay-55.png"], "c": "📅 90 ngày TOPIK II · Ngày 55/90\n\nHôm nay là 8 từ cốt lõi Tầng 2 — từ đề đọc rất hay gặp. Gặp lại trong đề là đọc được ngay.\n\n• 점점 – dần dần\n• 지나치다 – thái quá, quá mức\n• 피하다 – tránh\n• 모으다 – tích góp\n• 바뀌다 – bị thay đổi\n• 이어지다 – được nối tiếp, dẫn đến\n• 강조하다 – nhấn mạnh\n• 맞추다 – làm cho khớp, điều chỉnh\n\nCâu trong đề: 그런데 이러한 노후 생활기가 의학의 발달과 생활 습관의 개선 등에 의해 점점 더 길어지고 있다.\n\n👉 Em chọn 1 từ, đặt 1 câu ở comment, cô sửa cho nhé.\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 56 — Câu 42–43 · Tiểu thuyết — Cảm xúc nhân vật", "i": ["90-ngay/ngay-56.png"], "c": "📅 90 ngày TOPIK II · Ngày 56/90\n\nCâu 42–43 · Tiểu thuyết — cảm xúc nhân vật.\n\n• 가슴이 먹먹하다 – nghẹn lòng, tức ngực\n• 간절하다 – tha thiết, khẩn thiết\n• 감격스럽다 – xúc động, cảm kích\n• 감탄하다 – thán phục\n• 격려하다 – khích lệ, động viên\n• 괘씸하다 – đáng ghét (vì vô lễ)\n• 기대에 들뜨다 – háo hức mong đợi\n• 난처하다 – khó xử\n\n👉 Em đã gặp từ nào trong đề rồi? Comment cho cô biết nhé.\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 57 — Từ cốt lõi Tầng 2 · Phần 13", "i": ["90-ngay/ngay-57.png"], "c": "📅 90 ngày TOPIK II · Ngày 57/90\n\nHôm nay là 8 từ cốt lõi Tầng 2 — từ đề đọc rất hay gặp. Gặp lại trong đề là đọc được ngay.\n\n• 무료 – miễn phí\n• 주로 – chủ yếu\n• 나누다 – chia sẻ\n• 덕분 – nhờ (덕분에)\n• 오염 – ô nhiễm\n• 이루다 – đạt được, tạo thành\n• 진행되다 – được tiến hành\n• 성공하다 – thành công\n\nCâu trong đề: 연수 해수욕장에서는 토요일과 일요일 오후 두 시부터 네 시까지 새로운 볼거리를 무료로 제공한다.\n\n👉 Em chọn 1 từ, đặt 1 câu ở comment, cô sửa cho nhé.\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 58 — Câu 44–45 · Đoạn văn xã hội — Từ của chủ đề xã hội, môi trường", "i": ["90-ngay/ngay-58.png"], "c": "📅 90 ngày TOPIK II · Ngày 58/90\n\nCâu 44–45 · Đoạn văn xã hội — từ của chủ đề xã hội, môi trường.\n\n▸ Xã hội\n• 자원봉사 – tình nguyện\n• 기부 문화 – văn hóa quyên góp\n• 지역 이기주의 – chủ nghĩa vị kỷ địa phương\n• 저출산 – tỉ lệ sinh thấp\n▸ Môi trường\n• 환경오염 – ô nhiễm môi trường\n• 환경 보호 – bảo vệ môi trường\n• 지구 온난화 – trái đất nóng lên\n• 미래 식량 부족 – thiếu lương thực trong tương lai\n\n👉 Em đã gặp từ nào trong đề rồi? Comment cho cô biết nhé.\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 59 — Từ cốt lõi Tầng 2 · Phần 14", "i": ["90-ngay/ngay-59.png"], "c": "📅 90 ngày TOPIK II · Ngày 59/90\n\nHôm nay là 8 từ cốt lõi Tầng 2 — từ đề đọc rất hay gặp. Gặp lại trong đề là đọc được ngay.\n\n• 심하다 – nghiêm trọng, quá mức\n• 우선 – trước hết\n• 전체 – toàn thể\n• 특정 – đặc định, cụ thể\n• 뇌 – não bộ\n• 언어 – ngôn ngữ\n• 판매 – bán hàng\n• 전통 – truyền thống\n\nCâu trong đề: 닦는 부분만 반복적으로 닦이다 보니 치아의 마모가 심해져 이가 시릴 수 있기 때문이다.\n\n👉 Em chọn 1 từ, đặt 1 câu ở comment, cô sửa cho nhé.\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 60 — Ngày ôn", "i": ["90-ngay/ngay-60.png"], "c": "📅 90 ngày TOPIK II · Ngày 60/90 — NGÀY ÔN\n\n9 ngày vừa rồi em có theo kịp không? Đây là 7 từ trong các bài trước. Em viết nghĩa ra giấy (hoặc comment), rồi mới xem đáp án ở comment nhé.\n\nEm đúng được mấy từ? Comment số câu đúng: 7/7 là em đang đi rất đúng nhịp đó 💪", "m": "1. 자녀 – con cái\n2. 열풍 – cơn sốt (gió nóng – sự hâm mộ)\n3. 공간 – không gian\n4. 인상 ⇔ 인하 – tăng giá ⇔ giảm giá\n5. 점점 – dần dần\n6. 가슴이 먹먹하다 – nghẹn lòng, tức ngực\n7. 무료 – miễn phí\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK"}, {"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 61 — Từ cốt lõi Tầng 3 · Phần 1", "i": ["90-ngay/ngay-61.png"], "c": "📅 90 ngày TOPIK II · Ngày 61/90\n\nHôm nay là 8 từ cốt lõi Tầng 3 — từ đề đọc hay gặp. Gặp lại trong đề là đọc được ngay.\n\n• 노인 – người già\n• 디지털 – kỹ thuật số\n• 광고 – quảng cáo\n• 남성 – nam giới\n• 공연 – buổi biểu diễn\n• 예술 – nghệ thuật\n• 차 – xe\n• 자원 – tài nguyên\n\nCâu trong đề: 최근 노인들을 위한 복지 차원으로 새롭게 시작된 ‘노노케어’가 활발히 진행되고 있다.\n\n👉 Em chọn 1 từ, đặt 1 câu ở comment, cô sửa cho nhé.\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 62 — Nghe 4–12 · Ở công ty — Hội thoại nơi làm việc", "i": ["90-ngay/ngay-62.png"], "c": "📅 90 ngày TOPIK II · Ngày 62/90\n\nNghe 4–12 · Ở công ty — hội thoại nơi làm việc.\n\n• 출근하다 ⇔ 퇴근하다 – đi làm ⇔ tan làm\n• 일하다 = 근무하다 – làm việc\n• 야근하다 – làm thêm đêm, tăng ca\n• 일을 시작하다 ⇔ 일을 끝내다 – bắt đầu ⇔ kết thúc công việc\n• 일이 끝나다 – công việc xong\n• 업무를 전달하다 – truyền đạt, bàn giao công việc\n• 명령하다, 지시하다 – ra lệnh, chỉ thị\n• 부탁하다 – nhờ vả\n\n👉 Em đã gặp từ nào trong đề rồi? Comment cho cô biết nhé.\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 63 — Từ cốt lõi Tầng 3 · Phần 2", "i": ["90-ngay/ngay-63.png"], "c": "📅 90 ngày TOPIK II · Ngày 63/90\n\nHôm nay là 8 từ cốt lõi Tầng 3 — từ đề đọc hay gặp. Gặp lại trong đề là đọc được ngay.\n\n• 가정 – gia đình; giả định\n• 소득 – thu nhập\n• 지원 – sự hỗ trợ\n• 학습 – học tập\n• 비율 – tỷ lệ\n• 업체 – doanh nghiệp, công ty\n• 작품 – tác phẩm\n• 적극 – tích cực (적극적)\n\nCâu trong đề: 이 제도는 개인과 가정의 최소한의 생계를 보장하여 경제적 안정성을 높이는 것을 목표로 한다.\n\n👉 Em chọn 1 từ, đặt 1 câu ở comment, cô sửa cho nhé.\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 64 — Nghe 4–12 · Ở trường — Hội thoại trường học", "i": ["90-ngay/ngay-64.png"], "c": "📅 90 ngày TOPIK II · Ngày 64/90\n\nNghe 4–12 · Ở trường — hội thoại trường học.\n\n• 지각하다 = 수업에 늦다 – đi học muộn\n• 결석하다 = 수업에 빠지다 – vắng học\n• 정문 ⇔ 후문 – cổng chính ⇔ cổng sau\n• 강의실, 빈 강의실 – giảng đường, giảng đường trống\n• 학과 사무실 – văn phòng khoa\n• 체육관 - 체육 대회, 운동 기구 – nhà thể chất – đại hội thể thao, dụng cụ thể thao\n• 기숙사 - 방이 남아 있다 – ký túc xá – còn phòng trống\n• 도서관 - 대출(을) 받다 = 대출하다 – thư viện – mượn sách\n\n👉 Em đã gặp từ nào trong đề rồi? Comment cho cô biết nhé.\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 65 — Từ cốt lõi Tầng 3 · Phần 3", "i": ["90-ngay/ngay-65.png"], "c": "📅 90 ngày TOPIK II · Ngày 65/90\n\nHôm nay là 8 từ cốt lõi Tầng 3 — từ đề đọc hay gặp. Gặp lại trong đề là đọc được ngay.\n\n• 관객 – khán giả\n• 속도 – tốc độ\n• 집단 – tập thể, nhóm\n• 체험 – trải nghiệm\n• 집중하다 – tập trung\n• 경쟁 – cạnh tranh\n• 과학 – khoa học\n• 양 – lượng\n\nCâu trong đề: 요리사들은 음식을 만드는 동안 실수와 재미를 더해 가고, 무대는 관객과 하나가 된다.\n\n👉 Em chọn 1 từ, đặt 1 câu ở comment, cô sửa cho nhé.\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 66 — Nghe 4–12 · Bệnh viện, nhà thuốc — Biểu hiện hay nghe", "i": ["90-ngay/ngay-66.png"], "c": "📅 90 ngày TOPIK II · Ngày 66/90\n\nNghe 4–12 · Bệnh viện, nhà thuốc — biểu hiện hay nghe.\n\n• 감기에 걸리다 – bị cảm\n• 과로로 쓰러지다 – kiệt sức gục ngã do làm việc quá sức\n• 기운/힘이 없다 – không có sức lực\n• 기침을 하다 – ho\n• 깁스를 하다 – bó bột\n• 내성이 생기다 – kháng thuốc\n• 눈병에 걸리다 – bị bệnh mắt\n• 눈이 따갑다 – mắt bị rát\n\n👉 Em đã gặp từ nào trong đề rồi? Comment cho cô biết nhé.\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 67 — Từ cốt lõi Tầng 3 · Phần 4", "i": ["90-ngay/ngay-67.png"], "c": "📅 90 ngày TOPIK II · Ngày 67/90\n\nHôm nay là 8 từ cốt lõi Tầng 3 — từ đề đọc hay gặp. Gặp lại trong đề là đọc được ngay.\n\n• 다양 – đa dạng\n• 인생 – cuộc đời\n• 지속 – sự kéo dài, bền vững\n• 평균 – trung bình\n• 결정하다 – quyết định\n• 빠지다 – rơi vào/rớt\n• 위기 – khủng hoảng\n• 이동 – di chuyển\n\nCâu trong đề: 그러므로 가족의 다양성을 인정하고 편견 없이 긍정적으로 받아들일 수 있어야 한다.\n\n👉 Em chọn 1 từ, đặt 1 câu ở comment, cô sửa cho nhé.\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 68 — Nghe 4–12 · Ngân hàng — Từ hay nghe ở ngân hàng", "i": ["90-ngay/ngay-68.png"], "c": "📅 90 ngày TOPIK II · Ngày 68/90\n\nNghe 4–12 · Ngân hàng — từ hay nghe ở ngân hàng.\n\n• 계좌번호 – số tài khoản\n• 금액 – số tiền\n• 달러 – đô la\n• 서류 – hồ sơ/giấy tờ\n• 수표 – ngân phiếu/séc\n• 신용카드 – thẻ tín dụng\n• 외국인 등록증 – thẻ cư trú/đăng ký người nước ngoài\n• 원화 – tiền Won Hàn Quốc\n\n👉 Em đã gặp từ nào trong đề rồi? Comment cho cô biết nhé.\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK", "m": ""}, ầng 3 · Phần 6", "i": ["90-ngay/ngay-72.png"], "c": "📅 90 ngày TOPIK II · Ngày 72/90\n\nHôm nay là 8 từ cốt lõi Tầng 3 — từ đề đọc hay gặp. Gặp lại trong đề là đọc được ngay.\n\n• 특징 – đặc điểm\n• 개발 – sự phát triển, khai thác\n• 당시 – lúc đó\n• 수단 – phương tiện\n• 실제로 – trên thực tế\n• 오늘날 – ngày nay\n• 장 – ruột\n• 표현 – biểu hiện\n\nCâu trong đề: 요즘 한국인들이 생각하는 이상적인 외모에서 가장 두드러진 특징은 크고 쌍꺼풀이 있는 눈이다.\n\n👉 Em chọn 1 từ, đặt 1 câu ở comment, cô sửa cho nhé.\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 73 — Nghe 15 · Bản tin sự cố — Tai nạn, giao thông", "i": ["90-ngay/ngay-73.png"], "c": "📅 90 ngày TOPIK II · Ngày 73/90\n\nNghe 15 · Bản tin sự cố — tai nạn, giao thông.\n\n▸ Tai nạn, sự cố: cách diễn đạt ①\n• 부상자 – người bị thương\n• 부상(을) 당하다 = 부상을 입다 – bị thương\n• 사망자 – người chết\n• 사상자 – thương vong (người chết và bị thương)\n▸ Tai nạn giao thông\n• (차)에 부딪히다 – bị (xe) đâm\n• (차)와 (차)가 충돌하다 – (xe) va chạm với (xe)\n• (차)와 (차)가 추돌하다 – (xe) đâm vào đuôi (xe)\n• (차)를 들이받다 – tông vào (xe)\n\n👉 Em đã gặp từ nào trong đề rồi? Comment cho cô biết nhé.\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 74 — Từ cốt lõi Tầng 3 · Phần 7", "i": ["90-ngay/ngay-74.png"], "c": "📅 90 ngày TOPIK II · Ngày 74/90\n\nHôm nay là 8 từ cốt lõi Tầng 3 — từ đề đọc hay gặp. Gặp lại trong đề là đọc được ngay.\n\n• 효율 – hiệu suất (효율적)\n• 강화하다 – tăng cường\n• 내부 – bên trong\n• 마련하다 – chuẩn bị, sắp đặt\n• 변화하다 – thay đổi\n• 선호하다 – thích hơn/ưa chuộng\n• 쌓이다 – được tích lũy\n• 여유 – sự thong thả, dư dả\n\nCâu trong đề: 풍부한 자원을 효율적으로 이용해 경제 성장을 이루는 현상을 ‘자원의 축복’이라고 한다.\n\n👉 Em chọn 1 từ, đặt 1 câu ở comment, cô sửa cho nhé.\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 75 — Nghe 15 · Dự báo thời tiết — Mưa, nắng, nhiệt độ", "i": ["90-ngay/ngay-75.png"], "c": "📅 90 ngày TOPIK II · Ngày 75/90\n\nNghe 15 · Dự báo thời tiết — mưa, nắng, nhiệt độ.\n\n• 기상청 – cục khí tượng\n• 비구름 – mây mưa\n• 비가 오다 = 내리다 ⇔ 비가 그치다 = 멈추다 – mưa ⇔ tạnh mưa\n• 폭우가 쏟아지다 – mưa như trút nước\n• 장마, 장맛비 – mùa mưa (dầm), mưa dầm\n• 마른장마 – mùa mưa mà không có mưa\n• 가뭄, 가뭄이 심하다 – hạn hán, hạn hán nghiêm trọng\n• 단비 – mưa đúng lúc, cơn mưa quý giá\n\n👉 Em đã gặp từ nào trong đề rồi? Comment cho cô biết nhé.\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 76 — Từ cốt lõi Tầng 3 · Phần 8", "i": ["90-ngay/ngay-76.png"], "c": "📅 90 ngày TOPIK II · Ngày 76/90\n\nHôm nay là 8 từ cốt lõi Tầng 3 — từ đề đọc hay gặp. Gặp lại trong đề là đọc được ngay.\n\n• 익숙하다 – quen thuộc\n• 전국 – toàn quốc\n• 포함되다 – được bao gồm\n• 결정 – quyết định\n• 고개 – đầu, cổ; con dốc\n• 균형 – cân bằng\n• 놀라다 – ngạc nhiên/giật mình\n• 순간 – khoảnh khắc\n\nCâu trong đề: 사람들은 대체로 계획과 준비를 중요하게 여기므로 즉흥적인 행동에 익숙하지 않은 경우가 많다.\n\n👉 Em chọn 1 từ, đặt 1 câu ở comment, cô sửa cho nhé.\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 77 — Nghe 31–32 · Tán thành – phản đối — Nhận ra lập trường người nói", "i": ["90-ngay/ngay-77.png"], "c": "📅 90 ngày TOPIK II · Ngày 77/90\n\nNghe 31–32 · Tán thành – phản đối — nhận ra lập trường người nói.\n\n▸ Cách diễn đạt tán thành\n• 찬성하다 = 동의하다 = 동조하다 – tán thành, đồng ý\n• 공감하다 – đồng cảm\n• 지지하다(지지를 보내다) – ủng hộ\n• 수용하다 = 받아들이다 – tiếp nhận, chấp nhận\n▸ Cách diễn đạt phản đối\n• 반대하다 = 반박하다 – phản đối, phản bác\n• 비판하다 = 지적하다 – phê phán, chỉ trích\n• 대응하다 – ứng phó, đối phó\n• 염려하다 – lo ngại\n\n👉 Em đã gặp từ nào trong đề rồi? Comment cho cô biết nhé.\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 78 — Từ cốt lõi Tầng 3 · Ph quả là ở (nhóm 1), (cái gì) nhiều nhất với (bao nhiêu)%\n• 그 다음으로 (무엇)과 (무엇)이 뒤를 이었다 – tiếp theo là (A) và (B)\n▸ Nguyên nhân, lý do, triển vọng, tóm tắt\n• 이러한 원인으로는 (무엇)과 (무엇)을 들 수 있다 – nguyên nhân của điều này có thể kể đến (A) và (B)\n• 이유에 대해 (무엇), (무엇)이라고 응답하였다 – về lý do, họ trả lời là (A), (B)\n• 앞으로 V-(으)ㄹ 것으로 전망된다/기대된다/예상된다 – trong tương lai, dự kiến sẽ V\n\n👉 Em đã gặp từ nào trong đề rồi? Comment cho cô biết nhé.\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 85 — Từ cốt lõi Tầng 3 · Phần 12", "i": ["90-ngay/ngay-85.png"], "c": "📅 90 ngày TOPIK II · Ngày 85/90\n\nHôm nay là 8 từ cốt lõi Tầng 3 — từ đề đọc hay gặp. Gặp lại trong đề là đọc được ngay.\n\n• 지구 – trái đất\n• 갖추다 – trang bị, có đủ\n• 도로 – đường xá\n• 공유하다 – chia sẻ\n• 과도하다 – quá mức\n• 규모 – quy mô\n• 기본 – cơ bản\n• 비용 – chi phí\n\nCâu trong đề: 플라스틱이나 일회용품의 과잉 소비로 인해 머지않아 지구는 쓰레기 대란을 맞이하게 될 것이다.\n\n👉 Em chọn 1 từ, đặt 1 câu ở comment, cô sửa cho nhé.\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 86 — Viết 54 · Tục ngữ — Mở bài câu 54 cho “có nghề”", "i": ["90-ngay/ngay-86.png"], "c": "📅 90 ngày TOPIK II · Ngày 86/90\n\nViết 54 · Tục ngữ — mở bài câu 54 cho “có nghề”.\n\n• 가는 날이 장날 – đúng ngày đến thì gặp chuyện bất ngờ (không đúng lúc)\n• 가는 말이 고와야 오는 말이 곱다 – lời nói chẳng mất tiền mua, lựa lời mà nói cho vừa lòng nhau\n• 가물에 콩 나듯 하다 – hiếm hoi, thưa thớt\n• 가시 방석에 앉은 듯 – như ngồi trên đống lửa\n• 가재는 게 편 – ngưu tầm ngưu, mã tầm mã (cùng phe bênh nhau)\n• 가지 많은 나무에 바람 잘 날 없다 – cây nhiều cành lắm gió (nhiều con nhiều lo)\n• 갈수록 태산 – càng đi càng khó\n• 같은 값이면 다홍치마 – cùng giá thì chọn cái đẹp hơn\n\n👉 Em đã gặp từ nào trong đề rồi? Comment cho cô biết nhé.\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 87 — Từ cốt lõi Tầng 3 · Phần 13", "i": ["90-ngay/ngay-87.png"], "c": "📅 90 ngày TOPIK II · Ngày 87/90\n\nHôm nay là 8 từ cốt lõi Tầng 3 — từ đề đọc hay gặp. Gặp lại trong đề là đọc được ngay.\n\n• 생산 – sản xuất\n• 실험 – thí nghiệm\n• 여부 – có hay không\n• 커지다 – to ra\n• 개발하다 – phát triển\n• 뛰어나다 – xuất sắc\n• 시각 – thị giác; góc nhìn\n• 안정 – ổn định\n\nCâu trong đề: 대량 생산과 대량 소비를 통해 사람들의 생활이 풍족해졌고 생활 양식이 비슷해졌다.\n\n👉 Em chọn 1 từ, đặt 1 câu ở comment, cô sửa cho nhé.\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 88 — Viết 54 · Tục ngữ — Mở bài câu 54 cho “có nghề”", "i": ["90-ngay/ngay-88.png"], "c": "📅 90 ngày TOPIK II · Ngày 88/90\n\nViết 54 · Tục ngữ — mở bài câu 54 cho “có nghề”.\n\n• 쇠귀에 경 읽기 – nước đổ đầu vịt\n• 쇠뿔도 단김에 빼라 – việc hôm nay chớ để ngày mai\n• 수박 겉 핥기 – cưỡi ngựa xem hoa (hời hợt)\n• 순풍에 돛을 단 배 – thuận buồm xuôi gió\n• 시간은 금 – thời gian là vàng\n• 시간이 약 – thời gian là liều thuốc\n• 시작이 반 – bắt đầu là đã xong một nửa\n• 식은 죽 먹기 – dễ như ăn cháo nguội\n\n👉 Em đã gặp từ nào trong đề rồi? Comment cho cô biết nhé.\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 89 — Từ cốt lõi Tầng 3 · Phần 14", "i": ["90-ngay/ngay-89.png"], "c": "📅 90 ngày TOPIK II · Ngày 89/90\n\nHôm nay là 8 từ cốt lõi Tầng 3 — từ đề đọc hay gặp. Gặp lại trong đề là đọc được ngay.\n\n• 온도 – nhiệt độ\n• 의식 – ý thức; nghi thức\n• 이미 – đã, rồi\n• 행위 – hành vi\n• 각종 – các loại\n• 경향 – xu hướng\n• 담다 – đựng\n• 실시하다 – thực hiện, tiến hành\n\nCâu trong đề: 급격한 온도 변화에 적응하면서 몸을 따뜻하게 만들기 위해 수축된 혈관에 더 많은 혈액을 보낸다.\n\n👉 Em chọn 1 từ, đặt 1 câu ở comment, cô sửa cho nhé.\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt “90 ngày TOPIK II” — trang cá nhân", "t": "Loạt “90 ngày TOPIK II” · Ngày 90 — Ngày ôn", "i": ["90-ngay/ngay-90.png"], "c": "📅 90 ngày TOPIK II · Ngày 90/90 — NGÀY ÔN\n\n9 ngày vừa rồi em có theo kịp không? Đây là 7 từ trong các bài trước. Em viết nghĩa ra giấy (hoặc comment), rồi mới xem đáp án ở comment nhé.\n\nEm đúng được mấy từ? Comment số câu đúng: 7/7 là em đang đi rất đúng nhịp đó 💪", "m": "1. 섭섭하다 – tiếc nuối, buồn phiền\n2. 환불하다 – hoàn tiền\n3. 환자 – bệnh nhân\n4. (조사 기관)에서 (대상)을 대상으로 (주제)에 대하여 조사를 하였다 – (cơ quan) đã khảo sát (đối tượng) về (chủ đề)\n5. 지구 – trái đất\n6. 가는 날이 장날 – đúng ngày đến thì gặp chuyện bất ngờ (không đúng lúc)\n7. 생산 – sản xuất\n\n#90NgayTOPIK #TOPIK2 #TuVungTOPIK #NariTOPIK"}, {"g": "Trang cá nhân \"Tiếng Hàn Ngân Nguyễn\" — bộ 1", "t": "0. Sửa trang (cô tự làm trên điện thoại)", "i": ["ca-nhan/bia.png", "ca-nhan/ghim-1.png", "../quang-cao/topik2-len-3-4/7-ve-co.png", "../quang-cao/topik2-len-3-4/4-app.png", "../quang-cao/topik2-len-3-4/5-danh-gia.png"], "c": "- Ảnh bìa: bia.png. Trên điện thoại ảnh đại diện che phần giữa phía dưới, nên chữ đã để phía trên và hai bên.\n- Tiểu sử (101 ký tự):\n  Giáo viên tiếng Hàn · Luyện thi TOPIK II · Cử nhân ĐH Daegu · Trực tiếp Quỳnh Lưu & online · Zalo 0399 214 554\n- Thông tin cá nhân:\n  - Học vấn: thêm \"Đại học Daegu (대구대학교) – Quản trị kinh doanh\".\n  - Công việc: \"Giáo viên tiếng Hàn – Nari TOPIK\".\n  - Sống tại: đổi thành Quỳnh Lưu. Daegu để ở mục \"Từng sống tại\".\n- Liên kết: https://hoc.naritopik.com/ve-co/\n- Đáng chú ý: ghim-1.png, quang-cao/topik2-len-3-4/7-ve-co.png, 4-app.png, 5-danh-gia.png", "m": ""}, {"g": "Trang cá nhân \"Tiếng Hàn Ngân Nguyễn\" — bộ 1", "t": "1. Bài ghim", "i": ["ca-nhan/ghim-1.png", "../quang-cao/topik2-len-3-4/7-ve-co.png", "../quang-cao/topik2-len-3-4/4-app.png", "../quang-cao/topik2-len-3-4/5-danh-gia.png", "../quang-cao/topik2-len-3-4/3-lo-trinh.png"], "c": "Năm 2005 cô sang Hàn với vốn tiếng Hàn gần như bằng 0. Một năm học tiếng ở Viện tiếng Hàn của Đại học Daegu, rồi bốn năm học Quản trị kinh doanh bằng tiếng Hàn, ngồi cùng giảng đường với sinh viên Hàn Quốc.\n\nSau đó là gần mười năm làm phiên dịch, trưởng phòng, giám đốc chi nhánh cho các công ty Hàn. Từ năm 2020 cô về Quỳnh Lưu đứng lớp.\n\nĐi một vòng như vậy, cô hiểu một điều: học tiếng Hàn để thi không cần học tất cả, mà cần học đúng phần đề hay ra.\n\nVì thế lớp TOPIK của cô học theo đề thật:\n📊 Cô thống kê 20 đề đọc TOPIK II. Từ nào, dạng câu nào hay ra thì học trước.\n📱 Mỗi ngày có bài trên app: từ vựng, nghe, đề thật. Em nộp là cô chấm.\n✍️ Bài viết câu 51–54 được chữa từng câu, so với bài mẫu.\n📈 Định kỳ có bảng đánh giá: em biết mình yếu ở dạng câu nào để sửa đúng chỗ.\n\n📍 Học trực tiếp tại Quỳnh Lưu · 💻 Online toàn quốc\nEm muốn học thử, cứ inbox cô hoặc nhắn Zalo 0399 214 554 nhé. 💙\n\n#NariTOPIK #TOPIK2 #LuyenthiTOPIK #TiengHan", "m": ""}, {"g": "Trang cá nhân \"Tiếng Hàn Ngân Nguyễn\" — bộ 1", "t": "2. Một từ, một câu chuyện #1 — 위하다", "i": ["ca-nhan/tu-01-wihada.png"], "c": "Hồi mới sang Hàn, câu cô nghe nhiều nhất từ bố mẹ ở nhà là: \"Cố lên, vì tương lai của con.\"\nTiếng Hàn nói câu đó bằng một từ rất quen: 위하다.\n\n너의 미래를 위해 – vì tương lai của con.\n\n[Cô kể thêm 1–2 câu: ngày đó cô học vì ai, vì điều gì]\n\nCó một điều cô thống kê được: 위하다 có mặt ở cả 20/20 đề đọc TOPIK II cô đã phân tích. Nắm 3 mẫu này là đọc đâu cũng hiểu:\n• N을/를 위해(서) – vì N\n• V-기 위해(서) – để làm V\n• N을/를 위한 N – N dành cho N\n\n💡 Mẹo câu 3–4: đề hay hỏi -고자 = -기 위해. Gặp -고자 là nghĩ ngay \"để\".\n\nCòn em, em học tiếng Hàn 위해서 điều gì? Comment cho cô biết nhé 👇\n\n#MotTuMotCauChuyen #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Trang cá nhân \"Tiếng Hàn Ngân Nguyễn\" — bộ 1", "t": "3. Một từ, một câu chuyện #2 — 통하다", "i": ["ca-nhan/tu-02-tonghada.png"], "c": "Cô vẫn nhớ cảm giác lần đầu nói chuyện với người Hàn mà không phải nghĩ trong đầu trước. [Kể ngắn: lúc nào, với ai]\n\nNgười Hàn gọi khoảnh khắc đó là 말이 통하다 – lời nói \"thông\" được với nhau.\nLâu hơn nữa thì thành 마음이 통하다 – hiểu lòng nhau.\n\nTrong đề thi, 통하다 xuất hiện ở 20/20 đề đọc, nhưng gần như luôn ở dạng N을/를 통해(서) – \"thông qua\".\n대량 생산과 대량 소비를 통해… – Thông qua sản xuất và tiêu dùng hàng loạt…\n\nGặp 을 통해 là biết ngay: phía trước là cách thức, phía sau là kết quả.\n\nChúc các em sớm có ngày 말이 통하는 날 với tiếng Hàn 💙\n\n#MotTuMotCauChuyen #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Trang cá nhân \"Tiếng Hàn Ngân Nguyễn\" — bộ 1", "t": "4. Một từ, một câu chuyện #3 — 자신", "i": ["ca-nhan/tu-03-jasin.png"], "c": "Có em học sinh nói với cô: \"Cô ơi, em không có 자신 làm đề TOPIK II.\"\n\nMột chữ 자신, hai nghĩa:\n• 자신 (自身 – tự thân): bản thân\n• 자신 (自信 – tự tin): sự tự tin, 자신(이) 있다 = tự tin làm được\n\nCô bảo em: muốn có 자신 (tự tin), em phải tin vào 자신 (bản thân) trước đã. 😊\n\nTừ này có mặt ở 20/20 đề đọc TOPIK II. Đề thường dùng nghĩa \"bản thân\": 자신이 직접 만들고 즐길 때… – khi chính mình tự tay làm và tận hưởng…\n\nHọc từ qua chữ Hán Việt giúp người Việt nhớ nhanh gấp đôi. Đây là lợi thế của mình đó các em.\n\n#MotTuMotCauChuyen #TuVungTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt \"Đọc tiêu đề báo · Câu 25–27\"", "t": "5. Đọc tiêu đề báo #1 — Tăng – giảm", "i": ["ca-nhan/td-01-tang-giam.png", "ca-nhan/td-01b-thu.png", "ca-nhan/td-01c-dap-an.png"], "c": "Câu 25–27 TOPIK II là dạng nhiều em \"sợ\" nhất phần đầu đề đọc. Từ nào cũng biết mà ghép lại vẫn không hiểu tiêu đề nói gì.\n\nLý do là báo Hàn rất ít khi viết 올랐다 hay 떨어졌다. Họ viết 껑충, 고공행진, 하늘 높은 줄 모르는…, đọc theo nghĩa đen thì chẳng thấy chữ \"tăng\" nào cả.\n\nCô xem lại 63 tiêu đề câu 25–27 trong 21 đề đọc: 23 tiêu đề là chuyện giá cả, tăng – giảm. Cứ 3 câu thì có hơn 1 câu rơi vào nhóm này.\n\nẢnh 1 là 14 cách nói tăng – giảm hay gặp nhất. Ảnh 2 là câu 27 trong đề thật TOPIK kỳ 91. Em thử đọc rồi comment số đáp án nhé. Cô hỏi thêm một chữ: 기지개 nghĩa là gì? 😉\n\nTối nay cô đăng đáp án và cách tách tiêu đề ở comment.\n\n#DocTieuDeBao #TOPIK2 #TuVungTOPIK #NariTOPIK", "m": "Đáp án ① 대출 금리가 떨어지면서 부동산 시장이 살아나기 시작했다.\n기지개 là cái vươn vai sau khi ngủ dậy. Trên báo, 기지개(를 켜다) nghĩa là thị trường bắt đầu \"tỉnh dậy\", khởi sắc trở lại.\nBạn nào chọn ③ là bị bẫy chiều ngược: 거래가 줄어들다 (giao dịch giảm) thì trái nghĩa với 기지개.\nMẹo: dấu phẩy giữa hai nửa tiêu đề thường là nguyên nhân → kết quả.\nBài sau cô viết tiếp về nhóm \"được yêu thích, đông người\" (열풍, 구름 관중, 북새통…) nhé. 💙"}, {"g": "⏸ ĐỂ DÀNH — Loạt \"Danh sách ôn TOPIK\" (bí quyết riêng của cô)", "t": "6. Danh sách #1 — 20 từ có mặt ở 20/20 đề đọc", "i": ["ca-nhan/ds-01-20-tu.png"], "c": "Học TOPIK II, nhiều em mua sổ ghi 3.000–4.000 từ rồi… bỏ dở ở trang 30. 😅\n\nCô làm ngược lại: cô tách từng chữ của 20 đề đọc TOPIK II, bỏ từ sơ cấp, rồi đếm xem từ nào đề nào cũng có.\nKết quả: đúng 20 từ không vắng mặt ở đề nào. Riêng 위하다 gặp 396 lần.\n\nHai điều cô rút ra:\n• 5 từ trong đó thật ra là cụm ngữ pháp: 을 위해, 에 대해, 에 따라, 을 통해, 로 인해. Học cả cụm thì đọc câu nhanh hơn hẳn.\n• 16/20 từ là từ Hán: 사회 – xã hội, 영향 – ảnh hưởng, 상황 – tình huống… Người Việt mình có lợi thế lớn ở đây.\n\nEm lưu ảnh lại, mỗi ngày đọc 5 từ. Em thấy từ nào em vẫn hay quên? Comment cho cô nhé 👇\n\n#DanhSachOnTOPIK #TuVungTOPIK #TOPIK2 #NariTOPIK", "m": ""}, {"g": "⏸ ĐỂ DÀNH — Loạt \"Danh sách ôn TOPIK\" (bí quyết riêng của cô)", "t": "7. Danh sách #2 — Chữ tín hiệu trong 4 lựa chọn", "i": ["ca-nhan/ds-02-chu-tin-hieu.png"], "c": "Câu “chọn nội dung đúng với bài” (câu 9–12, 20, 22, 24, 32–34, 43, 47, 50) chiếm gần 1/3 đề đọc. Đọc không kịp bài thì làm sao?\n\nCô soát lại 241 câu dạng này trong 22 đề đọc, đếm từng lựa chọn có chữ “nói tuyệt đối”:\n❌ 전혀 / 절대 xuất hiện 7 lần — chưa lần nào là đáp án.\n❌ 항상 / 늘 / 매일: 1/11. 관계없다 / 필요 없다: 2/19.\n✅ Ngược lại, lựa chọn nói mềm (-기도 하다, -ㄹ 수도 있다, 경우에 따라): 11/12 lần là đáp án đúng.\n\nLý do: bài văn TOPIK hiếm khi nói chắc 100%. Lựa chọn sai thường giữ chữ của bài rồi “nói quá lên”.\n\nNhưng cẩn thận: 모두, 만, 반드시, 가장 thì không phải tín hiệu (≈ 1/4, như đoán bừa). Mẹo này chỉ để loại nhanh khi phân vân, vẫn phải dò lại bài nhé.\n\nEm đã từng bị bẫy “nói quá” bao giờ chưa? 😄\n\n#DanhSachOnTOPIK #DocTOPIK #TOPIK2 #NariTOPIK", "m": ""}, {"g": "Loạt \"Ôn TOPIK cùng cô Ngân\" — đăng ngay bây giờ", "t": "8. Cấu trúc đề TOPIK II", "i": ["ca-nhan/kt-01a-cau-truc-de.png", "ca-nhan/kt-01b-50-cau-doc.png"], "c": "Nhiều em ôn TOPIK II mấy tháng mà vẫn chưa nắm rõ đề có những phần nào, câu nào hỏi gì. Cô tổng hợp lại trong 2 ảnh:\n\n📌 Ảnh 1: 3 phần thi, thời gian, điểm từng câu viết, điểm đạt từng cấp.\n📌 Ảnh 2: 50 câu đọc, câu nào hỏi gì.\n\nBa điều nhiều bạn chưa biết:\n1️⃣ Câu sai không bị trừ điểm → đừng bỏ trống câu nào.\n2️⃣ Không có điểm liệt từng phần: cấp tính theo tổng 300 điểm. Nghe yếu vẫn bù bằng đọc và viết được.\n3️⃣ Câu 54 chiếm 50/100 điểm viết. Bỏ câu 54 là gần như mất luôn cấp 4.\n\nEm lưu lại để ôn nhé. Em đang nhắm cấp mấy? Comment cho cô biết, cô gợi ý nên ưu tiên phần nào 👇\n\n#TOPIK2 #CauTrucDeTOPIK #LuyenthiTOPIK #NariTOPIK", "m": ""}, {"g": "Loạt \"Ôn TOPIK cùng cô Ngân\" — đăng ngay bây giờ", "t": "9. Bộ sưu tập 96 quán ngữ theo bộ phận cơ thể", "i": ["ca-nhan/qn-01-bia.png", "ca-nhan/qn-02-nuan-1.png", "ca-nhan/qn-03-nuan-2.png", "ca-nhan/qn-04-gwi.png", "ca-nhan/qn-05-ip-1.png", "ca-nhan/qn-06-ip-2.png", "ca-nhan/qn-07-son-1.png", "ca-nhan/qn-08-son-2.png", "ca-nhan/qn-09-bal.png", "ca-nhan/qn-10-dau-mat.png", "ca-nhan/qn-11-long.png", "ca-nhan/qn-12-ruot.png", "ca-nhan/qn-13-vai.png", "ca-nhan/qn-14-on-tap.png"], "c": "📚 TỔNG HỢP 96 QUÁN NGỮ TIẾNG HÀN THEO BỘ PHẬN CƠ THỂ (관용 표현)\n\n귀가 얇다 không phải “tai mỏng” mà là cả tin. 손이 크다 không phải “tay to” mà là rộng rãi, hào phóng. 😄\nQuán ngữ là phần dịch từng chữ là sai ngay. Đề đọc TOPIK II có hẳn câu 21 hỏi quán ngữ, còn bài nghe và bài đọc khác cũng dùng rất nhiều.\n\nCô tổng hợp 96 quán ngữ thông dụng, chia theo bộ phận cơ thể cho dễ nhớ:\n👀 눈 (mắt) · 👂 귀 (tai) · 👄 입 (miệng) · ✋ 손 (tay) · 🦶 발 (chân) · 🙂 머리 · 얼굴 · 코 · 💗 가슴 · 마음 · 😣 속 · 애 · 간 · 💪 어깨 · 허리 · 목\nMỗi quán ngữ có nghĩa, câu ví dụ và bản dịch. Ảnh cuối là bài ôn tập 8 câu.\n\n📌 Cách học: mỗi ngày 1 ảnh · che cột nghĩa, nhìn quán ngữ đoán nghĩa · tự đặt 1 câu về em.\n\n👉 Em lưu bài lại để ôn dần, làm bài ôn tập ở ảnh cuối rồi comment đáp án (dạng 1A, 2B…), cô chữa cho nhé!\n\n#QuanNguTiengHan #관용표현 #TuVungTOPIK #TOPIK2 #NariTOPIK", "m": "1C · 2G · 3E · 4A · 5H · 6D · 7B · 8F\n1 발등에 불이 떨어지다 · 2 입이 무겁다 · 3 귀가 얇다 · 4 손이 크다 · 5 눈코 뜰 사이도 없다 · 6 머리를 맞대다 · 7 애를 먹다 · 8 어깨가 무겁다"}, {"g": "Loạt \"Ôn TOPIK cùng cô Ngân\" — đăng ngay bây giờ", "t": "10. Bộ sưu tập 80 từ vựng đọc tiêu đề báo TOPIK", "i": ["ca-nhan/tb-01-bia.png", "ca-nhan/tb-02-yeu-thich.png", "ca-nhan/tb-03-dong-vang.png", "ca-nhan/tb-04-tang.png", "ca-nhan/tb-05-giam.png", "ca-nhan/tb-06-gia-ca.png", "ca-nhan/tb-07-tin-hieu.png", "ca-nhan/tb-08-huy-ket.png", "ca-nhan/tb-09-bat-tay.png", "ca-nhan/tb-10-lien-tiep.png", "ca-nhan/tb-11-y-kien.png", "ca-nhan/tb-12-on-tap.png"], "c": "Đăng cả 12 ảnh trong một bài (ảnh bìa đầu tiên). Tiêu đề mẫu tự soạn theo kiểu báo, không lấy đề thật.\n\n📰 80 TỪ VỰNG ĐỌC TIÊU ĐỀ BÁO TOPIK (câu 25–27)\n\nTiêu đề báo Hàn ngắn mà khó: bỏ hết tiểu từ, kết thúc bằng danh từ, lại hay ví von. 껑충 không phải “nhảy” mà là giá tăng vọt, 기지개 không phải “vươn vai” mà là khởi sắc trở lại, 찬물 là gáo nước lạnh dội vào niềm vui. 😄\n\nCô gom 80 từ hay gặp, chia theo 10 nhóm nghĩa cho dễ nhớ:\n🔥 Được yêu thích · 👥 Đông – vắng · 📈 Tăng – kỷ lục · 📉 Giảm – chững lại · 💰 Giá cả – mua bán\n🚦 Tín hiệu tốt – xấu · ⛔ Hủy – kẹt – trì hoãn · 🤝 Bắt tay – thúc đẩy · ⏩ Liên tiếp – sắp tới · 💬 Ý kiến – phản ứng\n\nMỗi từ có nghĩa, âm Hán Việt (người Việt mình nhớ từ Hán rất nhanh), một tiêu đề mẫu và bản dịch. Ảnh cuối là bài ôn tập 8 câu.\n\n📌 Cách học: mỗi ngày 1 ảnh · che cột nghĩa, đọc tiêu đề mẫu rồi tự dịch · gặp tiêu đề thật trên báo Hàn thì đối chiếu lại.\n\n👉 Em lưu bài lại để ôn dần, làm bài ôn tập ở ảnh cuối rồi comment đáp án (dạng 1A, 2B…), cô chữa cho nhé!\n\n#TieuDeBao #TuVungTOPIK #TOPIK2 #DocTOPIK #NariTOPIK", "m": "1D · 2B · 3H · 4F · 5A · 6G · 7C · 8E\n1 껑충 · 2 결항 · 3 썰렁하다 · 4 기지개를 켜다 · 5 손을 잡다 · 6 무산 · 7 코앞 · 8 엇갈리다"}, {"g": "Đề viết TOPIK II kỳ 108 (18.10.2026) — bài đăng Facebook", "t": "Đề viết TOPIK II kỳ 108 (18.10.2026) · Lời đăng", "i": ["de-viet-108/de-1.png", "de-viet-108/de-2.png"], "c": "📝 ĐỀ VIẾT TOPIK II KỲ 108 (18/10/2026)\n\nCác em vừa thi xong hôm nay vất vả rồi! Cô gửi lại đề viết câu 51–54 kỳ 108 để các em lưu lại, tự làm lại một lần nữa nhé.\n\n✍️ Câu 51 – Email hỏi đặt phòng khách sạn cho thú cưng\n✍️ Câu 52 – Cách xử lý thuốc cũ\n📊 Câu 53 – Tình hình mua mỹ phẩm của khách du lịch nước ngoài\n📚 Câu 54 – Tầm quan trọng của cạnh tranh lành mạnh ở học sinh\n\n👇 Đáp án gợi ý câu 51–52 (kèm vài cách viết khác vẫn được điểm) và bài mẫu câu 53–54 cô để ở comment.\n\n⚠️ Đề do thí sinh nhớ lại nên có thể khác đề gốc một chút.\n\nEm nào muốn cô chữa bài viết của mình theo từng câu, so với bài mẫu thì nhắn Zalo cô 0399 214 554 nhé 💜\n🌐 naritopik.com\n\n#TOPIK #TOPIK108 #쓰기 #NariTOPIK #TiengHan", "m": ""}, {"g": "Đề viết TOPIK II kỳ 108 (18.10.2026) — bài đăng Facebook", "t": "Đề viết TOPIK II kỳ 108 (18.10.2026) · Comment đáp án", "i": ["de-viet-108/2-cau-51.png", "de-viet-108/3-cau-52.png", "de-viet-108/4-cau-53-de.png", "de-viet-108/5-cau-53-mau.png", "de-viet-108/6-cau-54-de.png", "de-viet-108/7-cau-54-mau.png", "de-viet-108/1-bia.png"], "c": "1. (ảnh 2-cau-51) Câu 51: ㉠ 예약하기 전에 · ㉡ 내야 합니까 — kèm các cách viết khác vẫn được điểm.\n2. (ảnh 3-cau-52) Câu 52: ㉠ 버리는 것이 · ㉡ 약이 있다면.\n3. (ảnh 4-cau-53-de + 5-cau-53-mau) Câu 53: bài mẫu 285 chữ, tô sẵn các mẫu câu nên học.\n4. (ảnh 6-cau-54-de + 7-cau-54-mau) Câu 54: dàn ý 3 đoạn + bài mẫu ~660 chữ, tô sẵn từ nối.\n\n(ảnh 1-bia: dùng làm ảnh đầu khi muốn đăng gộp đề + đáp án trong một bài.)", "m": ""}];
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function toast(t){var e=document.getElementById('toast');e.textContent=t;e.classList.add('on');setTimeout(function(){e.classList.remove('on')},1800)}
function copy(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){toast('Đã chép ✓')},function(){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Đã chép ✓')}catch(e){toast('Chưa chép được, cô bôi đen rồi chép tay')}a.remove()})}
function nm(u){return u.split('/').pop()}
function saveAll(i){var p=D[i];toast('Đang tải '+p.i.length+' ảnh…');
 Promise.all(p.i.map(function(u){return fetch(u).then(function(r){return r.blob()}).then(function(b){return new File([b],nm(u),{type:'image/png'})})})).then(function(fs){
  if(navigator.canShare&&navigator.canShare({files:fs})){navigator.share({files:fs}).catch(function(){})}
  else{fs.forEach(function(f,k){setTimeout(function(){var a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=String(k+1).padStart(2,'0')+'-'+f.name;document.body.appendChild(a);a.click();a.remove()},k*350)})}
 },function(){toast('Không tải được ảnh')})}
function big(i,k){var p=D[i],u=p.i[k],e=document.createElement('div');e.className='big';
 e.innerHTML='<img src="'+esc(u)+'"><div>'+(k>0?'<button data-m=-1>‹ Trước</button>':'')+'<a href="'+esc(u)+'" download="'+esc(nm(u))+'">Tải ảnh</a><button data-x>Đóng</button>'+(k<p.i.length-1?'<button data-m=1>Sau ›</button>':'')+'</div><small style="color:#ccc;margin-top:6px">Ảnh '+(k+1)+'/'+p.i.length+' · Điện thoại: nhấn giữ ảnh → Lưu ảnh</small>';
 e.onclick=function(ev){var t=ev.target;if(t.dataset.m){e.remove();big(i,k+ +t.dataset.m)}else if(t.hasAttribute('data-x')||t===e)e.remove()};document.body.appendChild(e)}
var groups=[];D.forEach(function(p){if(groups.indexOf(p.g)<0)groups.push(p.g)});
var cur=-1;try{cur=+(localStorage.getItem('nari-fb-g')||-1)}catch(e){}
function render(){
 document.getElementById('nav').innerHTML='<button data-g=-1 class="'+(cur<0?'on':'')+'">Tất cả</button>'+groups.map(function(g,k){return '<button data-g='+k+' class="'+(cur===k?'on':'')+'">'+esc(g.replace(/^Loạt\s*/,'').replace(/"/g,''))+'</button>'}).join('');
 var h='',lastG=null;D.forEach(function(p,i){var gk=groups.indexOf(p.g);if(cur>=0&&gk!==cur)return;
  if(p.g!==lastG){h+='<div class=g>'+esc(p.g)+'</div>';lastG=p.g}
  h+='<div class=post id=p'+i+'><h2>'+esc(p.t)+' <small>· '+p.i.length+' ảnh</small></h2><div class=imgs>'+p.i.map(function(u,k){return '<a href="'+esc(u)+'" data-i='+i+' data-k='+k+'><img loading=lazy src="'+esc(u)+'" alt="'+esc(nm(u))+'"><span>'+(k+1)+'</span></a>'}).join('')+'</div>'
  +'<div class=bar><button data-all='+i+'>⬇ Lưu cả '+p.i.length+' ảnh</button>'+(p.c?'<button class=y data-c='+i+'>📋 Chép lời đăng</button>':'')+(p.m?'<button class=y data-cm='+i+'>📋 Chép bình luận đáp án</button>':'')+'</div>'
  +(p.c?'<div class=lb>Lời đăng</div><pre>'+esc(p.c)+'</pre>':'')+(p.m?'<div class=lb>Bình luận đáp án</div><pre>'+esc(p.m)+'</pre>':'')+'</div>'});
 document.getElementById('list').innerHTML=h}
document.addEventListener('click',function(ev){var t=ev.target.closest('[data-g],[data-all],[data-c],[data-cm],a[data-i]');if(!t)return;
 if(t.dataset.g!=null){cur=+t.dataset.g;try{localStorage.setItem('nari-fb-g',cur)}catch(e){}render()}
 else if(t.dataset.all!=null)saveAll(+t.dataset.all);
 else if(t.dataset.c!=null)copy(D[+t.dataset.c].c);
 else if(t.dataset.cm!=null)copy(D[+t.dataset.cm].m);
 else if(t.dataset.i!=null){ev.preventDefault();big(+t.dataset.i,+t.dataset.k)}});
render();
</script></body></html>
