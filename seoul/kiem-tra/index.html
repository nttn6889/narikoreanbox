h2{font-size:20px;margin:28px 0 4px;padding-top:8px;border-top:2px solid var(--ink)}

.qn{font-size:13px;color:var(--muted);margin-bottom:4px}
.qt{font-size:17px;margin:0 0 4px}
.vi{font-size:14px;color:var(--muted);margin:0 0 8px;font-style:italic}

.rate .st{display:flex;gap:4px}

.rate .st button.on{background:var(--acc);color:#fff;border-color:var(--acc)}

.name{display:flex;gap:8px;align-items:center;margin:12px 0}
.name input{flex:1;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.bar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--soft);padding:10px 0;margin-top:20px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.bar .prog{font-size:14px;color:var(--muted)}
.btn{font:inherit;font-weight:bold;padding:10px 18px;border-radius:8px;border:0;background:var(--acc);color:#fff;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:normal}

.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:12px 0}
.tile{border:1px solid var(--soft);border-radius:10px;padding:10px 12px}
.tile .k{font-size:13px;color:var(--muted)}
.tile .v{font-size:22px;font-weight:bold}
.tile .m{height:6px;background:var(--sub);border-radius:3px;margin-top:6px;overflow:hidden}
.tile .m i{display:block;height:100%;background:var(--acc)}
.tile.lo .m i{background:var(--bad)}
.tile.mid .m i{background:var(--warn)}
.tile .g{font-size:12.5px;color:var(--muted);margin-top:4px}
table{border-collapse:collapse;width:100%;font-size:15px;margin:8px 0}
th,td{border:1px solid var(--soft);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--sub);font-weight:bold}
td.n{text-align:center;white-space:nowrap}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:10px;margin-right:4px;white-space:nowrap}
.t-ok{background:var(--okbg);color:var(--ok)}
.t-bad{background:var(--badbg);color:var(--bad)}
.t-warn{background:var(--warnbg);color:var(--warn)}
.t-mut{background:var(--sub);color:var(--muted)}

.rv.guess{border-left-color:var(--warn)}
.rv.skip{border-left-color:#999}
.rv .why{font-size:14.5px;color:#333;margin-top:4px}
.rv .ans{font-size:15px;margin-top:2px}
.note{background:var(--warnbg);border-radius:8px;padding:10px 12px;font-size:15px}
.share{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.who{background:#e8f0f8;border-radius:8px;padding:10px 12px;margin:8px 0}
@media print{.bar,.share,.noprint{display:none!important}.card{break-inside:avoid}}

 {id:"F4",s:"F",b:"3A",l:"3A Bài 5 · Hối tiếc",g:"-(으)ㄹ걸 그랬다",vi:"Lẽ ra tôi nên mặc thử rồi mới mua.",q:"입어 보고 <span class=blank>( )</span>.",o:[["살걸 그랬어요"],["산 걸 그랬어요","Mẫu hối tiếc luôn dùng -(으)ㄹ걸."],["사야 돼요","= phải mua (hiện tại), không có nghĩa hối tiếc."],["살 거예요","= sẽ mua."]]}

var RATE = [["nghe","Nghe hiểu cô nói trên lớp"],["noi","Nói, trả lời câu hỏi"],["doc","Đọc bài khóa"],["viet","Viết câu, viết đoạn"],["tv","Nhớ từ vựng"],["np","Hiểu và dùng ngữ pháp"],["cd","Chia đuôi, bất quy tắc"]];
var HARD = ["Cô nói nhanh, em không theo kịp","Nhiều từ mới, học xong mau quên","Hiểu ngữ pháp nhưng không biết dùng khi nói/viết","Hay nhầm các ngữ pháp giống nhau","Không nhớ cách chia bất quy tắc","Ngại nói trước lớp","Bài tập về nhà khó, không tự làm được","Không có thời gian ôn bài","Các bài 1A–1B đã quên nhiều"];
var BOOKS = ["1A","1B","2A","2B"];
var KEY = "nari-kt-seoul";

/* ===== Tiện ích ===== */
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function b64e(obj){return btoa(unescape(encodeURIComponent(JSON.stringify(obj)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function b64d(raw){var b=String(raw).replace(/-/g,"+").replace(/_/g,"/");while(b.length%4)b+="=";return JSON.parse(decodeURIComponent(escape(atob(b))))}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function hash(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)}
function order(q){ // thứ tự hiển thị cố định theo mã câu
  var idx=q.o.map(function(_,i){return i}),h=hash(q.id+"nari");
  for(var i=idx.length-1;i>0;i--){h=(h*1103515245+12345)&0x7fffffff;var j=h%(i+1),t=idx[i];idx[i]=idx[j];idx[j]=t}
  return idx;
}
function norm(s){return String(s||"").replace(/[\s.。,!?~]/g,"").normalize("NFC")}
function qById(id){for(var i=0;i<Q.length;i++)if(Q[i].id===id)return Q[i]}

/* S = {n: tên, a:{id: chỉ số gốc | -1 (chưa học) | "chuỗi gõ"}, c:{id: 1 chắc | 2 đoán}, r:{mã: 1..4}, h:[chỉ số khó khăn], x: ý kiến, d: ngày nộp} */
var S = load(); S.a=S.a||{}; S.c=S.c||{}; S.r=S.r||{}; S.h=S.h||[];

function isCorrect(q,v){
  if(v==null||v===""||v===-1)return false;
  if(q.a){var n=norm(v);return q.a.some(function(x){return norm(x)===n})}
  return v===0;
}
function answered(q){var v=S.a[q.id];return v!=null&&v!==""}

/* ===== Làm bài ===== */
function renderTest(){
  var h='<div class="intro"><p>Bài này giúp cô biết em đang vững phần nào, còn hổng phần nào trong Seoul 1A–2B để soạn lộ trình học 3A cho em. <b>Không lấy điểm</b>, em cứ làm thật nhé.</p><ul>'+
   '<li>Khoảng 40 phút, 53 câu, 6 phần. Bài tự lưu trên máy, tắt đi mở lại vẫn còn.</li>'+
   '<li>Sau mỗi câu, chọn <b>Chắc chắn</b> hoặc <b>Đoán</b> — phần này quan trọng với cô hơn cả điểm.</li>'+
   '<li>Câu nào chưa học hoặc không biết thì bấm <b>“Em chưa học / không biết”</b>, đừng đoán bừa.</li>'+
   '<li>Không tra từ điển, không hỏi bạn.</li></ul></div>'+
   '<div class="name"><label for="nm"><b>Tên em:</b></label><input id="nm" value="'+esc(S.n||"")+'" placeholder="Họ và tên"></div>';
  SECS.forEach(function(sec){
    h+='<h2>Phần '+sec.k+'. '+sec.t+'<small>'+sec.d+'</small></h2>';
    var lastP=0;
    Q.forEach(function(q,qi){
      if(q.s!==sec.k)return;
      if(q.p&&q.p!==lastP){lastP=q.p;h+='<div class="passage ko">'+(q.p===1?P1:P2)+'</div>'}
      h+=renderQ(q,qi);
    });
  });
  h+='<h2>Phần G. Em tự đánh giá<small>Không có đúng sai, em chọn theo cảm nhận của mình</small></h2>'+
   '<div class="card self"><div class="qt">Em thấy mình làm tốt những việc sau đến mức nào? <span class="vi">(1 = rất khó · 4 = dễ)</span></div><div class="rate">';
  RATE.forEach(function(r){
    h+='<div>'+r[1]+'</div><div class="st">';
    for(var i=1;i<=4;i++)h+='<button type="button" data-rate="'+r[0]+'" data-v="'+i+'" class="'+(S.r[r[0]]===i?"on":"")+'">'+i+'</button>';
    h+='</div>';
  });
  h+='</div></div><div class="card self"><div class="qt">Khi học trên lớp, em hay gặp khó khăn nào? <span class="vi">(chọn nhiều)</span></div>';
  HARD.forEach(function(t,i){h+='<label><input type="checkbox" data-hard="'+i+'"'+(S.h.indexOf(i)>=0?" checked":"")+'> '+t+'</label>'});
  h+='</div><div class="card"><div class="qt">Phần nào em thấy khó nhất? Em mong học phụ đạo sẽ giúp em điều gì?</div><textarea id="tx" placeholder="Em viết thoải mái…">'+esc(S.x||"")+'</textarea></div>';
  h+='<div class="bar"><span class="prog" id="prog"></span><button class="btn" id="submit">Nộp bài</button></div>';
  $("#app").innerHTML=h;
  bindTest(); prog();
}
function renderQ(q,qi){
  var v=S.a[q.id],c=S.c[q.id],num=qi+1;
  var h='<div class="card" id="q-'+q.id+'"><div class="qn">Câu '+num+'</div>';
  if(q.s==="A")h+='<div class="qt"><span class="ko"><b>'+esc(q.q)+'</b></span></div><div class="vi">'+(/[가-힣]/.test(q.q)?"Nghĩa là gì?":"Tiếng Hàn là gì?")+'</div>';
  else{
    h+='<div class="qt ko">'+(q.a?esc(q.q).replace("___",'<span class="blank">( )</span>'):q.q)+'</div>';
    if(q.vi)h+='<div class="vi">'+esc(q.vi)+'</div>';
    if(q.h)h+='<div class="vi ko">('+esc(q.h)+')</div>';
  }
  if(q.a){
    h+='<input class="in ko" data-in="'+q.id+'" value="'+(typeof v==="string"?esc(v):"")+'" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Gõ tiếng Hàn…">'+
       '<div class="opts" style="margin-top:6px"><button type="button" class="opt idk'+(v===-1?" on":"")+'" data-q="'+q.id+'" data-v="-1">Em chưa học / không biết</button></div>';
  }else{
    h+='<div class="opts">';
    order(q).forEach(function(oi,k){
      h+='<button type="button" class="opt'+(v===oi?" on":"")+'" data-q="'+q.id+'" data-v="'+oi+'"><b>'+(k+1)+'</b><span class="'+(/[가-힣]/.test(q.o[oi][0])?"ko":"")+'">'+esc(q.o[oi][0])+'</span></button>';
    });
    h+='<button type="button" class="opt idk'+(v===-1?" on":"")+'" data-q="'+q.id+'" data-v="-1">Em chưa học / không biết</button></div>';
  }
  h+='<div class="conf" data-conf="'+q.id+'"'+(v===-1?' hidden':'')+'>Em làm câu này: <button type="button" data-c="1" class="'+(c===1?"on":"")+'">Chắc chắn</button><button type="button" data-c="2" class="'+(c===2?"on":"")+'">Đoán</button></div></div>';
  return h;
}
function bindTest(){
  $("#nm").oninput=function(){S.n=this.value.trim();save()};
  $("#tx").oninput=function(){S.x=this.value;save()};
  document.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){
    var id=b.dataset.q,v=+b.dataset.v;S.a[id]=v;if(v===-1)delete S.c[id];
    var card=$("#q-"+id);card.querySelectorAll(".opt").forEach(function(x){x.classList.toggle("on",x===b)});
    card.querySelector(".conf").hidden=v===-1;card.classList.remove("need");
    var inp=card.querySelector(".in");if(inp&&v===-1)inp.value="";
    save();prog();
  }});
  document.querySelectorAll(".in").forEach(function(inp){inp.oninput=function(){
    var id=inp.dataset.in,card=$("#q-"+id);S.a[id]=inp.value.trim();
    var idk=card.querySelector(".idk");if(idk)idk.classList.remove("on");
    card.querySelector(".conf").hidden=false;card.classList.remove("need");save();prog();
  }});
  document.querySelectorAll(".conf button").forEach(function(b){b.onclick=function(){
    var id=b.parentNode.dataset.conf;S.c[id]=+b.dataset.c;
    b.parentNode.querySelectorAll("button").forEach(function(x){x.classList.toggle("on",x===b)});save();prog();
  }});
  document.querySelectorAll("[data-rate]").forEach(function(b){b.onclick=function(){
    S.r[b.dataset.rate]=+b.dataset.v;document.querySelectorAll('[data-rate="'+b.dataset.rate+'"]').forEach(function(x){x.classList.toggle("on",x===b)});save();
  }});
  document.querySelectorAll("[data-hard]").forEach(function(cb){cb.onchange=function(){
    var i=+cb.dataset.hard,k=S.h.indexOf(i);if(cb.checked&&k<0)S.h.push(i);if(!cb.checked&&k>=0)S.h.splice(k,1);save();
  }});
  $("#submit").onclick=submit;
}
function prog(){
  var n=Q.filter(answered).length;
  $("#prog").textContent="Đã làm "+n+"/"+Q.length+" câu";
}
function submit(){
  if(!S.n){alert("Em ghi tên trước khi nộp nhé.");$("#nm").focus();return}
  var miss=Q.filter(function(q){return !answered(q)});
  var noc=Q.filter(function(q){return answered(q)&&S.a[q.id]!==-1&&!S.c[q.id]});
  var first=miss[0]||noc[0];
  document.querySelectorAll(".card.need").forEach(function(c){c.classList.remove("need")});
  miss.concat(noc).forEach(function(q){$("#q-"+q.id).classList.add("need")});
  if(miss.length){alert("Em còn "+miss.length+" câu chưa làm (khung vàng). Câu nào không biết thì bấm “Em chưa học / không biết”.");$("#q-"+first.id).scrollIntoView({block:"center"});return}
  if(noc.length&&!confirm("Còn "+noc.length+" câu em chưa chọn “Chắc chắn / Đoán” (khung vàng). Vẫn nộp bài?")){$("#q-"+first.id).scrollIntoView({block:"center"});return}
  S.d=new Date().toISOString().slice(0,10);S.done=1;save();
  location.hash="";renderResult(S,false);scrollTo(0,0);
}

/* ===== Kết quả ===== */
function stat(R,list){
  var t={n:list.length,ok:0,sure:0,guess:0,idk:0};
  list.forEach(function(q){var v=R.a[q.id];if(v===-1)t.idk++;if(isCorrect(q,v)){t.ok++;if(R.c[q.id]===2)t.guess++;else t.sure++}});
  return t;
}
function tile(label,t,sub){
  var p=t.n?t.sure/t.n:0,cl=p<.5?"lo":p<.8?"mid":"";
  return '<div class="tile '+cl+'"><div class="k">'+label+'</div><div class="v">'+t.ok+'/'+t.n+'</div><div class="m"><i style="width:'+Math.round((t.ok?t.sure/t.n:0)*100)+'%"></i></div><div class="g">'+[sub,t.guess?t.guess+' câu đúng nhờ đoán':'',t.idk?t.idk+' chưa học':''].filter(Boolean).join(' · ')+'</div></div>';
}
function wrongNote(q,v){
  if(v===-1)return "Em chưa học / không biết.";
  if(q.a){var n=norm(v);for(var k in q.w)if(norm(k)===n)return q.w[k];return q.gen}
  return (q.o[v]&&q.o[v][1])||"";
}
function ansText(q,v){
  if(v===-1)return "—";
  if(q.a)return v;
  return q.o[v]?q.o[v][0]:"";
}
function renderResult(R,teacher){
  var all=stat(R,Q),core=Q.filter(function(q){return q.s!=="F"});
  var h='';
  if(teacher)h+='<div class="who">Bài làm của <b>'+esc(R.n)+'</b>'+(R.d?' · nộp ngày '+R.d.split("-").reverse().join("/"):'')+'</div>';
  else h+='<p>Em đã nộp bài. Bấm <b>“Gửi kết quả cho cô”</b> ở dưới để gửi qua Zalo nhé.</p>';
  var cs=stat(R,core);
  h+='<h2>Tổng quan<small>Thanh màu = tỉ lệ câu đúng <b>và chắc chắn</b> (câu đúng nhờ đoán không tính là vững)</small></h2>';
  h+='<div class="sum">'+tile("Nền tảng 1A–2B (phần A–E)",cs)+'</div>';
  h+='<h2>Theo phần</h2><div class="sum">';
  SECS.forEach(function(sec){h+=tile(sec.k+". "+sec.t,stat(R,Q.filter(function(q){return q.s===sec.k})))});
  h+='</div><h2>Theo cuốn<small>Chỉ tính phần A–E</small></h2><div class="sum">';
  BOOKS.forEach(function(b){var l=core.filter(function(q){return q.b===b});if(l.length)h+=tile("Seoul "+b,stat(R,l))});
  h+='</div>';
  // Cần ôn trước 3A
  var need=Q.filter(function(q){return q.need&&!(isCorrect(q,R.a[q.id])&&R.c[q.id]!==2)});
  if(need.length){
    h+='<h2>Cần ôn trước khi vào 3A<small>Những điểm 3A sẽ dùng lại mà em còn sai hoặc phải đoán</small></h2><table><tr><th>Kiến thức</th><th>3A dùng ở</th></tr>';
    need.forEach(function(q){h+='<tr><td><span class="ko">'+esc(q.g)+'</span> <span class="tag t-mut">'+q.b+'</span></td><td>'+esc(q.need)+'</td></tr>'});
    h+='</table>';
  }
  // Chi tiết từng câu
  var bad=Q.filter(function(q){return !isCorrect(q,R.a[q.id])||R.c[q.id]===2});
  h+='<h2>Các câu cần xem lại<small>'+bad.length+' câu: sai, chưa học, hoặc đúng nhưng đoán</small></h2>';
  bad.forEach(function(q){
    var v=R.a[q.id],ok=isCorrect(q,v),cls=ok?"guess":v===-1?"skip":"";
    var tg=ok?'<span class="tag t-warn">Đúng nhưng đoán</span>':v===-1?'<span class="tag t-mut">Chưa học</span>':'<span class="tag t-bad">Sai</span>'+(R.c[q.id]===1?'<span class="tag t-bad">em tưởng chắc</span>':'');
    var qtext=q.s==="A"?q.q:(q.vi||q.q.replace(/<[^>]+>/g," "));
    h+='<div class="rv '+cls+'"><div>'+tg+' <b>Câu '+(Q.indexOf(q)+1)+'</b> · '+esc(q.b)+' '+esc(q.l)+(q.g!==q.l?' · <span class="ko">'+esc(q.g)+'</span>':'')+'</div>'+
      '<div class="ans ko">'+esc(qtext)+'</div>'+
      (ok?'':'<div class="ans">Em chọn: <span class="ko">'+esc(ansText(q,v))+'</span> → Đúng: <b class="ko">'+esc(q.a?q.a[0]:q.o[0][0])+'</b></div>')+
      (!ok&&v!==-1?'<div class="why">'+esc(wrongNote(q,v))+'</div>':'')+'</div>';
  });
  if(!bad.length)h+='<p>Em làm đúng và chắc chắn tất cả các câu. Giỏi lắm!</p>';
  // Tự đánh giá
  h+='<h2>Em tự đánh giá</h2><table><tr><th>Kỹ năng</th><th class="n">1 khó → 4 dễ</th></tr>';
  RATE.forEach(function(r){var v=R.r[r[0]];h+='<tr><td>'+r[1]+'</td><td class="n">'+(v?'<span class="tag '+(v<=2?"t-bad":"t-ok")+'">'+v+'</span>':'—')+'</td></tr>'});
  h+='</table>';
  if(R.h&&R.h.length)h+='<p><b>Khó khăn khi học:</b></p><ul>'+R.h.map(function(i){return '<li>'+esc(HARD[i])+'</li>'}).join("")+'</ul>';
  if(R.x)h+='<p><b>Em viết:</b></p><div class="note">'+esc(R.x).replace(/\n/g,"<br>")+'</div>';
  if(teacher)h+='<h2>Gợi ý đọc kết quả</h2><ul class="intro"><li><b>Sai + “em tưởng chắc”</b>: em hiểu sai, cần dạy lại.</li><li><b>Đúng nhưng đoán</b>: em đã gặp nhưng chưa vững, cần luyện thêm.</li><li><b>Chưa học</b> ở phần A–E: lỗ hổng kiến thức; ở phần F là bình thường (ngữ pháp 3A).</li><li>Phần F đúng chắc → có thể đi nhanh các bài 3A đó.</li></ul>';
  h+='<div class="share noprint">';
  if(!teacher)h+='<button class="btn" id="send">Gửi kết quả cho cô</button><button class="btn ghost" id="redo">Làm lại từ đầu</button>';
  else h+='<button class="btn ghost" onclick="print()">In / lưu PDF</button>';
  h+='</div>';
  $("#app").innerHTML=h;
  if(!teacher){
    $("#send").onclick=function(){
      var link=location.href.split("#")[0]+"#r="+b64e({n:R.n,d:R.d,a:R.a,c:R.c,r:R.r,h:R.h,x:R.x||""});
      var text="Cô ơi, em là "+R.n+", em gửi kết quả bài kiểm tra nền tảng Seoul 1A–2B: "+link;
      if(navigator.share){navigator.share({title:"Kết quả kiểm tra",text:text}).catch(function(){})}
      else if(navigator.clipboard){navigator.clipboard.writeText(text).then(function(){alert("Đã chép link kết quả. Em dán vào Zalo gửi cô nhé.")},function(){prompt("Em chép link này gửi cô:",text)})}
      else prompt("Em chép link này gửi cô:",text);
    };
    $("#redo").onclick=function(){if(confirm("Xóa bài đã làm và làm lại từ đầu?")){S={a:{},c:{},r:{},h:[],n:S.n};save();renderTest();scrollTo(0,0)}};
  }
}

/* ===== Khởi động ===== */
function boot(){
  var m=location.hash.match(/#r=([\w-]+)/);
  if(m){try{var R=b64d(m[1]);R.a=R.a||{};R.c=R.c||{};R.r=R.r||{};R.h=R.h||[];document.title="Kết quả · "+R.n;renderResult(R,true);return}catch(e){}}
  if(S.done)renderResult(S,false);else renderTest();
}
window.addEventListener("hashchange",boot);
boot();
</script>
