<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiểm tra Seoul 3A · Nari TOPIK</title>
<meta name="description" content="Bài kiểm tra sau mỗi bài Seoul 3A: trộn các ngữ pháp của bài, có dịch Việt → Hàn, báo cho cô biết em hổng ngữ pháp nào, viên gạch nền 1A–2B nào.">

<style>
:root{--ink:#111;--line:#555;--soft:#d8dde6;--sub:#f3f4f6;--muted:#666;--bg:#fff;--acc:#1f5c8a;--ok:#1d7a3a;--okbg:#e7f5ec;--bad:#b0283c;--badbg:#fbe9ec;--warn:#9a6400;--warnbg:#fff4dc;--hl:#ffe9a8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Arial,"Noto Sans KR","Malgun Gothic",sans-serif}
main{max-width:760px;margin:0 auto;padding:16px 16px 64px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 0 10px;margin:0 0 10px;border-bottom:1px solid var(--soft)}
.brand .logo{display:block;height:50px;width:auto;margin:0 0 2px -4px}
.brand span{font-size:14px;color:var(--muted)}
.brand span a{color:inherit;text-decoration:none;border-bottom:1px dotted var(--muted)}
.co{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:var(--muted);font-size:12px}
.co i{width:40px;height:40px;border-radius:50%;background:#1f3c88;color:#fff;display:grid;place-items:center;font:bold 17px Georgia,serif;font-style:normal}
h1{font-size:24px;margin:6px 0 2px}
h1 small{display:block;font-size:17px;font-weight:normal;color:var(--acc)}
h2{font-size:20px;margin:26px 0 6px;padding-top:8px;border-top:2px solid var(--ink)}
h3{font-size:17px;margin:14px 0 4px}
.ko{font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;word-break:keep-all}
.intro{color:#333}.intro li{margin:2px 0}
nav{display:flex;margin:0 -16px 12px;padding:8px 16px;position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:3}
nav .bar{display:flex;flex:1;border:2px solid var(--ink);border-radius:8px;overflow:hidden}
nav a{flex:1;text-align:center;padding:6px 2px;color:var(--ink);text-decoration:none;font-weight:bold;font-size:15px;line-height:1.2}
nav a+a{border-left:2px solid var(--ink)}
nav a small{display:block;font-weight:normal;font-size:11.5px}
nav a.on{background:var(--ink);color:#fff}
.gl{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.gl span{border:1px solid var(--soft);border-radius:6px;padding:2px 8px;font-size:14px;background:var(--sub)}
.card{border:1px solid var(--soft);border-radius:10px;padding:12px 14px;margin:12px 0;background:#fff}
.card.ok{border-color:var(--ok)}.card.bad{border-color:var(--bad)}
.qn{font-size:13px;color:var(--muted);margin-bottom:4px;display:flex;justify-content:space-between;gap:8px}
.qt{font-size:16.5px;margin:0 0 8px}
.vi{font-size:17px;font-weight:bold;margin:0 0 4px}
.hint{font-size:14px;color:var(--muted);margin:0 0 6px}
.opt{display:block;width:100%;text-align:left;margin:5px 0;padding:8px 10px;border:1px solid var(--soft);border-radius:8px;background:#fff;font:inherit;font-size:16px;cursor:pointer;color:var(--ink)}
.opt.sel{border-color:var(--acc);background:#eaf1f8;box-shadow:inset 0 0 0 1px var(--acc)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default;color:var(--ink)}
input.ans,textarea.ans{width:100%;font:inherit;font-size:17px;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
textarea.ans{min-height:64px;resize:vertical}
.unsure{display:inline-flex;align-items:center;gap:5px;font-size:14px;color:var(--warn);margin-top:6px;cursor:pointer}
.fb{margin-top:8px;padding:8px 10px;border-radius:8px;font-size:15px}
.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}.fb.mid{background:var(--warnbg)}
.fb .m{display:block;margin:2px 0}
.self{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.btn{display:inline-block;padding:9px 16px;border:2px solid var(--ink);border-radius:8px;background:var(--ink);color:#fff;font:bold 15px Arial,sans-serif;cursor:pointer;text-decoration:none}
.btn.ghost{background:#fff;color:var(--ink)}
.btn.sm{padding:5px 10px;font-size:14px}
.btn.on{background:var(--acc);border-color:var(--acc);color:#fff}
.share{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.prog{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--soft);padding:8px 0;display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:16px}
table.t{border-collapse:collapse;width:100%;font-size:15px;margin:6px 0 12px}
table.t th,table.t td{border:1px solid var(--soft);padding:5px 7px;text-align:left;vertical-align:top}
table.t th{background:var(--sub)}
td.n{text-align:center;white-space:nowrap}
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.tile{flex:1 1 140px;border:1px solid var(--soft);border-radius:10px;padding:8px 10px}
.tile b{display:block;font-size:24px}
.tile span{font-size:13px;color:var(--muted)}
.weak{padding:8px 12px;background:var(--warnbg);border-left:4px solid var(--warn);margin:10px 0}
.good{padding:8px 12px;background:var(--okbg);border-left:4px solid var(--ok);margin:10px 0}
.note{font-size:14px;color:var(--muted)}
.bar2{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;min-width:60px}
.bar2 i{display:block;height:100%;background:var(--ok)}
/* phần của cô */
.gc{border:2px solid var(--ink);border-radius:10px;margin:14px 0;overflow:hidden}
.gc>.hd{background:var(--ink);color:#fff;padding:6px 12px;font-weight:bold}
.gc>.bd{padding:6px 12px 10px}
.oq{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--soft)}
.oq:last-child{border-bottom:0}
.oq .tx{flex:1}
.oq .a{display:none;margin-top:3px;color:var(--ok);font-weight:bold}
.oq.show .a{display:block}
.oq .tg{font-size:12px;color:var(--muted)}
.oq button{flex:none}
.oq.miss{background:var(--badbg)}
.ear{font-size:14.5px;margin:6px 0 0;padding:6px 10px;background:var(--sub);border-radius:6px}
@media print{nav,.share,.prog,.noprint{display:none!important}.card{break-inside:avoid}}
</style>
</head>

<script>
/* ===== Viên gạch: lỗi của câu được quy về đâu =====
   n1–n6 giống thẻ Nền tảng của seoul/3a-1/; np = chọn sai mẫu / dùng sai ngữ pháp của bài; tv = từ vựng, tiểu từ đi với từ. */
var NAME={n1:'Động từ hay tính từ',n2:'받침, gốc ㄹ',n3:'Bất quy tắc',n4:'Thì (quá khứ, tương lai)',n5:'이다 / 아니다 (danh từ)',n6:'Kính ngữ',
  np:'Chọn sai mẫu ngữ pháp',tv:'Từ vựng, tiểu từ'};
var GATE={n1:'1A–1B: phân biệt động từ / tính từ (hiện tại -ㄴ/는다, định ngữ -는 / -(으)ㄴ)',n2:'1A: có 받침 hay không, gốc ㄹ rụng trước ㄴ',
  n3:'1A–1B: bất quy tắc ㅂ, ㄷ, ㅡ, 르, ㅅ',n4:'1A–2A: quá khứ -았/었-, tương lai -(으)ㄹ 거예요',n5:'1A: N이에요/예요, N이/가 아니에요',
  n6:'1B Bài 9: -(으)시-, 께서, từ kính ngữ',np:'Bài 3A đang học: nghĩa và tình huống dùng của từng mẫu',tv:'Từ vựng bài 3A + tiểu từ đi kèm'};

/* ===== Đề từng bài =====
   g: ngữ pháp (1–4, 0 = trộn), n: viên gạch của câu.
   t:'c' chọn — o: lựa chọn, phần tử đầu là đáp án (trang tự đảo); x[i] = viên gạch nếu em chọn lựa chọn i (lỗi cụ thể hơn n).
   t:'y' gõ — q có (    ), h: từ gốc + đuôi, a: các đáp án đúng, e: {đáp án sai hay gặp: ghi chú}.
   t:'d' dịch Việt → Hàn — vi, h: gợi ý từ (bỏ trống = không gợi ý), a: câu mẫu (máy tự nhận nếu trùng; khác thì em tự so).
   Thêm câu mới thì dùng id mới (link kết quả đã gửi dựa vào id). */
var K={
'1':{t:'Bài 1 · 신입생 환영회를 한다고 해요',vi:'Nghe nói sẽ có tiệc chào đón tân sinh viên',
 g:['① -다고 하다','② -아/어야겠다','③ -다고 들었다','④ -대(요)'],
 q:[
 {id:'a1',t:'c',g:1,n:'n1',q:'친구가 요즘 시험 때문에 많이 (    ).',o:['바쁘다고 했어요','바쁜다고 했어요','바빠다고 했어요','바쁘라고 했어요'],x:['','n1','n3','np'],
  w:'바쁘다 là tính từ → giữ nguyên + 다고: 바쁘다고. -ㄴ다고 chỉ dùng cho động từ. 바쁘라고 là câu mệnh lệnh (Bài 2).'},
 {id:'a2',t:'y',g:4,n:'n2',q:'하준: “저는 기숙사에서 살아요.” → 하준 씨는 기숙사에서 (    ).',a:['산대요','산다고 해요','산다고 했어요'],
  e:{'살는대요':'Gốc ㄹ gặp ㄴ thì ㄹ rụng: 살 → 산대요.','사는대요':'Động từ hiện tại thêm -ㄴ대요 (không có 받침 sau khi ㄹ rụng), không phải -는대요.','살대요':'살다 là động từ → phải có -ㄴ-: 산대요.','산데요':'Kể lại lời người khác viết ㅐ: -대요.'},
  w:'살다 → 살 + ㄴ대요 → ㄹ rụng → 산대요.'},
 {id:'a3',t:'d',g:2,n:'np',vi:'Mai thi rồi. Tối nay phải ôn bài thôi.',

  w:'“phải … thôi” = người nói tự quyết định → -아/어야겠어요: 복습하다 → 복습해야겠어요. Không dùng -아야 해요 (quy định chung).'},
 {id:'a4',t:'c',g:3,n:'n5',q:'내일이 휴강(    ) 들었어요.',o:['이라고','라고','이다고','인다고'],x:['','n2','n5','n5'],
  w:'Danh từ → N(이)라고. 휴강 có 받침 ㅇ → 이라고. Không nói 이다고.'},
 {id:'a5',t:'c',g:2,n:'np',q:'너무 피곤해요. 오늘은 일찍 (    ).',o:['자야겠어요','잔대요','잔다고 들었어요','자야겠대요'],x:['','np','np','np'],
  w:'Người nói tự thấy mệt rồi quyết định → -아야겠어요. 잔대요 / 잔다고 들었어요 / 자야겠대요 là kể lại lời người khác.'},
 {id:'a6',t:'y',g:1,n:'n3',q:'할머니: “작년 겨울은 아주 추웠어.” → 할머니께서 작년 겨울이 아주 (    ) 하셨어요.',a:['추웠다고'],
  e:{'춥었다고':'Bất quy tắc ㅂ: ㅂ + 었 → 웠: 추웠다고.','추었다고':'ㅂ đổi thành 우 rồi gộp với 었 → 웠: 추웠다고.','춥다고':'Câu nói về năm ngoái → quá khứ: 추웠다고.','추운다고':'Tính từ không thêm -ㄴ-; năm ngoái → quá khứ: 추웠다고.'},
  w:'춥다 (bất quy tắc ㅂ) + 었 → 추웠 + 다고 → 추웠다고.'},
 {id:'a7',t:'c',g:4,n:'n1',q:'가: 수미 씨가 뭐래요?<br>나: 오늘 아파서 학교에 못 (    ).',o:['온대요','온데요','오대요','오는대요'],x:['','np','n1','n2'],
  w:'오다 (động từ, không 받침) → 온다 → 온대요. Kể lại lời người khác viết -대요 (ㅐ), -데요 (ㅔ) là nghĩa khác.'},
 {id:'a8',t:'d',g:3,n:'n1',vi:'Tôi nghe nói lễ hội của trường mình rất vui.',
  a:['우리 학교 축제가 아주 재미있다고 들었어요.','우리 학교 축제가 정말 재미있다고 들었어요.','우리 학교 축제가 재미있다고 들었어요.','우리 학교 축제가 아주 재미있대요.','우리 학교 축제가 정말 재미있대요.'],
  w:'재미있다 thuộc nhóm 있다/없다 → giữ nguyên + 다고 (không viết 재미있는다고). “Tôi nghe nói” → -다고 들었어요.'},
 {id:'a9',t:'c',g:1,n:'n4',q:'선배가 다음 주에 신입생 환영회를 (    ). <span class="note">(việc chưa xảy ra)</span>',o:['할 거라고 했어요','할 거다고 했어요','한 거라고 했어요','했다고 할 거예요'],x:['','n5','n4','n4'],
  w:'Tương lai: 할 거예요 → 할 거라고 했어요 (거 + 이다 → 거라고). 한 거 là quá khứ.'},
 {id:'a10',t:'y',g:1,n:'n5',q:'민수: “제 전공은 경영학이에요.” → 민수 씨는 자기 전공이 경영학(    ) 했어요.',a:['이라고'],
  e:{'라고':'경영학 có 받침 ㄱ → 이라고.','이다고':'Danh từ không nói 이다고 → (이)라고.'},w:'Danh từ có 받침 → 이라고 하다.'},
 {id:'a11',t:'c',g:2,n:'n3',q:'발음이 안 좋아서 매일 한국어 뉴스를 (    ).',o:['들어야겠어요','듣어야겠어요','들야겠어요','듣는다고 들었어요'],x:['','n3','n3','np'],
  w:'듣다 (bất quy tắc ㄷ) + 어 → 들어 → 들어야겠어요. Đây là quyết định của mình, không phải kể lại.'},
 {id:'a12',t:'d',g:4,n:'n4',vi:'(Nói với bạn) Nghe nói Thủy vào câu lạc bộ nhảy rồi đấy.',
  a:['투이 씨가 춤 동아리에 가입했대요.','투이 씨는 춤 동아리에 가입했대요.','투이가 춤 동아리에 가입했대요.','투이 씨가 춤 동아리에 가입했다고 해요.','투이 씨가 춤 동아리에 가입했다고 들었어요.'],
  w:'Việc đã xảy ra → quá khứ: 가입했 + 대요 → 가입했대요. Nhớ tiểu từ: 동아리에 가입하다 (không dùng 을/를).'},
 {id:'a13',t:'c',g:1,n:'n6',q:'교수님께서 다음 주에 시험이 (    ).',o:['있다고 하셨어요','있는다고 하셨어요','있다고 했어요','있으시다고 했어요'],x:['','n1','n6','n6'],
  w:'있다 giữ nguyên + 다고. Chủ ngữ là 교수님께서 → kính ngữ ở động từ nói: 하셨어요.'},
 {id:'a14',t:'y',g:4,n:'n1',q:'친구: “그 식당 음식이 정말 맛있어요.” → 친구가 그러는데 그 식당 음식이 정말 (    ).',a:['맛있대요','맛있다고 해요'],
  e:{'맛있는대요':'맛있다 thuộc nhóm 있다 → giữ nguyên + 대요.','맛있데요':'Kể lại lời người khác viết ㅐ: 맛있대요.','맛있는데요':'Đây là -는데요 (nói lửng), không phải kể lại.'},w:'맛있다 + 대요 → 맛있대요.'},
 {id:'a15',t:'c',g:3,n:'tv',q:'친구(    ) 그 강의가 어렵다고 들었어요.',o:['한테서','를','께서','에'],x:['','tv','n6','tv'],
  w:'Nghe từ ai → N한테서 / N에게서 (들었어요). 께서 là chủ ngữ kính ngữ, không dùng cho bạn.'},
 {id:'a16',t:'d',g:1,n:'n2',vi:'Đàn anh nói là anh ấy không ăn thịt.',
  a:['선배가 고기를 안 먹는다고 했어요.','선배는 고기를 안 먹는다고 했어요.','선배가 고기를 먹지 않는다고 했어요.','선배는 고기를 먹지 않는다고 했어요.','선배가 고기를 안 먹는대요.'],
  w:'먹다 là động từ có 받침 → -는다고: 먹는다고 했어요 (không viết 먹다고 / 먹은다고).'},
 {id:'a17',t:'y',g:2,n:'n2',q:'모르는 단어가 너무 많네. 오늘은 사전을 찾(    ).',a:['아야겠어요','아봐야겠어요'],

var KEY='nari-3akt';
var S=load();
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function b64e(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64d(r){var b=String(r).replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';return JSON.parse(decodeURIComponent(escape(atob(b))))}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function hash(s){var h=7;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%233280;return h}
function order(n,seed){var r=[],x=seed||7;for(var i=0;i<n;i++)r.push(i);for(i=n-1;i>0;i--){x=(x*9301+49297)%233280;var j=Math.floor(x/233280*(i+1));var t=r[i];r[i]=r[j];r[j]=t}return r}
function norm(s){return String(s||'').normalize('NFC').replace(/[\s.,!?~“”"'’‘·…()]/g,'')}
var SEC={c:['Phần 1 · Chọn đáp án đúng',''],y:['Phần 2 · Gõ đáp án','Gõ phần còn thiếu vào ô trống.'],d:['Phần 3 · Dịch Việt → Hàn','Viết cả câu tiếng Hàn.']};
function qs(D){var o={c:0,y:1,d:2};return D.q.map(function(q,i){return [q,i]}).sort(function(a,b){return o[a[0].t]-o[b[0].t]||a[1]-b[1]}).map(function(x){return x[0]})}
function secHead(q,prev){if(prev&&prev.t===q.t)return '';var x=SEC[q.t];return '<h2>'+x[0]+'</h2>'+(x[1]?'<p class="note">'+x[1]+'</p>':'')}
function bai(){var m=location.hash.match(/[#&]b=(\w+)/);return m&&K[m[1]]?m[1]:'1'}
function st(b){S[b]=S[b]||{a:{},u:{},s:{}};return S[b]}

/* ===== Chấm ===== */
function grade(q,v,self){ // → {ok: true|false|null (chưa tự chấm), tag}
  if(v==null||v==='')return {ok:false,tag:q.n,blank:1};
  if(q.t==='c')return {ok:v===0,tag:v===0?'':(q.x&&q.x[v])||q.n};
  var hit=q.a.some(function(a){return norm(a)===norm(v)});
  if(q.t==='y')return {ok:hit,tag:hit?'':q.n};
  if(hit)return {ok:true,tag:'',auto:1};
  if(self===1)return {ok:true,tag:''};
  if(self===0)return {ok:false,tag:q.n};
  return {ok:null,tag:''};
}
function wrongNote(q,v){
  if(q.t==='y'&&q.e){var k=norm(v);for(var w in q.e)if(norm(w)===k)return q.e[w]}
  return '';
}
function ansText(q,v){if(v==null||v==='')return '(bỏ trống)';return q.t==='c'?q.o[v]:v}

  var v=R.a[q.id],h='<div class="card" id="c_'+q.id+'"><div class="qn"><span>Câu '+(i+1)+' · '+(q.t==='c'?'Chọn':q.t==='y'?'Gõ đáp án':'Dịch Việt → Hàn')+'</span></div>';

    else prompt('Em chép link này gửi cô:',text);
  };
  $('#see').onclick=function(){renderReport({b:b,n:S.n,a:R.a,u:Object.keys(R.u),s:R.s,d:R.done},false);scrollTo(0,0)};
  $('#redo').onclick=function(){if(confirm('Xóa bài đã làm và làm lại từ đầu?')){S[b]={a:{},u:{},s:{}};save();renderTest();scrollTo(0,0)}};
}

/* ===== Báo cáo (cô mở link #r=, hoặc em bấm “Xem bảng kết quả”) ===== */
function renderReport(P,teacher){
  var D=K[P.b]||K['1'],u={};(P.u||[]).forEach(function(id){u[id]=1});P.s=P.s||{};P.a=P.a||{};
  $('#h1').innerHTML='Kết quả · '+esc(P.n||'Học viên')+'<small class="ko">Seoul 3A '+esc(D.t)+'</small>';
  var tot=0,ok=0,pend=0,gs=D.g.map(function(){return {n:0,ok:0}}),mix={n:0,ok:0},tags={},guess=[],sure=[],L=[];
  qs(D).forEach(function(q,i){
    var v=P.a[q.id],G=grade(q,v,P.s[q.id]);tot++;
    if(G.ok===null){pend++}else if(G.ok)ok++;
    var g=q.g?gs[q.g-1]:mix;g.n++;if(G.ok)g.ok++;
    if(G.ok===false){tags[G.tag]=(tags[G.tag]||0)+1;if(!u[q.id]&&!G.blank)sure.push(i+1)}
    if(G.ok===true&&u[q.id])guess.push(i+1);
    L.push({q:q,i:i,v:v,G:G});
  });
  var h='<div class="tiles"><div class="tile"><b>'+ok+'/'+tot+'</b><span>câu đúng'+(pend?' ('+pend+' câu dịch cô chấm)':'')+'</span></div>'+
        '<div class="tile"><b>'+guess.length+'</b><span>đúng nhưng em không chắc</span></div><div class="tile"><b>'+sure.length+'</b><span>sai mà em tưởng chắc</span></div></div>';
  h+='<h2>Theo từng ngữ pháp</h2><table class="t"><tr><th>Ngữ pháp</th><th>Đúng</th><th style="width:30%"></th></tr>';
  D.g.forEach(function(g,k){h+=row('<span class="ko">'+esc(g)+'</span>',gs[k])});
  h+=row('Trộn (chọn đúng mẫu)',mix)+'</table>';
  var tk=Object.keys(tags).sort(function(a,b){return tags[b]-tags[a]});
  h+='<h2>Lỗi quy về viên gạch nào</h2>';
  if(!tk.length)h+='<div class="good">Không có lỗi nào'+(pend?' (trừ câu dịch chưa chấm)':'')+'.</div>';
  else{
    h+='<table class="t"><tr><th>Viên gạch</th><th>Số lỗi</th><th>Ôn lại ở đâu</th></tr>';
    tk.forEach(function(t){h+='<tr><td>'+esc(NAME[t]||t)+'</td><td class="n">'+tags[t]+'</td><td class="note">'+esc(GATE[t]||'')+'</td></tr>'});
    h+='</table>';
    var need=tk.filter(function(t){return tags[t]>=2&&t!=='np'&&t!=='tv'});
    if(need.length)h+='<div class="weak"><b>Cần vá nền:</b> '+need.map(function(t){return esc(NAME[t])}).join(', ')+' (sai từ 2 câu trở lên).</div>';
    if(tags.np>=2)h+='<div class="weak"><b>Chưa phân biệt được các mẫu của bài</b> → buổi tới cô dạy lại phần nghĩa / tình huống dùng.</div>';
  }
  if(sure.length)h+='<p class="note">Sai mà em tưởng chắc (hiểu sai, cần sửa trước): câu '+sure.join(', ')+'. Đúng nhưng không chắc (cần luyện thêm): '+(guess.length?'câu '+guess.join(', '):'không có')+'.</p>';
  h+='<h2>Từng câu</h2><table class="t"><tr><th>#</th><th>Em làm</th><th>Kết quả</th></tr>';
  L.forEach(function(r){
    var q=r.q,res=r.G.ok===true?'✔':r.G.ok===false?'✘':'<b style="color:var(--warn)">cô chấm</b>';
    var cell='<span class="ko">'+esc(ansText(q,r.v))+'</span>';
    if(q.t==='d')cell='<div class="note">'+esc(q.vi)+'</div>'+cell+(r.G.ok!==true?'<div class="note ko">Mẫu: '+esc(q.a[0])+'</div>':'');
    else if(r.G.ok===false)cell+='<div class="note ko">Đúng: '+(q.t==='c'?q.o[0]:esc(q.a[0]))+'</div>';
    h+='<tr><td class="n">'+(r.i+1)+'</td><td>'+cell+'</td><td class="n">'+res+(u[q.id]?' <span class="note">(không chắc)</span>':'')+(r.G.ok===false&&r.G.tag?'<div class="note">'+esc(NAME[r.G.tag]||'')+'</div>':'')+'</td></tr>';
  });
  h+='</table>';
  if(P.d)h+='<p class="note">Nộp lúc '+new Date(P.d).toLocaleString('vi-VN')+'.</p>';
  h+='<div class="share noprint">'+(teacher?'<button class="btn ghost" onclick="print()">In / lưu PDF</button>':'<button class="btn ghost" id="back">‹ Xem lại bài làm</button>')+'</div>';
  $('#app').innerHTML=h;
  if(!teacher)$('#back').onclick=function(){renderDone();scrollTo(0,0)};
}
function row(lbl,s){var p=s.n?Math.round(s.ok/s.n*100):0;return '<tr><td>'+lbl+'</td><td class="n">'+s.ok+'/'+s.n+'</td><td><div class="bar2"><i style="width:'+p+'%"></i></div></td></tr>'}

/* ===== Cô kiểm tra trên lớp (chỉ hiện khi link có ?co) ===== */
function renderCo(){
  var b=bai(),D=K[b];S.co=S.co||{};var M=S.co[b]=S.co[b]||{};
  $('#h1').innerHTML='Cô kiểm tra trên lớp<small class="ko">'+esc(D.t)+'</small>';
  var h=navHTML('lop');
  h+='<ul class="intro"><li>Mỗi ngữ pháp: cô hỏi miệng, em trả lời không nhìn sách, rồi dịch nói Việt → Hàn.</li><li>Bấm <b>Đáp án</b> để xem; em nói sai thì bấm <b>✘</b>. Cuối trang tự gom lỗi theo viên gạch (lưu trên máy cô, “↺ Làm mới” để xóa).</li></ul>';
  D.co.forEach(function(G,gi){
    h+='<div class="gc"><div class="hd ko">'+esc(G.g)+'</div><div class="bd"><p class="note">'+esc(G.lead)+'</p>';
    G.q.forEach(function(x,k){h+=oq('q'+gi+'_'+k,x,M)});
    h+='<h3>Dịch nói Việt → Hàn</h3>';
    G.vn.forEach(function(x,k){h+=oq('v'+gi+'_'+k,x,M)});
    h+='<div class="ear"><b>Lỗi cần nghe:</b> <span class="ko">'+esc(G.ear)+'</span></div></div></div>';
  });
  h+='<h2>Lỗi trong buổi</h2><div id="cosum"></div><div class="share noprint"><button class="btn ghost" id="coclr">Xóa đánh dấu (học sinh khác)</button></div>';
  $('#app').innerHTML=h;
  document.querySelectorAll('.oq [data-sh]').forEach(function(el){el.onclick=function(){el.closest('.oq').classList.toggle('show')}});
  document.querySelectorAll('.oq [data-x]').forEach(function(el){el.onclick=function(){
    var id=el.dataset.x;if(M[id])delete M[id];else M[id]=1;save();el.closest('.oq').classList.toggle('miss',!!M[id]);coSum();
  }});
  $('#coclr').onclick=function(){S.co[b]={};save();renderCo()};
  coSum();
}
function oq(id,x,M){
  return '<div class="oq'+(M[id]?' miss':'')+'"><div class="tx"><span class="ko">'+esc(x[0])+'</span><div class="a ko">'+esc(x[1])+'</div><div class="tg">'+esc(NAME[x[2]]||'')+'</div></div>'+
    '<button class="btn sm ghost" data-sh>Đáp án</button><button class="btn sm ghost" data-x="'+id+'" title="Em nói sai">✘</button></div>';
}
function coSum(){
  var b=bai(),D=K[b],M=S.co[b]||{},T={},G=[];
  D.co.forEach(function(g,gi){var n=0;[['q',g.q],['v',g.vn]].forEach(function(p){p[1].forEach(function(x,k){if(M[p[0]+gi+'_'+k]){n++;T[x[2]]=(T[x[2]]||0)+1}})});if(n)G.push(g.g+': '+n)});
  var k=Object.keys(T).sort(function(a,c){return T[c]-T[a]});
  $('#cosum').innerHTML=k.length?'<p class="ko">'+esc(G.join(' · '))+'</p><table class="t"><tr><th>Viên gạch</th><th>Lỗi</th><th>Vá ở đâu</th></tr>'+
    k.map(function(t){return '<tr><td>'+esc(NAME[t])+'</td><td class="n">'+T[t]+'</td><td class="note">'+esc(GATE[t])+'</td></tr>'}).join('')+'</table>':'<p class="note">Chưa đánh dấu lỗi nào.</p>';
}

/* ===== Khởi động ===== */
function boot(){
  var m=location.hash.match(/#r=([\w-]+)/);
  if(m){try{var P=b64d(m[1]);document.title='Kết quả · '+(P.n||'');renderReport(P,true);return}catch(e){}}
  if(CO&&/[#&]k=lop/.test(location.hash)){renderCo();return}
  var R=st(bai());if(R.done)renderDone();else renderTest();
}
window.addEventListener('hashchange',function(){boot();scrollTo(0,0)});
boot();
</script>
