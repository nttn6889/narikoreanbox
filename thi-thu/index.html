<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phòng thi thử TOPIK II · Nari TOPIK</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1b2a5c">
<link rel="icon" type="image/png" href="icon/favicon-64.png">
<link rel="apple-touch-icon" href="icon/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nari TOPIK">
<meta property="og:title" content="Phòng thi thử TOPIK II · Nari TOPIK">
<meta property="og:description" content="Bài cô Ngân giao: đề thi thử, từ vựng, luyện nghe, luyện viết.">
<meta property="og:image" content="https://hoc.naritopik.com/logo/nari-topik-logo-nen-trang.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style id="css">
:root{
  --bg:#EEF0F6; --paper:#FFFFFF; --ink:#1D1A2C; --muted:#646079; --line:#D9D6E6;
  --violet:#54478F; --violet-soft:#ECE9F7; --on-violet:#FFFFFF; --pen:#C4323A; --pen-soft:#FBE7E8;
  --ok:#1F7A4D; --ok-soft:#E3F3EA; --warn:#9A6200; --warn-soft:#FDF1DC; --nm-bg:91%; --nm-fg:27%; --nm-bd:75%;
  --kr:"Noto Serif KR","Apple SD Gothic Neo","Malgun Gothic",serif;
  --ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15131F; --paper:#1F1C2C; --ink:#ECEAF5; --muted:#A7A2BE; --line:#37334A;
    --violet:#A99BEA; --violet-soft:#2C2745; --on-violet:#15131F; --pen:#F07077; --pen-soft:#3A1E24;
    --ok:#5FCB94; --ok-soft:#1C3328; --warn:#F0B454; --warn-soft:#382A12; --nm-bg:24%; --nm-fg:86%; --nm-bd:45%;
  }
}
:root[data-theme="dark"]{
  --bg:#15131F; --paper:#1F1C2C; --ink:#ECEAF5; --muted:#A7A2BE; --line:#37334A;
  --violet:#A99BEA; --violet-soft:#2C2745; --on-violet:#15131F; --pen:#F07077; --pen-soft:#3A1E24;
  --ok:#5FCB94; --ok-soft:#1C3328; --warn:#F0B454; --warn-soft:#382A12; --nm-bg:24%; --nm-fg:86%; --nm-bd:45%;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 12px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.6}
img{max-width:100%;height:auto}
[hidden]{display:none!important}
.wrap{max-width:820px;margin:0 auto;padding:0 14px 150px}
.wrap.admin{max-width:1000px;padding-bottom:60px}

/* header strip */
.topnote{font-size:11.5px;color:var(--muted);text-align:center;padding:8px 10px 0;font-style:italic}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0 12px;border-bottom:1px solid var(--line);margin-bottom:18px}
.brand .bn{font-weight:700;font-size:18px;color:var(--violet);letter-spacing:.01em}
.brand .bn svg{display:block;height:50px;width:auto;margin-left:-4px;border-radius:8px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand .bn svg{background:#EFEAF8;padding:3px 8px;margin-left:0}}
:root[data-theme="dark"] .brand .bn svg{background:#EFEAF8;padding:3px 8px;margin-left:0}
.brand .bs{font-size:13px;color:var(--muted)}
.about{flex:none;width:54px;height:54px;border-radius:50%;background:var(--violet);color:var(--on-violet);display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;line-height:1.05}
.about b{font-size:18px}
.about span{font-size:10.5px;font-weight:600}
.about:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

.paper{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:24px 20px}
@media (min-width:640px){.paper{padding:32px 40px}}
.title{text-align:center;border-top:2px solid var(--violet);border-bottom:2px solid var(--violet);padding:12px 0 10px;margin-bottom:20px}
.title h1{font-family:var(--kr);font-size:clamp(26px,5.6vw,36px);color:var(--violet);margin:0}
.title p{margin:2px 0 0;color:var(--muted);font-size:14px}

label.l{display:block;font-weight:600;font-size:14.5px;margin:12px 0 5px}
input.t,select.t,textarea.t{font:inherit;font-size:15px;padding:9px 11px;border:1.5px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);width:100%}
textarea.t{min-height:90px;resize:vertical;line-height:1.5}
textarea.kr,input.kr{font-family:var(--kr)}
input.t:focus,select.t:focus,textarea.t:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 3px var(--violet-soft)}
input.code{text-transform:uppercase;letter-spacing:.18em;font-weight:700;font-size:20px;text-align:center}
.hint{font-size:13px;color:var(--muted);margin:4px 0 0}
.err{color:var(--pen);font-size:14px;font-weight:600;margin:8px 0 0}
.okmsg{color:var(--ok);font-size:14px;font-weight:600;margin:8px 0 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.grid2{display:grid;gap:0 14px}
@media (min-width:600px){.grid2{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:2fr 1fr 1fr}}

.btn{all:unset;box-sizing:border-box;cursor:pointer;background:var(--violet);color:var(--on-violet);font-weight:600;padding:10px 16px;border-radius:6px;text-align:center;font-size:15px;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:focus-visible,.lnk:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.btn.ghost{background:transparent;color:var(--violet);border:1.5px solid var(--violet)}
.btn.sm{padding:5px 10px;font-size:13.5px}
.btn.danger{background:transparent;color:var(--pen);border:1.5px solid var(--pen)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.wide{display:block;width:100%}
.lnk{all:unset;cursor:pointer;color:var(--violet);text-decoration:underline;font-size:14px}

/* exam content */
.grp{margin:28px 0 6px;font-family:var(--kr);font-weight:600;font-size:15.5px}
.grp .tag{display:inline-block;background:var(--violet);color:var(--on-violet);font-family:var(--ui);font-weight:700;font-size:12.5px;padding:0 8px;border-radius:4px;margin-right:8px;vertical-align:2px}
.q{padding:14px 0 18px;border-bottom:1px dashed var(--line)}
.stem{font-family:var(--kr);font-size:17px;margin:0 0 10px;display:flex;gap:10px}
.stem b{color:var(--violet);min-width:1.6em;flex:none}
.qaudio{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 10px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--violet-soft)}
.qaudio span{font-weight:600;font-size:14px;color:var(--violet)}
.qaudio audio{flex:1;min-width:220px;height:36px}
.passage{margin:4px 0 12px;border:1px solid var(--line);border-radius:6px;padding:12px;background:var(--paper)}
.passage img{display:block;margin:0 auto;border-radius:4px;background:#fff}
.ptext{font-family:var(--kr);font-size:16px;line-height:1.85;white-space:normal}
.passage img + .ptext{margin-top:10px}
.blank{white-space:nowrap}.blank .gap{display:inline-block;width:3.2em}
.ul{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1.5px}
.opts{display:grid;grid-template-columns:1fr;gap:7px}
@media (min-width:560px){.opts.two{grid-template-columns:1fr 1fr}}
.opt{all:unset;box-sizing:border-box;display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border:1.5px solid var(--line);border-radius:6px;cursor:pointer;font-family:var(--kr);font-size:15.5px;background:var(--paper)}
.opt:hover{border-color:var(--violet)}
.opt:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
.opt .num{font-family:var(--ui);flex:none;width:23px;height:23px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:12.5px;font-weight:600;color:var(--muted);margin-top:2px}
.opt[aria-checked="true"]{border-color:var(--violet);background:var(--violet-soft)}
.opt[aria-checked="true"] .num{background:var(--violet);border-color:var(--violet);color:var(--on-violet)}
.locked .opt{cursor:default}
.opt.key{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.opt.key .num{border-color:var(--ok);color:var(--ok)}
.opt.key[aria-checked="true"] .num{background:var(--ok);color:#fff}

/* answer strip */
.strip{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.strip .in{max-width:820px;margin:0 auto;display:flex;gap:10px;align-items:center}
.cells{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;padding-bottom:2px}
.cell{all:unset;box-sizing:border-box;flex:none;width:38px;text-align:center;border:1px solid var(--line);border-radius:4px;padding:2px 0;cursor:pointer;line-height:1.2}
.cell small{display:block;color:var(--muted);font-size:10.5px}
.cell b{display:block;font-size:14px;color:var(--violet);min-height:17px}
.cell.done{background:var(--violet-soft);border-color:var(--violet)}
.cell:focus-visible{outline:2px solid var(--violet)}
.clock{font-size:12px;color:var(--muted);text-align:center;flex:none}
.metaline{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;font-size:14px;color:var(--muted);margin-top:-8px;margin-bottom:10px}
.metaline strong{color:var(--ink)}

.panel{margin-top:22px;border:2px solid var(--violet);border-radius:8px;padding:18px;background:var(--violet-soft)}
.panel h2{margin:0 0 6px;font-size:19px}
.panel p{margin:0 0 10px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(20,18,32,.55);display:flex;align-items:flex-start;justify-content:center;padding:6vh 14px 20px;z-index:50;overflow-y:auto}
.mbox{background:var(--paper);color:var(--ink);border-radius:10px;padding:20px;max-width:440px;width:100%;border:2px solid var(--violet)}
.mbox.wide{max-width:760px}
.mbox h3{margin:0 0 10px;font-size:18px}
.mbox p{margin:0 0 12px}
.busy{position:fixed;inset:0;background:rgba(20,18,32,.55);display:grid;place-items:center;z-index:60;color:#fff;font-weight:600;font-size:17px}

/* admin */
.adminbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;border-bottom:2px solid var(--violet);padding-bottom:10px;align-items:center}
.tab{all:unset;cursor:pointer;padding:8px 14px;border-radius:6px 6px 0 0;font-weight:600;font-size:15px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--violet);color:var(--on-violet)}
.tab:focus-visible{outline:3px solid var(--violet)}
.adminbar .sp{flex:1}
.card{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:16px}
.card h2{margin:0 0 4px;font-size:18px}
.card h2 + .hint{margin-bottom:6px}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th,.tbl td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--violet-soft)}
.scroll{overflow-x:auto}
.codebadge{font-weight:700;letter-spacing:.12em;color:var(--violet);font-size:15px}
.pill{display:inline-block;padding:0 8px;border-radius:10px;font-size:12.5px;font-weight:600;background:var(--violet-soft);color:var(--violet);margin:1px 3px 1px 0}
.pill.bad{background:var(--pen-soft);color:var(--pen)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.good{background:var(--ok-soft);color:var(--ok)}
.score{font-family:var(--kr);font-weight:700;color:var(--pen);font-size:40px;line-height:1}
.score small{font-size:18px;color:var(--muted)}
.dhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--pen);padding-bottom:10px;margin-bottom:12px;align-items:flex-end}
.dhead .meta{font-size:14px;color:var(--muted)}
.dhead .meta strong{color:var(--ink);font-size:17px}
.gq{padding:10px 12px;border-radius:6px;margin-bottom:8px;border-left:4px solid var(--ok);background:var(--ok-soft);font-size:14.5px}
.gq.wrong{border-left-color:var(--pen);background:var(--pen-soft)}
.gq.nokey{border-left-color:var(--warn);background:var(--warn-soft)}
.gq .l1{font-weight:600;display:flex;gap:6px 14px;flex-wrap:wrap}
.gq .k{font-family:var(--kr);font-weight:500}
.gq .ex{margin-top:3px}
.stu{display:grid;gap:10px}
@media (min-width:640px){.stu{grid-template-columns:1fr 1fr}}
.stu .card{margin:0;padding:14px}
.stu h3{margin:0 0 2px;font-size:16px}

.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:5px;margin:10px 0}
.qn{all:unset;box-sizing:border-box;text-align:center;padding:6px 0;border-radius:5px;border:1.5px solid var(--line);cursor:pointer;font-weight:600;font-size:14px;color:var(--muted)}
.qn.part{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.qn.full{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.qn.cur{outline:3px solid var(--violet);outline-offset:1px}
.qn:focus-visible{outline:3px solid var(--ink)}
.legend{font-size:13px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1.5px solid var(--line)}
.legend .a::before{border-color:var(--warn);background:var(--warn-soft)}
.legend .b::before{border-color:var(--ok);background:var(--ok-soft)}
.editor{display:grid;gap:18px}
@media (min-width:900px){.editor{grid-template-columns:1fr 1fr}}
.prev{border:1px dashed var(--line);border-radius:8px;padding:10px 14px;background:var(--bg)}
.prev .q{border-bottom:none}
.imgbox{border:1.5px dashed var(--line);border-radius:6px;padding:10px;text-align:center;font-size:13.5px;color:var(--muted)}
.imgbox img{max-height:220px;display:block;margin:0 auto 8px}
.ansr{display:flex;gap:6px}
.ansr button{all:unset;cursor:pointer;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700}
.ansr button[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.ansr button:focus-visible{outline:3px solid var(--violet)}
.optrow{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.optrow span{flex:none;width:22px;font-weight:700;color:var(--muted)}
.check{display:flex;gap:8px;align-items:center;font-size:14.5px;margin-top:10px}
.flash{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok);border-radius:6px;padding:10px 14px;font-weight:600;margin-bottom:14px}
.previewbar{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:8px 12px;font-size:14px;font-weight:600;margin-bottom:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.muted{color:var(--muted)}
.kq-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:6px 0 14px}
.kq-sum div{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg)}
.kq-sum b{display:block;font-size:22px;color:var(--violet);line-height:1.2}
.kq-sum span{font-size:13px;color:var(--muted)}
.chart{width:100%;max-width:640px;height:auto;display:block;margin:4px 0 10px}
.chart .ax{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--violet);stroke-width:2.5}
.chart .dt{fill:var(--paper);stroke:var(--violet);stroke-width:2.5}
.chart text{fill:var(--muted);font-size:13px;font-family:var(--ui)}
.note{white-space:pre-wrap;border-left:4px solid var(--violet);background:var(--violet-soft);padding:10px 14px;border-radius:6px;margin:6px 0 14px}
.bt-ok td:first-child{border-left:4px solid var(--ok)}
.bt-dup td:first-child{border-left:4px solid var(--warn)}
.bt-err td:first-child{border-left:4px solid var(--pen)}
.stu .card .row{margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:16px;padding:3px 6px 3px 12px;font-size:14px;background:var(--paper)}
.chip a{color:var(--violet);font-weight:600;text-decoration:none}
.chip a:hover{text-decoration:underline}
.chip button{all:unset;cursor:pointer;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--muted);font-size:15px}
.chip button:hover{background:var(--pen-soft);color:var(--pen)}
.chip button:focus-visible{outline:2px solid var(--violet)}
.asg{border:1px solid var(--line);border-left:4px solid var(--violet);border-radius:6px;padding:10px 12px;margin:8px 0;font-size:14.5px}
.asg .l1{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center}
.asg .st{margin-top:4px;color:var(--muted);font-size:13.5px}
.saved{font-size:13px;color:var(--muted)}
.saved.dirty{color:var(--warn)}
.sub{font-size:15.5px;margin:18px 0 4px;padding-top:12px;border-top:1px solid var(--line)}
.sub:first-child{border-top:none;padding-top:0;margin-top:0}
.lkgrid{display:grid;gap:10px}
@media (min-width:640px){.lkgrid{grid-template-columns:1fr 1fr}}
.lk{border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.lk h3{margin:0;font-size:15.5px}
.lk .u{font-size:12.5px;color:var(--muted);word-break:break-all;margin:2px 0 8px}
.tbl tr.cur td{background:var(--violet-soft)}
.wk{width:100%;border-collapse:collapse;font-size:14px;min-width:620px}
.wk th,.wk td{border:1px solid var(--line);padding:6px;text-align:center;vertical-align:top}
.wk th{background:var(--bg);font-size:13px;color:var(--muted)}
.wk td.sl{font-weight:600;text-align:left;white-space:nowrap;background:var(--bg)}
.wk .nm{display:block;background:var(--violet-soft);color:var(--violet);border-radius:4px;padding:1px 4px;margin:2px 0;font-weight:600;font-size:13px}
.wk td.clash{background:var(--pen-soft)}
.wk td.clash .nm{background:var(--pen);color:#fff}
.wk td.wkg{background:var(--bg)}
.wk .nm.hc{background:hsl(var(--h) 60% var(--nm-bg));color:hsl(var(--h) 55% var(--nm-fg));border-left:4px solid hsl(var(--h) 55% var(--nm-bd))}
.wk td.clash .nm.hc{background:var(--pen);color:#fff;border-left-color:var(--pen)}
.hsv{display:flex;gap:8px;margin:0 0 12px}
.lhhero{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:24px 24px 18px;margin-bottom:14px}
.lhh{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:20px;align-items:start}
.lhey{font-size:14px;color:var(--muted);margin:0}
.lhname{font-family:"Fraunces",Georgia,serif;font-weight:700;font-size:clamp(30px,5vw,44px);line-height:1.1;color:var(--violet);margin:2px 0 14px;letter-spacing:-.01em;text-wrap:balance}
.lhchips{display:flex;flex-wrap:wrap;gap:8px}.lhchips span{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 12px;font-size:14px;color:var(--muted)}.lhchips b{color:var(--ink)}
.lhcd{border:1px solid var(--line);border-top:4px solid var(--pen);border-radius:10px;text-align:center;padding:12px 10px 10px;background:var(--bg)}
.lhcd .t{font-size:13.5px;font-weight:600;color:var(--muted)}.lhcd .n{font-family:"Fraunces",Georgia,serif;font-weight:700;font-size:58px;line-height:1.05;color:var(--pen);font-variant-numeric:tabular-nums}

/* ---------- modal helpers (no alert/confirm: blocked in the viewer) ---------- */
function modal(html, wide){
  var m = document.createElement("div");
  m.className = "modal";
  m.innerHTML = '<div class="mbox' + (wide ? " wide" : "") + '" role="dialog" aria-modal="true">' + html + '</div>';
  document.body.appendChild(m);
  var api = { el: m, onclose: null, close: function(){ if(m.parentNode){ m.remove(); if(api.onclose) api.onclose(); } } };
  m.addEventListener("click", function(e){ if(e.target === m || e.target.closest("[data-close]")) api.close(); });
  setTimeout(function(){ var b = m.querySelector(".mbox"); if(b) b.scrollIntoView({block:"start"}); var f = m.querySelector("[data-focus]") || m.querySelector("button"); if(f) f.focus({preventScroll:true}); }, 20);
  return api;
}

    md.onclose = function(){ if(!done){ done = true; res(false); } };
    md.el.querySelector("[data-y]").onclick = function(){ done = true; md.close(); res(true); };

}

function copyText(text, statusEl){

  document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
  var ok = false; try{ ok = document.execCommand("copy"); }catch(e){}
  ta.remove();

  if(ok){ report(true); return; }
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(function(){ report(true); }, function(){ report(false); }); }
  else report(false);
}

}

/* ---------- code encoding ---------- */
function sum(str){ var h = 7; for(var i = 0; i < str.length; i++) h = (h*31 + str.charCodeAt(i)) % 1679616; return h.toString(36).padStart(4,"0"); }
function encode(obj){
  var raw = btoa(unescape(encodeURIComponent(JSON.stringify(obj)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  return "NT2-" + raw + "-" + sum(raw);
}
function decode(code){
  var m = String(code).match(/^NT2-([A-Za-z0-9_-]+)-([0-9a-z]{4})$/);
  if(!m || sum(m[1]) !== m[2]) return null;
  try{
    var b = m[1].replace(/-/g,"+").replace(/_/g,"/"); while(b.length % 4) b += "=";
    var o = JSON.parse(decodeURIComponent(escape(atob(b))));
    o._sum = m[2];
    return o;
  }catch(e){ return null; }
}
function findCode(text){ var m = String(text).match(/NT2-[A-Za-z0-9_-]+-[0-9a-z]{4}/); return m ? m[0] : null; }
/* Find every code with a given prefix in pasted text. The payload itself may contain "-",
   so for each occurrence we test candidate split points from the longest down and keep the
   first one whose checksum matches. Returns {codes:[...], bad:n}. */
function findAllCodes(text, prefix){
  var parts = String(text).split(prefix).slice(1), codes = [], bad = 0;
  parts.forEach(function(part){
    var m = part.match(/^[A-Za-z0-9_-]+/); if(!m){ bad++; return; }
    var t = m[0], hit = null;
    for(var i = t.length - 5; i >= 1; i--){
      if(t.charAt(i) !== "-") continue;
      var raw = t.slice(0, i), sm = t.slice(i+1, i+5);
      if(/^[0-9a-z]{4}$/.test(sm) && sum(raw) === sm){ hit = prefix + raw + "-" + sm; break; }
    }
    if(!hit){ bad++; return; }
    if(codes.indexOf(hit) < 0) codes.push(hit);
  });
  return {codes:codes, bad:bad};
}
function encodeP(obj){
  var raw = btoa(unescape(encodeURIComponent(JSON.stringify(obj)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  return "NP1-" + raw + "-" + sum(raw);
}
function decodeP(code){
  var m = String(code).match(/^NP1-([A-Za-z0-9_-]+)-([0-9a-z]{4})$/);
  if(!m || sum(m[1]) !== m[2]) return null;
  try{
    var b = m[1].replace(/-/g,"+").replace(/_/g,"/"); while(b.length % 4) b += "=";
    return JSON.parse(decodeURIComponent(escape(atob(b))));
  }catch(e){ return null; }
}
/* Progress chart: points = [{pct, label}] in time order. */
function chartSVG(points){
  if(points.length < 2) return "";
  var W = 440, H = 170, L = 44, R = 26, T = 12, B = 28;
  var step = (W - L - R) / (points.length - 1);
  var y = function(p){ return T + (H - T - B) * (1 - p/100); };
  var h = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Biểu đồ tỉ lệ câu đúng qua các bài">';
  [0,50,100].forEach(function(v){ h += '<line class="ax" x1="' + L + '" x2="' + (W-R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text x="' + (L-6) + '" y="' + (y(v)+4) + '" text-anchor="end">' + v + '%</text>'; });
  var d = points.map(function(p, i){ return (i ? "L" : "M") + (L + i*step).toFixed(1) + " " + y(p.pct).toFixed(1); }).join(" ");
  h += '<path class="ln" d="' + d + '"/>';
  var every = Math.ceil(points.length / 8);
  points.forEach(function(p, i){
    var x = L + i*step;
    h += '<circle class="dt" cx="' + x.toFixed(1) + '" cy="' + y(p.pct).toFixed(1) + '" r="4.5"><title>' + esc(p.label) + ': ' + p.pct + '%</title></circle>';
    if(i % every === 0 || i === points.length - 1) h += '<text x="' + x.toFixed(1) + '" y="' + (H-8) + '" text-anchor="middle">' + esc(p.day) + '</text>';
  });
  return h + '</svg>';
}
/* Shared progress body, used by both the teacher's profile and the student's view.
   rows: [{title, from, to, score, tot, d, wrong:[]}] in time order. */
function progressHTML(rows, comment, forStudent){
  var sc = 0, tot = 0, wr = {};
  rows.forEach(function(r){ sc += r.score; tot += r.tot; (r.wrong||[]).forEach(function(n){ wr[n] = (wr[n]||0) + 1; }); });
  var pct = tot ? Math.round(sc*100/tot) : 0;
  var pcts = rows.map(function(r){ return r.tot ? Math.round(r.score*100/r.tot) : 0; });
  var avg = function(a){ return a.length ? Math.round(a.reduce(function(x,y){ return x+y; },0)/a.length) : 0; };
  var trend = "";
  if(pcts.length >= 4){
    var k = Math.min(3, Math.floor(pcts.length/2));
    var diff = avg(pcts.slice(-k)) - avg(pcts.slice(-2*k, -k));
    trend = diff > 2 ? "Tăng " + diff + " điểm %" : diff < -2 ? "Giảm " + (-diff) + " điểm %" : "Ổn định";

/* ---------- dựng đề (dùng chung cho trang quản lý và trang học sinh) ---------- */
function buildSnapshot(qmap, from, to){
  var out = [];
  for(var n = from; n <= to; n++){
    var q = qmap[n] || {};
    var it = {n:n, group:q.group||"", passage:q.passage||"", image:q.image||"", stem:q.stem||"", opts:(q.opts||["","","",""]).slice(0,4), share:!!q.share};
    if(q.audio && !(out.length && (qmap[n-1]||{}).audio === q.audio)) it.audio = q.audio;
    if(n === from){
      if(!it.group){ for(var k = n-1; k >= 1; k--){ if(qmap[k] && qmap[k].group){ it.group = qmap[k].group; break; } } }
      if(it.share){ var j = n; while(j > 1 && qmap[j] && qmap[j].share) j--; it.passage = (qmap[j]||{}).passage || ""; it.image = (qmap[j]||{}).image || ""; it.share = false; }
    }
    out.push(it);
  }
  return out;
}
function groupStart(qm, n){ for(var k = n; k >= 1; k--){ if(qm[k] && qm[k].group) return k; } return n; }
function groupOf(qm, n){ var k = groupStart(qm, n); return (qm[k] && qm[k].group) || ""; }
function groupBody(g){ return String(g || "").replace(/^\s*\[[^\]]*\]\s*/, "").trim(); }
function groupTag(g){ var m = String(g || "").match(/^\s*\[([^\]]+)\]/); return m ? m[1] : ""; }
function passageOwner(qm, n){ var j = n; while(j > 1 && qm[j] && qm[j].share) j--; return qm[j] || {}; }
/* Đề trộn: chép câu sang đề mới, đánh số lại 1..N, gộp tiêu đề dạng câu, đổi [a~b] theo số mới,
   đoạn văn dùng chung chỉ giữ "dùng chung" khi câu trước liền kề cùng đề, còn lại chép đoạn văn vào câu.
   list: [{e, n}], qmaps: {examId: {n: câu}}. Trang học sinh dựng lại đề trộn từ đề gốc bằng đúng hàm này. */
function mixQs(list, qmaps){
  var docs = [], prev = null, prevBody = null;
  list.forEach(function(it, i){
    var qm = qmaps[it.e] || {}, q = qm[it.n] || {};
    var g = groupOf(qm, it.n), body = groupBody(g);
    var cont = !!(prev && prev.e === it.e && prev.n === it.n - 1);
    var share = !!q.share && cont;
    var own = (q.share && !share) ? passageOwner(qm, it.n) : q;
    docs.push({n:i+1, group:(body && body === prevBody) ? "" : g, passage:share ? "" : (own.passage || ""), image:share ? "" : (own.image || ""),
      stem:q.stem || "", opts:(q.opts || ["","","",""]).slice(0,4), share:share, _q:q, _it:it});
    if(q.audio && !(cont && (qm[it.n-1]||{}).audio === q.audio)) docs[docs.length-1].audio = q.audio;
    prev = it; prevBody = body || prevBody;
  });
  docs.forEach(function(d, i){
    if(!d.group || !groupTag(d.group)) return;
    var j = i; while(j + 1 < docs.length && !docs[j+1].group) j++;
    d.group = d.group.replace(/^\s*\[[^\]]*\]/, "[" + (i+1) + (j > i ? "~" + (j+1) : "") + "]");
  });
  return docs;
}
/* Dấu nội dung một câu (phần học sinh thấy) — tools/sync_kho.py tính y hệt để biết đề đã sửa sau lần đồng bộ. */
function qSig(q){ q = q || {}; return sum([q.group||"", q.passage||"", q.image||"", q.stem||"", (q.opts||[]).slice(0,4).join("\u0001"), q.share ? 1 : 0].join("\u0002")); }
function vSecSig(groups){
  return sum(groups.slice().sort(function(a,b){ return ((a.order||0) - (b.order||0)) || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0); })
    .map(function(g){ return (g.words || []).map(function(w){ return (w.id||"") + "\u0001" + (w.ko||"") + "\u0001" + (w.vi||""); }).join("\u0002"); }).join("\u0003"));
}

/* ---------- question rendering (shared) ---------- */
function qHTML(q){
  var h = "";
  if(q.group) h += '<div class="grp">' + fmtGroup(q.group) + '</div>';
  var showP = !q.share && (q.passage || q.image);
  var pass = showP ? '<div class="passage">' + (q.image ? '<img src="' + esc(q.image) + '" alt="Hình minh họa câu ' + q.n + '">' : '') + (q.passage ? '<div class="ptext">' + fmt(q.passage) + '</div>' : '') + '</div>' : '';

  if(q.audio) h += '<div class="qaudio"><span>🎧 Nghe</span><audio controls preload="none" src="' + esc(q.audio) + '"></audio></div>';
  if(showP && q.stem) h += pass + '<p class="stem"><b>' + q.n + '.</b><span>' + fmt(q.stem) + '</span></p>';
  else if(showP) h += '<p class="stem"><b>' + q.n + '.</b></p>' + pass;
  else h += '<p class="stem"><b>' + q.n + '.</b><span>' + fmt(q.stem) + '</span></p>';
  var opts = (q.opts || []).slice(0,4); while(opts.length < 4) opts.push("");
  var short = opts.every(function(o){ return String(o).length <= 16; });
  h += '<div class="opts' + (short ? " two" : "") + '" role="radiogroup" aria-label="Câu ' + q.n + '">';

  return h + '</div></section>';
}

/* Tô từ trong đoạn văn, câu hỏi, lựa chọn: chữ trong đề của từng từ (đầu một từ, không nằm giữa từ khác). */

  alts.sort(function(a, b){ return b.length - a.length; });
  var re = new RegExp(alts.map(function(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }).join("|"), "g");
  $$(".ptext, .stem > span, .opt > span:last-child", root).forEach(function(el){

/* =====================================================================
   LỘ TRÌNH TỪ VỰNG – một link cố định (#l=…) cô gửi một lần.

var VOCAB = null;
function loadVocab(){
  if(VOCAB) return Promise.resolve(VOCAB);

}
function ymdTs(ymd){ var m = String(ymd || "").match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? new Date(+m[1], +m[2]-1, +m[3]).getTime() : NaN; }
function dayStart(ts){ var t = new Date(ts); return new Date(t.getFullYear(), t.getMonth(), t.getDate()).getTime(); }
function routeDayNo(p, ts){ return Math.round((dayStart(ts || Date.now()) - ymdTs(p.d)) / 864e5) + 1; }
function routeWords(p, vocab){
  var out = [], seen = {};
  (p.s || []).forEach(function(sec){
    vocab.g.filter(function(g){ return g.sec === sec; }).sort(function(a,b){ return ((a.o||0) - (b.o||0)) || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0); }).forEach(function(g){
      g.w.forEach(function(w){ if(w[0] && !seen[w[0]]){ seen[w[0]] = 1; out.push({id:w[0], ko:w[1], vi:w[2], ex:w[3] || ""}); } });

function rKey(p, name){ return "nari-l-" + p.c + "-" + normName(name).replace(/[^a-z0-9]/g, ""); }
function rMem(p, name){ var m = lsGet(rKey(p, name)) || {}; m.wrong = m.wrong || {}; m.done = m.done || {}; m.les = m.les || {}; m.srs = m.srs || {}; m.ok = m.ok || {}; return m; }
/* Ôn ngắt quãng (lộ trình có q): mỗi từ đã học có hộp b và ngày đến hạn due (số ngày của lộ trình).
   Sai → hộp 0, ôn lại hôm sau. Đúng → lên hộp, ôn lại sau 3, 7, 14 ngày; đúng ở hộp 3 → đã thuộc (bỏ khỏi danh sách ôn). */
var SRS_GAP = [1, 3, 7, 14];
function rSrsDue(mem, day){ return Object.keys(mem.srs).map(function(id){ var w = mem.srs[id]; return {id:id, ko:w.ko, vi:w.vi, ex:w.ex, b:w.b, due:w.due}; }).filter(function(w){ return w.due <= day; }).sort(function(a,b){ return (a.due - b.due) || (a.b - b.b); }); }
/* Từ sai đang chờ ôn, cũ trước. */
function rWrongList(mem){ return Object.keys(mem.wrong).map(function(id){ var w = mem.wrong[id]; return {id:id, ko:w.ko, vi:w.vi, ex:w.ex, n:w.n || 1, t:w.t || 0}; }).sort(function(a,b){ return a.t - b.t; }); }
function rRecord(a, vs){
  var p = a.route, mem = rMem(p, vs.name), sc = 0, now = Date.now(), day = routeDayNo(p), R = vScore(a.y, a.w, vAnsArr(a, vs));
  a.w.forEach(function(it, i){
    var id = a.ids[i], ok = !R.bad[i], s = mem.srs[id]; /* bài nhiều dạng: đúng ở mọi bước mới tính là đúng */
    if(ok){ sc++; delete mem.wrong[id]; }
    else { var o = mem.wrong[id] || {t:now, n:0}; mem.wrong[id] = {ko:it[0], vi:it[1], ex:it[2] || "", n:(o.n || 0) + 1, t:o.t || now}; }
    if(!p.q) return;
    if(!ok) mem.srs[id] = {ko:it[0], vi:it[1], ex:it[2] || "", b:0, due:day + SRS_GAP[0]};
    else if(s && s.b >= SRS_GAP.length - 1){ delete mem.srs[id]; mem.ok[id] = 1; }
    else { var b = s ? s.b + 1 : 1; mem.srs[id] = {ko:it[0], vi:it[1], ex:it[2] || "", b:b, due:day + SRS_GAP[b]}; }

function routeBoot(){

  loadVocab().then(function(){ rHome(p); }, function(){ rShell('<p class="err">Chưa tải được từ vựng. Em kiểm tra mạng rồi tải lại trang nhé.</p>'); });

}
function rShell(inner, sub){ vStopClock(); app.innerHTML = '<div class="wrap">' + headerHTML() + '<main class="paper"><div class="title"><h1>단어 공부</h1><p>' + esc(sub || "Kiểm tra từ vựng · Nari TOPIK") + '</p></div>' + inner + '</main></div>'; }
function rHome(p){

        (mem.done[rk] ? '<p class="okmsg">Em đã ôn hôm nay: đúng ' + mem.done[rk].sc + '/' + mem.done[rk].tot + ' từ.</p>' : due.length ? '<div class="row"><button class="btn wide" data-rk="' + rk + '">Ôn ' + due.length + ' từ đến hạn hôm nay</button></div>' : '') + '</div>';
      else h += '<div class="panel"><h2>Em đã học hết ' + words.length + ' từ của lộ trình</h2><p>' + (wl.length ? 'Còn ' + wl.length + ' từ em hay sai. Mỗi ngày em làm một bài ôn cho tới khi hết từ sai nhé.' : 'Em không còn từ nào làm sai. Giỏi lắm!') + '</p>' +

    if(wl.length) h += '<p style="margin-top:12px"><strong>Từ em còn sai (' + wl.length + '):</strong> sẽ được ôn ở bài sau.</p><div style="font-size:14px;line-height:1.9">' + wl.slice(0, 30).map(function(w){ return '<span class="pill bad" style="font-family:var(--kr)">' + esc(w.ko) + '</span>'; }).join("") + (wl.length > 30 ? ' …' : '') + '</div>';
  }

  $$("[data-rk]").forEach(function(b){ b.onclick = function(){ rStart(p, b.dataset.rk, words, name); }; });
}
function rReviewKey(){ var d = new Date(); return "R" + d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()); }
/* Bài của ngày k: từ mới của ngày + từ sai cũ (tối đa p.r). Đã bắt đầu thì giữ nguyên danh sách. */
function rLessonIds(p, k, words, mem){

function rLessonInfo(p, k, words, mem){

function rStart(p, k, words, name){

/* =====================================================================
   LUYỆN NGHE – phía học sinh. Link #n=… chứa {c: mã bài, t: tên bài, l: id bài nghe}.
   Nội dung bài (lời thoại, câu hỏi, đáp án) ở nghe/<id>.json, file nghe ở nghe/audio/.
   Phần 1: câu hỏi tiếng Việt (4 lựa chọn) · Phần 2: chọn câu nói tiếp theo (2 lựa chọn) ·
   Phần 3: nghe lần 2, điền từ còn thiếu (trong lời thoại, từ cần điền viết trong [ ], đáp án khác nhau ngăn bằng /).
   ===================================================================== */
var NPARTS = ["Nghe và trả lời câu hỏi", "Chọn câu nói tiếp theo", "Nghe lại và điền từ"];
function nBlanks(ko){ var out = []; String(ko || "").replace(/\[([^\]]+)\]/g, function(_, w){ out.push(w); return ""; }); return out; }
/* Các ô trả lời theo thứ tự cố định (trang quản lý chấm theo đúng thứ tự này): {i: câu, p: phần 1–3, q, o, key} */
function nSlots(L){
  var s = [];
  L.items.forEach(function(it, i){
    (it.qs || []).forEach(function(q){ s.push({i:i, p:1, q:q.q, o:q.o, key:q.a}); });
    if(it.next) s.push({i:i, p:2, q:it.next.q, o:it.next.o, key:it.next.a});
  });
  L.items.forEach(function(it, i){
    (it.script || []).forEach(function(ln){ if(!ln.end) nBlanks(ln.ko).forEach(function(w){ s.push({i:i, p:3, key:w}); }); });
  });
  return s;
}
function nCheck(sl, ans){
  if(sl.p === 3) return !!String(ans || "").trim() && String(sl.key).split("/").map(vNorm).indexOf(vNorm(ans)) >= 0;
  return typeof ans === "number" && ans === sl.key;
}
function nAnsText(sl, ans){ if(sl.p === 3) return String(ans || ""); return typeof ans === "number" && sl.o[ans] != null ? sl.o[ans] : ""; }
function nKeyText(sl){ return sl.p === 3 ? String(sl.key).split("/")[0] : sl.o[sl.key]; }
/* Chấm: dùng chung cho trang học sinh và trang quản lý. */
function nScore(L, ans){
  var slots = nSlots(L), parts = [[0,0],[0,0],[0,0]], score = 0, wrong = [];
  slots.forEach(function(sl, j){
    var ok = nCheck(sl, ans[j]); parts[sl.p-1][1]++;
    if(ok){ score++; parts[sl.p-1][0]++; }
    else wrong.push({n:L.items[sl.i].n, p:sl.p, q:sl.p === 3 ? "" : sl.q, key:nKeyText(sl), ans:nAnsText(sl, ans[j])});
  });
  return {score:score, total:slots.length, parts:parts, wrong:wrong};
}
function encodeN(obj){ var raw = b64e(obj); return "NN1-" + raw + "-" + sum(raw); }
function decodeN(code){
  var m = String(code).match(/^NN1-([A-Za-z0-9_-]+)-([0-9a-z]{4})$/);
  if(!m || sum(m[1]) !== m[2]) return null;
  try{ var o = b64d(m[1]); o._sum = m[2]; return o; }catch(e){ return null; }
}

var NS = null;
function nShell(inner){ vStopClock(); app.innerHTML = '<div class="wrap">' + headerHTML() + '<main class="paper"><div class="title"><h1>듣기 연습</h1><p>Luyện nghe · Nari TOPIK</p></div>' + inner + '</main></div>'; }
function ngheBoot(){
  var m = String(location.hash || "").match(/[#&]n=([A-Za-z0-9_.-]+)/);
  if(!m) return false;
  var p = vUnpack(m[1]);
  if(!p || !p.c || !p.l){ nShell('<p class="err">Link bài nghe bị thiếu hoặc bị cắt. Em sao chép lại đủ cả link cô gửi rồi mở lại nhé.</p>'); return true; }
  nShell('<p class="hint">Đang tải bài…</p>');
  fetch("nghe/" + encodeURIComponent(p.l) + ".json", {cache:"no-cache"}).then(function(r){ if(!r.ok) throw new Error("http " + r.status); return r.json(); }).then(function(L){
    nEntry(p, L);
  }, function(){ nShell('<p class="err">Chưa tải được bài nghe. Em kiểm tra mạng rồi tải lại trang nhé. Nếu vẫn lỗi, em nhắn cô.</p>'); });
  return true;
}
function nEntry(p, L){
  var last = lsGet("nari-tt-last") || {};
  nShell('<div class="metaline"><span>Bài: <strong>' + esc(p.t || L.title) + '</strong></span><span><strong>' + L.items.length + '</strong> đoạn nghe</span></div>' +
    '<div class="note" style="white-space:normal"><strong>Cách làm:</strong> Mỗi đoạn em nghe <strong>2 lần</strong>.<br>Lần 1: làm <strong>Phần 1</strong> (trả lời câu hỏi) và <strong>Phần 2</strong> (chọn câu nói tiếp theo).<br>Lần 2: bấm “Sang Phần 3” rồi nghe lại và <strong>điền từ còn thiếu</strong>. Sang Phần 3 thì không sửa được Phần 1, 2 nữa.<br>Em đeo tai nghe hoặc bật loa trước khi bắt đầu nhé.</div>' +
    '<label class="l" for="nname">Họ và tên của em</label><input class="t" id="nname" autocomplete="name" value="' + esc(last.name || "") + '" placeholder="VD: Nguyễn Thị Lan">' +
    '<p class="err" id="nerr" hidden></p><div class="row"><button class="btn wide" id="ngo">Bắt đầu làm bài</button></div>');
  $("#ngo").onclick = function(){
    var n = cleanName($("#nname").value);
    if(!n){ var e = $("#nerr"); e.textContent = "Em nhập họ tên trước khi làm bài nhé."; e.hidden = false; $("#nname").focus(); return; }
    last.name = n; lsSet("nari-tt-last", last);
    nStart(p, L, n);
  };
  $("#nname").addEventListener("keydown", function(e){ if(e.key === "Enter") $("#ngo").click(); });
}
function nStart(p, L, name){
  var slots = nSlots(L), key = "nari-n-" + p.c + "-" + normName(name).replace(/[^a-z0-9]/g, "");
  var saved = lsGet(key);
  if(saved && saved.c === p.c && saved.n === slots.length) NS = saved;
  else{
    NS = {c:p.c, n:slots.length, ans:{}, ord:{}, stage:1, start:Date.now(), submitted:null};
    slots.forEach(function(sl, j){ if(sl.p !== 3) NS.ord[j] = vShuffle(sl.o.map(function(_, k){ return k; })); });
  }
  NS.p = p; NS.L = L; NS.slots = slots; NS.name = name; NS.key = key;
  nSave(); nRender(); window.scrollTo(0, 0);
}
function nSave(){ var c = Object.assign({}, NS); delete c.p; delete c.L; delete c.slots; lsSet(NS.key, c); }
function nNeed(){ return NS.slots.filter(function(sl){ return NS.stage === 1 ? sl.p !== 3 : true; }).length; }
function nDone(){ return NS.slots.filter(function(sl, j){ var x = NS.ans[j]; if(NS.stage === 1 && sl.p === 3) return false; return sl.p === 3 ? !!String(x || "").trim() : typeof x === "number"; }).length; }
function nAudio(it){ return '<audio controls preload="none" src="' + esc(it.audio) + '" style="width:100%;margin:4px 0 8px"></audio>'; }
function nChoice(j, label){
  var sl = NS.slots[j], lockQ = NS.stage > 1 || !!NS.submitted, done = !!NS.submitted;
  return '<div style="margin:10px 0 4px;font-weight:600">' + (label ? label + ' ' : '') + esc(sl.q) + '</div><div class="opts' + (sl.o.length > 2 ? ' two' : '') + '" role="radiogroup">' +
    (NS.ord[j] || []).map(function(o, k){
      var picked = NS.ans[j] === o, right = done && o === sl.key;
      return '<button type="button" class="opt' + (right ? ' key' : '') + (done && picked && !right ? ' badpick' : '') + '" role="radio" aria-checked="' + picked + '" data-j="' + j + '" data-o="' + o + '"' + (lockQ ? ' tabindex="-1"' : '') + ' style="font-family:var(--ui)"><span class="num">' + "ABCD".charAt(k) + '</span><span>' + esc(sl.o[o]) + '</span></button>';
    }).join("") + '</div>';
}
function nRender(){
  var L = NS.L, slots = NS.slots, done = !!NS.submitted, h = "";
  var byItem = function(i, p){ var out = []; slots.forEach(function(sl, j){ if(sl.i === i && sl.p === p) out.push(j); }); return out; };
  L.items.forEach(function(it, i){
    h += '<section class="q nitem"><div class="grp" style="margin-top:6px"><span class="tag">Câu ' + esc(it.n) + '</span>' + (done || NS.stage > 1 ? '' : 'Nghe lần 1') + '</div>' + (NS.stage === 1 && !done ? nAudio(it) : '') +
      '<div class="nsub">Phần 1 · ' + NPARTS[0] + '</div>' + byItem(i, 1).map(function(j, k){ return nChoice(j, (k+1) + '.'); }).join("") +
      (byItem(i, 2).length ? '<div class="nsub">Phần 2 · ' + NPARTS[1] + '</div>' + byItem(i, 2).map(function(j){ return nChoice(j, ""); }).join("") : '') + '</section>';
  });
  if(NS.stage > 1 || done){
    h += '<div class="grp" style="margin-top:26px"><span class="tag">Phần 3</span>' + NPARTS[2] + '</div><p class="hint">Nghe lại từng đoạn và gõ từ còn thiếu bằng tiếng Hàn.</p>';
    var j0 = slots.findIndex(function(sl){ return sl.p === 3; }), j = j0, num = 0;
    L.items.forEach(function(it){
      h += '<section class="q"><div style="font-weight:700;color:var(--violet);margin-bottom:4px">Câu ' + esc(it.n) + '</div>' + (done ? '' : nAudio(it));
      (it.script || []).forEach(function(ln){
        if(ln.end) return;
        var txt = esc(ln.ko).replace(/\[([^\]]+)\]/g, function(){
          var jj = j++, ok = done && nCheck(slots[jj], NS.ans[jj]); num++;
          return '<span class="nblank">(' + num + ')<input class="t kr" data-bj="' + jj + '" value="' + esc(NS.ans[jj] || "") + '" autocomplete="off" autocapitalize="off" spellcheck="false" lang="ko"' + (done ? ' disabled style="border-color:' + (ok ? 'var(--ok)' : 'var(--pen)') + '"' : '') + '>' + (done && !ok ? '<span class="vfix">' + esc(nKeyText(slots[jj])) + '</span>' : '') + '</span>';
        });
        h += '<p class="nline"><b>' + esc(ln.s) + ':</b> ' + txt + '</p>';
      });
      h += '</section>';
    });
  }
  var need = nNeed(), nd = nDone();
  app.innerHTML = '<div class="wrap">' + headerHTML() + '<main class="paper" id="exam"><div class="title"><h1>듣기 연습</h1><p>' + esc(NS.p.t || L.title) + '</p></div>' +
    '<div class="metaline"><span>Luyện nghe · <strong>' + L.items.length + '</strong> đoạn</span><span>Học sinh: <strong>' + esc(NS.name) + '</strong></span></div>' +
    '<div id="nq"' + (done ? ' class="locked"' : '') + '>' + h + '</div><div id="nres"></div></main></div>' +
    '<nav class="strip" aria-label="Tiến độ"><div class="in"><div style="flex:1;font-weight:600">' + (done ? 'Đã nộp' : 'Đã làm <span id="ncount">' + nd + '</span>/' + need) + '</div><div class="clock" id="vclock"></div>' +
    (done ? '' : NS.stage === 1 ? '<button class="btn" id="nnext">Sang Phần 3</button>' : '<button class="btn" id="nsub">Nộp bài</button>') + '</div></nav>';
  nWire();
  if(done){ vStopClock(); nShowResult(); }
  else{
    vStopClock();
    var tick = function(){ var el = $("#vclock"); if(!el || !NS || NS.submitted){ vStopClock(); return; } var t = Math.floor((Date.now() - NS.start)/1000); el.textContent = pad(Math.floor(t/60)) + ":" + pad(t%60); };
    tick(); vTimer = setInterval(tick, 1000);
  }
}
function nWire(){
  var q = $("#nq");
  if(NS.submitted) return;
  if($("#nnext")) $("#nnext").onclick = function(){
    var miss = nNeed() - nDone();
    ask((miss ? "Em còn " + miss + " câu ở Phần 1, 2 chưa chọn. " : "") + "Sang Phần 3 thì không sửa được Phần 1, 2 nữa. Em sang Phần 3 nhé?", "Sang Phần 3", "Ở lại").then(function(ok){
      if(!ok) return; NS.stage = 3; nSave(); nRender();
      setTimeout(function(){ var el = $$(".nline")[0]; if(el) el.closest("section").scrollIntoView({behavior:"smooth", block:"start"}); }, 60);
    });
  };
  if($("#nsub")) $("#nsub").onclick = nSubmit;
  q.addEventListener("click", function(e){
    var b = e.target.closest(".opt"); if(!b || NS.stage > 1) return;
    NS.ans[b.dataset.j] = +b.dataset.o; nSave();
    $$('.opt[data-j="' + b.dataset.j + '"]', q).forEach(function(o){ o.setAttribute("aria-checked", o === b ? "true" : "false"); });
    $("#ncount").textContent = nDone();
  });
  $$("[data-bj]", q).forEach(function(inp){ inp.addEventListener("input", function(){ NS.ans[inp.dataset.bj] = inp.value; nSave(); $("#ncount").textContent = nDone(); }); });
  /* chỉ phát một đoạn một lúc */
  $$("audio", q).forEach(function(au){ au.addEventListener("play", function(){ $$("audio", q).forEach(function(x){ if(x !== au) x.pause(); }); }); });
}
function nSubmit(){
  var miss = nNeed() - nDone();
  ask(miss ? "Em còn " + miss + " ô chưa làm. Em vẫn muốn nộp bài? Sau khi nộp sẽ không sửa được." : "Em đã làm đủ. Nộp bài?", "Nộp bài", "Làm tiếp").then(function(ok){
    if(!ok) return;
    NS.submitted = Date.now(); nSave(); nRender();
    setTimeout(function(){ var r = $("#nres"); if(r) r.scrollIntoView({behavior:"smooth", block:"start"}); }, 60);
  });
}
function nShowResult(){
  var L = NS.L, ans = NS.slots.map(function(sl, j){ var x = NS.ans[j]; return sl.p === 3 ? String(x || "") : (typeof x === "number" ? x : -1); });
  var r = nScore(L, ans);
  var code = encodeN({c:NS.c, l:L.id, x:NS.p.t || L.title, n:NS.name, a:ans, t:Math.round((NS.submitted - NS.start)/1000), d:NS.submitted});
  var pl = r.parts.map(function(p, k){ return "Phần " + (k+1) + ": " + p[0] + "/" + p[1]; }).join(" · ");
  var msg = "BÀI LUYỆN NGHE\nBài: " + (NS.p.t || L.title) + "\nHọ tên: " + NS.name + "\nĐiểm: " + r.score + "/" + r.total + " (" + pl + ")\nNộp lúc: " + fmtDate(NS.submitted) + "\nMã bài làm: " + code;
  var script = L.items.map(function(it){
    return '<div class="nscript"><div style="font-weight:700;color:var(--violet)">Câu ' + esc(it.n) + '</div>' + nAudio(it) + (it.script || []).map(function(ln){
      return '<p class="nline"' + (ln.end ? ' style="color:var(--ok)"' : '') + '><b>' + esc(ln.s) + ':</b> ' + esc(String(ln.ko).replace(/\[([^\]]+)\]/g, function(_, w){ return w.split("/")[0]; })) + (ln.end ? ' <span class="pill good">câu nói tiếp theo</span>' : '') + (ln.vi ? '<br><span class="muted" style="font-family:var(--ui);font-size:14px">' + esc(ln.vi) + '</span>' : '') + '</p>';
    }).join("") + '</div>';
  }).join("");
  $("#nres").innerHTML = '<div class="panel" id="result"><h2>Em đúng ' + r.score + '/' + r.total + ' câu</h2><p class="muted">' + esc(pl) + '</p>' +
    '<p style="margin-top:12px">Bấm “Sao chép” rồi dán vào tin nhắn Zalo gửi cho cô.</p><div id="nmsg">' + copyBox(msg, 6) + '</div>' +
    '<div class="row"><button class="btn ghost" id="nagain">Làm lại để luyện thêm</button></div></div>' +
    '<div class="card" style="margin-top:16px"><h2>Lời thoại và nghĩa</h2><p class="hint">Em nghe lại và đọc theo lời thoại để luyện thêm.</p>' + script + '</div>';
  wireCopy($("#nmsg"));
  $$("#nres audio").forEach(function(au){ au.addEventListener("play", function(){ $$("audio").forEach(function(x){ if(x !== au) x.pause(); }); }); });
  $("#nagain").onclick = function(){ ask("Làm lại từ đầu? Kết quả lần này em đã gửi cô chưa? Nếu chưa, em sao chép tin nhắn trước nhé.", "Làm lại", "Ở lại").then(function(ok){ if(!ok) return; try{ localStorage.removeItem(NS.key); }catch(e){} nStart(NS.p, L, NS.name); }); };
}

/* ==W== */
/* ---------- Luyện viết (câu 51–54) — link thi-thu/#w=<base64>.<sum> ----------
   p = {c: mã bài, t: tên bài, nk: 1 = không kèm đáp án (cô chấm rồi gửi bảng sửa bài),
        i: [{s: nguồn, y: dạng câu, p: đoạn văn / đề bài (51–52 có ( ㉠ ) ( ㉡ )), im: link ảnh (câu 53),
             h: {a:[gợi ý…], b:[…]}, k: {a:[đáp án mẫu…], b:[…]}, g: {a: mẫu ngữ pháp, b}}]}  (k, g bỏ khi nk = 1; h bỏ khi cô tắt gợi ý)
   Gợi ý mở dần từng bậc (không trừ điểm, mã nộp ghi số gợi ý đã mở); «chữ» trong gợi ý được tô trong đoạn văn.
   Câu 53/54 có ô viết dài + đếm chữ (tính cả dấu cách như ô 원고지, không tính xuống dòng).
   Nộp: mã NW1-{c, n: tên, a: [[㉠, ㉡]…], h: [[số gợi ý ㉠, ㉡]…], t, d} → cô dán vào Chấm bài (wresults).
   Bảng sửa bài cô gửi lại: link thi-thu/#s=<base64>.<sum> (wsBoot), nội dung đề + bài mẫu chia ý lấy từ thi-thu/viet/<id>.json. */
var WS = null, W_BL = {a:"㉠", b:"㉡"};
var W_LEN = {53:[200, 300], 54:[600, 700]};
var W_RUB = {53:[["c","Nội dung & yêu cầu đề","내용 및 과제 수행",7],["o","Bố cục, triển khai","글의 전개 구조",7],["l","Sử dụng ngôn ngữ","언어 사용",16]],
             54:[["c","Nội dung & yêu cầu đề","내용 및 과제 수행",12],["o","Bố cục, triển khai","글의 전개 구조",12],["l","Sử dụng ngôn ngữ","언어 사용",26]]};
var W_TAGS = [["조사","Tiểu từ"],["어미·문법","Đuôi câu / ngữ pháp"],["맞춤법","Chính tả"],["띄어쓰기","Viết cách"],["어휘","Từ vựng"],["구어체","Văn nói"],["내용","Nội dung"]];
function wTwoY(y){ return +y === 51 || +y === 52; }
function wKeysOf(y){ return wTwoY(y) ? ["a","b"] : ["a"]; }
function wMaxOf(y, n){ return +y === 53 ? 30 : +y === 54 ? 50 : 5 * (n || 2); }
function wLen(t){ return String(t || "").replace(/\r?\n/g, "").length; }
function wLenHTML(t, y){
  var n = wLen(t), r = W_LEN[+y]; if(!r) return "";
  var cls = n < r[0] ? "warn" : n > r[1] ? "bad" : "good";
  return '<span class="pill ' + cls + '">' + n + '자</span> <span class="muted" style="font-size:13px">yêu cầu ' + r[0] + '–' + r[1] + '자</span>';
}
/* Tách câu: hết câu ở . ! ? (cả khi học sinh quên dấu cách: "조사하였다.2019년"), trừ số thập phân "2.5배", dấu "..." và
   dấu ngoặc/ngoặc kép đóng ngay sau; xuống dòng cũng là hết câu. Máy tách sai thì cô sửa tay trong wGradeModal (“Sửa cách tách câu”). */
function wSents(t){
  var s = String(t || "").replace(/\r/g, ""), out = [], cur = "";
  for(var i = 0; i < s.length; i++){
    var c = s[i], nx = s[i+1] || "";
    if(c === "\n"){ if(cur.trim()) out.push(cur.trim()); cur = ""; continue; }
    cur += c;
    if(!/[.!?。]/.test(c)) continue;
    if(!nx || /\s/.test(nx)){ out.push(cur.trim()); cur = ""; continue; }
    if(/[.!?。"'”’)」』\]~%]/.test(nx)) continue;
    if(c === "." && /[0-9]/.test(s[i-1] || "") && /[0-9]/.test(nx)) continue;
    out.push(cur.trim()); cur = "";
  }
  if(cur.trim()) out.push(cur.trim());
  return out;
}
/* Bài mẫu 53/54 chia theo câu (Câu 1, Câu 2…): câu thứ j của học sinh đối chiếu với câu mẫu thứ j, không gắn ý.
   Học sinh gộp/tách câu khác bài mẫu thì cô tách lại cho khớp (“Sửa cách tách câu”). */
function wModelSents(w){ var m = ((w.keys || {}).a || [])[0] || (w.blocks || []).map(function(b){ return b.ko || ""; }).join(" "); return wSents(m).map(function(t, j){ return {k:"Câu " + (j+1), ko:t}; }); }
function wByIdx(xs){ return (xs || []).map(function(x, j){ return Object.assign({}, x, {b:j}); }); }
/* Câu văn nói (đuôi -요 / -습니다, 제가, 저는…) — bài 53/54 phải viết đuôi -다. */

      cl.concat([stu]).forEach(function(x){ if(!x) return; if(x.miss) out.miss.push(x.miss); if(x.net) out.net = true; if(x.due) out.due = x.due; });
      cl.forEach(function(x){ (x && x.days || []).forEach(function(d){ var o = out.days[d.d] || (out.days[d.d] = {f:d.f, it:[]}); o.it = o.it.concat(d.it || []); }); });
      out.it = (stu && stu.it) || [];
      return out;
    });
  });
}
function appDone(x, name){
  if(x.y === "l"){ var m = lsGet("nari-l-" + x.p.c + "-" + normName(name).replace(/[^a-z0-9]/g, "")); return !!(m && m.done && m.done[x.k]); } /* lộ trình: bài ngày k đã làm */
  var s = lsGet(APP_DONE[x.y] + x.p.c + "-" + normName(name).replace(/[^a-z0-9]/g, ""));
  return !!(s && s.submitted);
}
function appTask(x, i, me, sub){
  var done = appDone(x, me.n);
  return '<button class="appitem' + (done ? ' done' : '') + '" type="button" data-task="' + i + '"><span class="ak">' + esc(x.lb || APP_YK[x.y] || "") + (sub ? ' · ' + esc(sub) : '') + (done ? ' · <b class="ok">✓ Đã nộp</b>' : '') + '</span>' +
    '<span class="at">' + esc(x.t || APP_YK[x.y]) + '</span><span class="ago">›</span></button>';
}
function appTodayHTML(){
  var me = lsGet(ME_KEY);
  if(!me || !(me.l || me.h)){
    return '<section class="apphomebox" id="appMe"><h2>Vào lớp của em</h2><p class="hint" style="margin-top:0">Em nhập mã cô gửi một lần. Từ đó mỗi ngày mở app là thấy bài hôm nay, không phải mở link.</p>' +
      '<div class="grid2"><div><label class="l" for="meL">Mã lớp</label><input class="t code" id="meL" maxlength="8" autocomplete="off" placeholder="VD: K7Q2MA"></div>' +
      '<div><label class="l" for="meH">Mã của em</label><input class="t code" id="meH" maxlength="8" autocomplete="off" placeholder="VD: B3HX9P"></div></div>' +
      '<label class="l" for="meN">Họ và tên của em</label><input class="t" id="meN" autocomplete="name" placeholder="VD: Nguyễn Thị Lan" value="' + esc((lsGet("nari-tt-last") || {}).name || "") + '">' +
      '<p class="err" id="meErr" hidden></p><div class="row"><button class="btn wide" id="meGo" type="button">Lưu và xem bài</button></div></section>';
  }
  return '<section class="apphomebox" id="appMe"><h2>Bài hôm nay · ' + esc(appDay(appYmd(0))) + '</h2>' +
    '<p class="hint" style="margin-top:0">Em: <strong>' + esc(me.n) + '</strong> · <button class="lnk" id="meEdit" type="button">Đổi mã / tên</button></p>' +
    '<div id="appTasks"><p class="hint">Đang tải bài…</p></div></section>';
}
function appTodayWire(){
  var me = lsGet(ME_KEY), box = $("#appTasks");
  if(!me || !(me.l || me.h)){
    var go = $("#meGo"); if(!go) return;
    go.onclick = function(){
      var l = appCode($("#meL").value), h = appCode($("#meH").value), n = cleanName($("#meN").value), err = $("#meErr");
      var bad = function(t){ err.textContent = t; err.hidden = false; };
      if(!l && !h) return bad("Em nhập mã lớp hoặc mã của em nhé.");
      if((l && l.length !== 6) || (h && h.length !== 6)) return bad("Mã gồm 6 chữ và số. Em xem lại tin nhắn của cô nhé.");
      if(!n) return bad("Em nhập họ tên nhé (giống tên cô gọi trong lớp).");
      go.disabled = true; go.textContent = "Đang kiểm tra mã…";
      Promise.all([appFetch(l), appFetch(h)]).then(function(r){
        go.disabled = false; go.textContent = "Lưu và xem bài";
        var miss = r.filter(function(x){ return x && x.miss; }).map(function(x){ return x.miss; });
        if(miss.length) return bad("Mã " + miss.join(", ") + " chưa đúng hoặc cô chưa đăng bài. Em xem lại tin nhắn của cô nhé.");
        lsSet(ME_KEY, {l:l, h:h, n:n});
        var last = lsGet("nari-tt-last") || {}; last.name = n; lsSet("nari-tt-last", last);
        appGo();
      });
    };
    return;
  }
  $("#meEdit").onclick = function(){
    ask("Đổi mã lớp, mã của em hoặc họ tên? Bài đã làm vẫn giữ trong máy.", "Đổi", "Thôi").then(function(ok){
      if(!ok) return;
      try{ localStorage.removeItem(ME_KEY); }catch(e){}
      appGo();
      var f = function(id, v){ var el = $(id); if(el) el.value = v || ""; };
      f("#meL", me.l); f("#meH", me.h); f("#meN", me.n);
    });
  };
  appLoad(me).then(function(D){
    if(!box.isConnected) return;
    var today = appYmd(0), tasks = [], h = "";
    var list = function(arr, sub){ return '<div class="applist">' + arr.map(function(x){ tasks.push(x); return appTask(x, tasks.length - 1, me, sub ? sub(x) : ""); }).join("") + '</div>'; };
    var td = D.days[today];
    if(td && td.it.length) h += (td.f ? '<p class="hint" style="margin:0 0 6px">Trọng tâm: ' + esc(td.f) + ' · hạn nộp ' + D.due + 'h</p>' : '<p class="hint" style="margin:0 0 6px">Hạn nộp ' + D.due + 'h hôm nay</p>') + list(td.it);
    else if(!D.net) h += '<p class="hint">Hôm nay cô chưa giao bài trong app.</p>';
    var late = [];
    Object.keys(D.days).sort().reverse().forEach(function(d){ if(d < today && d >= appYmd(-7)) D.days[d].it.forEach(function(x){ if(!appDone(x, me.n)) late.push(Object.assign({_d:d}, x)); }); });
    if(late.length) h += '<h3 class="appsub">Bài những ngày trước em chưa nộp</h3>' + list(late, function(x){ return appDay(x._d); });
    var mine = D.it.filter(function(x){ return !appDone(x, me.n) || x.d >= appYmd(-7); }).slice(0, 12);
    if(mine.length) h += '<h3 class="appsub">Bài riêng cô giao cho em</h3>' + list(mine, function(x){ return x.d ? appDay(x.d) : ""; });
    if(D.miss.length) h += '<p class="err">Mã ' + esc(D.miss.join(", ")) + ' chưa đúng hoặc cô chưa đăng bài. Em bấm “Đổi mã / tên” để nhập lại.</p>';
    if(D.net) h += '<p class="err">Chưa tải được bài mới. Em kiểm tra mạng rồi mở lại app nhé.</p>';
    box.innerHTML = h;
    box.querySelectorAll("[data-task]").forEach(function(b){
      b.onclick = function(){
        var x = tasks[+b.getAttribute("data-task")]; if(!x) return;
        var last = lsGet("nari-tt-last") || {}; last.name = me.n; lsSet("nari-tt-last", last);
        appGo("#" + x.y + "=" + vPack(x.p));
      };
    });
  });
}
/* Nút “Gửi qua Zalo…” cạnh nút Sao chép tin nhắn kết quả (mở bảng chia sẻ của điện thoại). */
function appShareButtons(){
  if(!navigator.share) return;
  app.querySelectorAll("[data-copy]").forEach(function(b){
    if(b.parentNode.querySelector(".appshare")) return;
    var s = document.createElement("button");
    s.type = "button"; s.className = "btn ghost appshare"; s.textContent = "Gửi qua Zalo…";
    s.onclick = function(){ var box = b.closest(".row").previousElementSibling; navigator.share({text:box.value}).catch(function(){}); };
    b.insertAdjacentElement("afterend", s);
  });
}
function appRun(){
  stopClock(); if(typeof vStopClock === "function") vStopClock();
  window.scrollTo(0, 0);
  appMeBoot();
  appRemember();
  if(!examBoot() && !writeBoot() && !vocabBoot() && !routeBoot() && !ngheBoot() && !reportBoot()) studentLanding();
}
function appGo(h){ history.pushState(null, "", h || location.pathname + location.search); appRun(); }
var headerHTMLBase = headerHTML;
headerHTML = function(){
  var h = headerHTMLBase();
  return location.hash ? h.replace('<a class="about"', '<button class="btn ghost apphome" type="button">⌂ Trang đầu</button><a class="about"') : h;
};
function appHomeClick(){
  var busy = [].some.call(app.querySelectorAll("#submit, #vsub, #nsub, #nnext"), function(x){ return x.offsetParent; });
  if(!busy){ appGo(); return; }
  ask("Về trang đầu? Bài đang làm dở máy em vẫn nhớ, mở lại bài là làm tiếp.", "Về trang đầu", "Ở lại").then(function(ok){ if(ok) appGo(); });
}
function appHomeHTML(){
  var list = lsGet(APP_KEY) || [];
  var row = function(x, i){
    return '<button class="appitem" type="button" data-i="' + i + '"><span class="ak">' + esc(APP_KINDS[x.k] || "") + '</span>' +
      '<span class="at">' + esc(x.t || APP_KINDS[x.k] || "Bài") + '</span><span class="ago">›</span></button>';
  };
  return '<section class="apphomebox"><h2>Bài của em</h2>' +
    (list.length ? '<div class="applist">' + list.map(row).join("") + '</div>' :
      '<p class="hint">' + (lsGet(ME_KEY) ? 'Bài cô gửi bằng link qua Zalo: em dán link vào ô dưới đây.' : 'Chưa có bài nào. Em dán link cô gửi qua Zalo vào ô dưới đây là làm được ngay.') + '</p>') +
    '<label class="l" for="applink">Dán link bài cô gửi</label>' +
    '<div class="row" style="margin-top:0;flex-wrap:nowrap"><input class="t" id="applink" autocomplete="off" placeholder="Dán link vào đây"><button class="btn" id="appopen" type="button">Mở</button></div>' +
    '<p class="err" id="apperr" hidden></p></section>';
}
var studentLandingBase = studentLanding;
studentLanding = function(prefill){
  studentLandingBase(prefill);
  if(prefill && prefill.link) return;
  var title = app.querySelector("main.paper .title");
  if(!title) return;
  title.insertAdjacentHTML("afterend", appTodayHTML() + appHomeHTML());
  var sc = $("#scode");  // mã của bài làm qua link không nhập lại được ở ô mã → để trống
  if(sc && sc.type !== "hidden" && !DATA.assign[sc.value.trim().toUpperCase()]) sc.value = "";
  var list = lsGet(APP_KEY) || [];
  app.querySelectorAll(".appitem").forEach(function(b){ b.onclick = function(){ var x = list[+b.getAttribute("data-i")]; if(x) appGo(x.h); }; });
  var open = function(){
    var v = $("#applink").value.trim(), e = $("#apperr"), it = appParse(v);
    if(it){ appGo(it.h); return; }
    if(/^[A-Za-z0-9]{3,8}$/.test(v) && DATA.assign[v.toUpperCase()]){ $("#scode").value = v.toUpperCase(); $("#sname").focus(); e.hidden = true; return; }
    e.textContent = v ? "Link chưa đúng hoặc bị cắt. Em sao chép lại đủ cả link cô gửi nhé." : "Em dán link cô gửi vào ô trên nhé.";
    e.hidden = false;
  };
  $("#appopen").onclick = open;
  appTodayWire();
  $("#applink").addEventListener("keydown", function(e){ if(e.key === "Enter") open(); });
};
(function(){
  var st = document.createElement("style");
  st.textContent = ".apphomebox{margin:4px 0 22px;padding-bottom:18px;border-bottom:1px dashed var(--line)}" +
    ".apphomebox h2{font-size:17px;margin:0 0 8px}.applist{display:flex;flex-direction:column;gap:8px}" +
    ".appitem{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper)}" +
    ".appitem:hover,.appitem:focus-visible{border-color:var(--violet)}" +
    ".appitem .ak{grid-column:1;font-size:12px;color:var(--muted)}.appitem .at{grid-column:1;font-weight:600;overflow-wrap:anywhere}" +
    ".appitem .ago{grid-column:2;grid-row:1/3;align-self:center;font-size:22px;color:var(--violet)}" +
    ".apphome{padding:6px 10px;font-size:13.5px;margin-left:auto;margin-right:8px}" +
    ".appitem.done{background:var(--ok-soft);border-color:var(--ok)}.appitem .ok{color:var(--ok)}" +
    ".appsub{font-size:14.5px;margin:16px 0 6px}#appMe .grid2{margin-top:-4px}.appshare{margin-left:2px}";
  document.head.appendChild(st);
  window.addEventListener("popstate", appRun);
  new MutationObserver(appShareButtons).observe(app, {childList:true, subtree:true});
  document.addEventListener("click", function(e){ if(e.target.closest && e.target.closest(".apphome")) appHomeClick(); });
  if("serviceWorker" in navigator) window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
})();
appRun();
})();
</script>
